<title>Fold, then sc both sides</title>
<desc>Drawn to scale. A flat piece 53 sc, 13.1 in wide and 90 rows, 18 in tall, folded at the dashed line into a pocket. Right sides together. Sc through both layers, one per row end. Reinforce the bottom corners.</desc>
