<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 322" role="img">
<title>Ghost wallet: second side of the join</title>
<desc>Mirror the first side: 5 down the slope, 4 through the back only, 14 through both layers. Then slip stitch to the hem.</desc>
<rect width="480" height="322" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="16" y="40" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Ghost wallet: second side of the join</text>
<rect x="16" y="72" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="100" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Switch at the other row 14</text>
<text x="32" y="126" font-size="20" fill="#6d635a" text-anchor="start">Both layers again below the marker.</text>
<rect x="16" y="150" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="178" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Count 23 on this side</text>
<text x="32" y="204" font-size="20" fill="#6d635a" text-anchor="start">Then join to the first slip stitch.</text>
<rect x="16" y="228" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="256" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Test with a card</text>
<text x="32" y="282" font-size="20" fill="#6d635a" text-anchor="start">The opening must still take it.</text>
</svg>
