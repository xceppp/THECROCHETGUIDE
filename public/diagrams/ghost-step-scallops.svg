<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 322" role="img">
<title>Ghost wallet: four hem scallops</title>
<desc>Slip stitch in stitch 1, then four repeats of skip 1, 5 half double crochet, skip 1, slip stitch. That uses all 17 hem stitches.</desc>
<rect width="480" height="322" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="16" y="40" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Ghost wallet: four hem scallops</text>
<rect x="16" y="72" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="100" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Stitch 1 is a slip stitch</text>
<text x="32" y="126" font-size="20" fill="#6d635a" text-anchor="start">Through both layers.</text>
<rect x="16" y="150" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="178" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Each scallop uses 4 stitches</text>
<text x="32" y="204" font-size="20" fill="#6d635a" text-anchor="start">Skip, fan of 5, skip, slip stitch.</text>
<rect x="16" y="228" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="256" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Four scallops, then stop</text>
<text x="32" y="282" font-size="20" fill="#6d635a" text-anchor="start">1 + 16 = 17 hem stitches.</text>
</svg>
