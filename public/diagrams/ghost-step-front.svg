<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 322" role="img">
<title>The shorter front panel</title>
<desc>The front is 17 stitches by 14 rows. Its top edge is the opening.</desc>
<rect width="480" height="322" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="240" y="40" font-size="22" fill="#2f2a26" text-anchor="middle" font-weight="bold">Front panel</text>
<rect x="110" y="70" width="260" height="190" fill="#f6efe6" stroke="#2f2a26" stroke-width="3"/>
<line x1="110" y1="70" x2="370" y2="70" stroke="#b0604a" stroke-width="6"/>
<text x="240" y="160" font-size="22" fill="#2f2a26" text-anchor="middle">17 by 14 rows</text>
<text x="240" y="292" font-size="22" fill="#b0604a" text-anchor="middle">top edge stays open</text>
</svg>
