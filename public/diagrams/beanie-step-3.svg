<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 458" role="img">
<title>The crown by stitch count</title>
<desc>The crown by stitch count, as bars sized by stitch count. Round 0: 50, Round 1: 45, Round 2: 40, Round 3: 35, Round 4: 30, Round 5: 25, Round 6: 20, Round 7: 15, Round 8: 10, Round 9: 5. R0 is the last even body round. Each crown round removes 5.</desc>
<rect width="480" height="458" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<circle cx="36" cy="36" r="20" fill="#b0604a"/><text x="36" y="44" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">4</text><text x="66" y="44" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">The crown by stitch count</text><rect x="150" y="71" width="300" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="91" font-size="20" fill="#6d635a">R0</text><text x="140" y="91" font-size="20" fill="#2f2a26" text-anchor="end">50</text><rect x="165" y="101" width="270" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="121" font-size="20" fill="#6d635a">R1</text><text x="140" y="121" font-size="20" fill="#2f2a26" text-anchor="end">45</text><rect x="180" y="131" width="240" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="151" font-size="20" fill="#6d635a">R2</text><text x="140" y="151" font-size="20" fill="#2f2a26" text-anchor="end">40</text><rect x="195" y="161" width="210" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="181" font-size="20" fill="#6d635a">R3</text><text x="140" y="181" font-size="20" fill="#2f2a26" text-anchor="end">35</text><rect x="210" y="191" width="180" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="211" font-size="20" fill="#6d635a">R4</text><text x="140" y="211" font-size="20" fill="#2f2a26" text-anchor="end">30</text><rect x="225" y="221" width="150" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="241" font-size="20" fill="#6d635a">R5</text><text x="140" y="241" font-size="20" fill="#2f2a26" text-anchor="end">25</text><rect x="240" y="251" width="120" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="271" font-size="20" fill="#6d635a">R6</text><text x="140" y="271" font-size="20" fill="#2f2a26" text-anchor="end">20</text><rect x="255" y="281" width="90" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="301" font-size="20" fill="#6d635a">R7</text><text x="140" y="301" font-size="20" fill="#2f2a26" text-anchor="end">15</text><rect x="270" y="311" width="60" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="331" font-size="20" fill="#6d635a">R8</text><text x="140" y="331" font-size="20" fill="#2f2a26" text-anchor="end">10</text><rect x="285" y="341" width="30" height="24" rx="4" fill="#b0604a" stroke="#8f4a37"/><text x="20" y="361" font-size="20" fill="#6d635a">R9</text><text x="140" y="361" font-size="20" fill="#2f2a26" text-anchor="end">5</text><text x="20" y="392" font-size="20" fill="#6d635a" text-anchor="start">R0 is the last even body round. Each crown</text>
<text x="20" y="417" font-size="20" fill="#6d635a" text-anchor="start">round removes 5.</text>
