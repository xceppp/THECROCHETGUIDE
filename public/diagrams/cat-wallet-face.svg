<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 780" role="img">
<title>Black cat wallet: face embroidery map on the flap</title>
<desc>Closed flap, 16 stitches across, row 1 at the fold. Eyes on rows 3-4, nose on rows 5-6, whiskers on rows 5-7, snap under row 8.</desc>
<rect width="480" height="780" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="16" y="36" font-size="22" fill="#2f2a26">Flap seen closed. Row 1 is the top</text>
<text x="16" y="68" font-size="22" fill="#2f2a26">fold.</text>
<text x="16" y="132" font-size="22" fill="#2f2a26">Eyes, gold: rows 3-4, stitches 4-5</text>
<text x="16" y="164" font-size="22" fill="#2f2a26">and 12-13. Add a black vertical</text>
<text x="16" y="196" font-size="22" fill="#2f2a26">pupil.</text>
<text x="16" y="260" font-size="22" fill="#2f2a26">Nose, pink: rows 5-6, stitches 8 and</text>
<text x="16" y="292" font-size="22" fill="#2f2a26">9.</text>
<text x="16" y="356" font-size="22" fill="#2f2a26">Whiskers, white: three on each side,</text>
<text x="16" y="388" font-size="22" fill="#2f2a26">rows 5-7.</text>
<text x="16" y="452" font-size="22" fill="#2f2a26">Stitch k on the left matches stitch</text>
<text x="16" y="484" font-size="22" fill="#2f2a26">17 minus k. So 4 matches 13 and 5</text>
<text x="16" y="516" font-size="22" fill="#2f2a26">matches 12.</text>
<text x="16" y="580" font-size="22" fill="#2f2a26">Embroider with the flap folded shut.</text>
<text x="16" y="612" font-size="22" fill="#2f2a26">Upright on an open flap, the face</text>
<text x="16" y="644" font-size="22" fill="#2f2a26">ends upside down.</text>
<text x="16" y="708" font-size="22" fill="#2f2a26">The snap sits under row 8 at the</text>
<text x="16" y="740" font-size="22" fill="#2f2a26">center, on the underside.</text>
</g>
</svg>
