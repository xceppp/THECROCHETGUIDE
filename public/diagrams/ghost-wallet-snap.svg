<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 716" role="img">
<title>Ghost wallet: snap placement and card fit</title>
<desc>Socket on the back right side at row 13 stitch 9. Ball on the front wrong side at the same place. On paper the pocket is about 3.9 by 2.7 inches.</desc>
<rect width="480" height="716" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="16" y="36" font-size="22" fill="#2f2a26">Sew both halves before joining,</text>
<text x="16" y="68" font-size="22" fill="#2f2a26">while the panels are flat.</text>
<text x="16" y="132" font-size="22" fill="#2f2a26">Socket: right side of the back, row</text>
<text x="16" y="164" font-size="22" fill="#2f2a26">13, stitch 9. This face is inside</text>
<text x="16" y="196" font-size="22" fill="#2f2a26">the pocket.</text>
<text x="16" y="260" font-size="22" fill="#2f2a26">Ball: wrong side of the front, row</text>
<text x="16" y="292" font-size="22" fill="#2f2a26">13, stitch 9.</text>
<text x="16" y="356" font-size="22" fill="#2f2a26">Press the panels together. The</text>
<text x="16" y="388" font-size="22" fill="#2f2a26">halves should meet. Move one now if</text>
<text x="16" y="420" font-size="22" fill="#2f2a26">they miss.</text>
<text x="16" y="484" font-size="22" fill="#2f2a26">On paper the pocket is about 3.9 in</text>
<text x="16" y="516" font-size="22" fill="#2f2a26">wide and 2.7 in deep. An ID-1 card</text>
<text x="16" y="548" font-size="22" fill="#2f2a26">is 3.37 by 2.125 in.</text>
<text x="16" y="612" font-size="22" fill="#2f2a26">The snap should sit above the card.</text>
<text x="16" y="644" font-size="22" fill="#2f2a26">These sizes are from gauge, not a</text>
<text x="16" y="676" font-size="22" fill="#2f2a26">measured sample.</text>
</g>
</svg>
