<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
<title>Where the first half double goes</title>
<desc>The chain-2 is turned and does not count. The first half double of the new row goes into the first real stitch, at the base of that chain.</desc>
<rect width="640" height="420" fill="#fdfaf6"/>
<style>
  text { font-family: Georgia, "Times New Roman", serif; }
  .label { font-size: 22px; fill: #2f2a26; }
  .soft { font-size: 18px; fill: #6d635a; }
  .ink { fill: none; stroke: #2f2a26; stroke-width: 3; stroke-linecap: round; }
  .hook { fill: none; stroke: #b0604a; stroke-width: 4; stroke-linecap: round; }
  .mark { fill: none; stroke: #7d8b72; stroke-width: 3; }
</style>
<rect x="16" y="16" width="608" height="388" rx="10" fill="#f6efe6" stroke="#e6ddd1"/>
<text class="label" x="32" y="52">Chain-2 is height, not a stitch</text>
<path class="ink" d="M80 180 H420"/>
<text class="soft" x="80" y="160">row of real stitches</text>
<path class="hook" d="M80 180 V110"/>
<text class="soft" x="96" y="120">ch-2, skip it</text>
<path class="mark" d="M80 200 V250"/>
<text class="label" x="96" y="246">first hdc goes here</text>
<text class="soft" x="32" y="310">Into the chain instead: the row gains a stitch.</text>
<text class="soft" x="32" y="344">Skip this stitch: the row loses one.</text>
<text class="soft" x="32" y="378">Either mistake, repeated, turns the scarf into a wedge.</text>
</svg>
