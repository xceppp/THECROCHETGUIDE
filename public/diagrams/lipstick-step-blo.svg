<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img">
<title>Back loop turns the edge up</title>
<desc>One round of single crochet in the back loop only. Still 18 stitches.</desc>
<rect width="480" height="300" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="240" y="36" font-size="22" fill="#2f2a26" text-anchor="middle" font-weight="bold">Back loop turns the edge up</text>
<ellipse cx="240" cy="190" rx="100" ry="28" fill="#f6efe6" stroke="#2f2a26" stroke-width="3"/>
<path d="M140 190 V110 H340 V190" fill="#fdfaf6" stroke="#b0604a" stroke-width="4"/>
<text x="240" y="270" font-size="22" fill="#2f2a26" text-anchor="middle">still 18 stitches</text>
</svg>
