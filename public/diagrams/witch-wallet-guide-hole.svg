<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
<title>Witch hat buttonhole counts</title>
<desc>Row 31 is 7 single crochet, chain 3, skip 3, 7 single crochet. The hole sits over stitches 8, 9, and 10. Row 32 puts 3 single crochet in the chain space and returns to 17. Row 33 decreases at both ends and ends at 15.</desc>
<rect width="640" height="420" fill="#fdfaf6"/>
<style>
  text { font-family: Georgia, "Times New Roman", serif; }
  .label { font-size: 22px; fill: #2f2a26; }
  .soft { font-size: 18px; fill: #6d635a; }
</style>
<rect x="16" y="16" width="608" height="388" rx="10" fill="#f6efe6" stroke="#e6ddd1"/>
<text class="label" x="32" y="50">Count back to 17 before the last row</text>
<text class="label" x="32" y="100">Row 31</text>
<text class="soft" x="160" y="100">7 sc, chain 3, skip 3, 7 sc</text>
<text class="soft" x="160" y="132">Hole over stitches 8, 9, and 10</text>
<text class="label" x="32" y="180">Row 32</text>
<text class="soft" x="160" y="180">7 sc, 3 sc in the space, 7 sc</text>
<text class="soft" x="160" y="212">Count 17. 16 means 2 in the space.</text>
<text class="soft" x="160" y="244">18 means 4 in the space.</text>
<text class="label" x="32" y="292">Test the 5/8 in button here</text>
<text class="soft" x="32" y="328">Then row 33: decrease, 13 sc, decrease. Count 15.</text>
<text class="soft" x="32" y="370">The hat stays above this hole, on row 30.</text>
</svg>
