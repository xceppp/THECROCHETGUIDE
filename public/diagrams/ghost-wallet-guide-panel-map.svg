<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
<title>Ghost wallet: back panel and front panel lined up at the hem</title>
<desc>The back is 17 stitches wide for rows 1 to 18, then narrows on rows 19 to 22. The front is 17 stitches by 14 rows. Eight back rows show above the front. The face sits above row 14. The snap is on row 13.</desc>
<rect width="640" height="420" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="24" y="36" font-size="22" fill="#2f2a26">Hems matched. Front stops at row 14.</text>
<!-- back body rows 1-18 -->
<rect x="70" y="150" width="200" height="200" fill="#f6efe6" stroke="#2f2a26" stroke-width="2"/>
<!-- stepped top -->
<rect x="82" y="124" width="176" height="26" fill="#f6efe6" stroke="#2f2a26" stroke-width="2"/>
<rect x="94" y="98" width="152" height="26" fill="#f6efe6" stroke="#2f2a26" stroke-width="2"/>
<rect x="106" y="72" width="128" height="26" fill="#f6efe6" stroke="#2f2a26" stroke-width="2"/>
<rect x="118" y="48" width="104" height="24" fill="#7d8b72" stroke="#2f2a26" stroke-width="2"/>
<text x="170" y="66" text-anchor="middle" font-size="16" fill="#fdfaf6">Row 22: 9</text>
<text x="170" y="260" text-anchor="middle" font-size="18" fill="#2f2a26">Back</text>
<text x="170" y="286" text-anchor="middle" font-size="16" fill="#6d635a">Rows 1-18: 17</text>
<!-- front -->
<rect x="360" y="230" width="200" height="120" fill="#fdfaf6" stroke="#2f2a26" stroke-width="2"/>
<text x="460" y="284" text-anchor="middle" font-size="18" fill="#2f2a26">Front</text>
<text x="460" y="310" text-anchor="middle" font-size="16" fill="#6d635a">14 rows, 17 sc</text>
<line x1="360" y1="230" x2="560" y2="230" stroke="#b0604a" stroke-width="3"/>
<text x="460" y="218" text-anchor="middle" font-size="16" fill="#b0604a">Row 14, opening</text>
<!-- alignment note -->
<line x1="70" y1="230" x2="270" y2="230" stroke="#b0604a" stroke-width="2" stroke-dasharray="6 4"/>
<text x="24" y="390" font-size="18" fill="#2f2a26">Eight back rows sit above the front: 15, 16, 17, 18, then 19 to 22.</text>
<text x="24" y="414" font-size="16" fill="#6d635a">Face on rows 16 to 18. Snap on row 13, stitch 9. Both are gauge placements.</text>
</g>
</svg>
