<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 276" role="img">
<title>The whole holder by stitch count</title>
<desc>The whole holder by stitch count, as bars sized by stitch count. Round 1: 6, Round 2: 9, Rounds 3 to 12: 9. Rounds 3 to 12 are even, so the fabric turns straight up into a tube.</desc>
<rect width="480" height="276" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<circle cx="36" cy="36" r="20" fill="#b0604a"/><text x="36" y="44" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="66" y="44" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">The whole holder by stitch</text>
<text x="66" y="74" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">count</text><rect x="200" y="99" width="200" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="119" font-size="20" fill="#6d635a">R1</text><text x="140" y="119" font-size="20" fill="#2f2a26" text-anchor="end">6</text><rect x="150" y="129" width="300" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="149" font-size="20" fill="#6d635a">R2</text><text x="140" y="149" font-size="20" fill="#2f2a26" text-anchor="end">9</text><rect x="150" y="159" width="300" height="24" rx="4" fill="#b0604a" stroke="#8f4a37"/><text x="20" y="179" font-size="20" fill="#6d635a">R3–12</text><text x="140" y="179" font-size="20" fill="#2f2a26" text-anchor="end">9</text><text x="20" y="210" font-size="20" fill="#6d635a" text-anchor="start">Rounds 3 to 12 are even, so the fabric</text>
<text x="20" y="235" font-size="20" fill="#6d635a" text-anchor="start">turns straight up into a tube.</text>
</svg>
