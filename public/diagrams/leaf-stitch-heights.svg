<path class="tip" d="M214 210 L190 196 M214 210 L184 210 M214 210 L190 224"/>
<path class="outline" d="M500 210 C470 120 260 120 180 210 C260 300 470 300 500 210"/>
<text class="soft" x="520" y="186">skip</text>
<text class="soft" x="40" y="200">Tip: 3 sc</text>
<text class="soft" x="40" y="222">in one chain</text>
<text class="soft" x="220" y="120">First side: sc, hdc, dc x 4, hdc, sc = 8</text>
<text class="soft" x="220" y="314">Return: hdc, dc x 4, hdc, sc = 7</text>
<text class="soft" x="40" y="370">8 + 2 extra at the tip + 7 = 17 stitches. Base on the right, tip on the left.</text>
</svg>
