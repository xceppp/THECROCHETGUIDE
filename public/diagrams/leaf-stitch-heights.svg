<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
<title>A leaf from stitch heights on both sides of a chain</title>
<desc>A chain of 9 runs left to right. The first chain from the hook is skipped. Above the chain, stitches step up and down in height: single crochet, half double, four double crochet, half double, single crochet, in the 8 remaining chains. At the far end, 3 single crochet in the last chain make the tip. Below the chain, the return side mirrors the heights in the free loops of 7 chains: half double, four double, half double, single crochet. Total 17 stitches. The outline is a pointed oval.</desc>
<rect width="640" height="420" fill="#fdfaf6"/>
<style>
  text { font-family: Georgia, "Times New Roman", serif; }
  .label { font-size: 20px; fill: #2f2a26; }
  .soft { font-size: 16px; fill: #6d635a; }
  .ch { fill: #f6efe6; stroke: #6b4428; stroke-width: 2; }
  .st { fill: #f3e6d4; stroke: #6b4428; stroke-width: 1.5; }
  .tip { fill: #f3e6d4; stroke: #b0604a; stroke-width: 2.5; }
  .outline { fill: none; stroke: #7d8b72; stroke-width: 2.5; stroke-dasharray: 6 4; }
</style>
<rect x="16" y="16" width="608" height="388" rx="10" fill="#f6efe6" stroke="#e6ddd1"/>
<text class="label" x="32" y="46">Short stitches at the ends, tall in the middle</text>
<g>
