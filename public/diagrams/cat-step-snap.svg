<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 244" role="img">
<title>Black cat wallet: the snap</title>
<desc>Mark with a card inside. Ball under flap row 8 at its middle. Socket on the front at the mark, through the front only.</desc>
<rect width="480" height="244" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="16" y="40" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Black cat wallet: the snap</text>
<rect x="16" y="72" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="100" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Row 8 has 14 stitches</text>
<text x="32" y="126" font-size="20" fill="#6d635a" text-anchor="start">Middle is local stitches 7 and 8.</text>
<rect x="16" y="150" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="178" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Do not sew into the pocket</text>
<text x="32" y="204" font-size="20" fill="#6d635a" text-anchor="start">The needle stays in the front wall.</text>
</svg>
