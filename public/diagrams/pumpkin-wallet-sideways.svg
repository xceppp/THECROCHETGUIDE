<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 684" role="img">
<title>Pumpkin wallet: one sideways piece in back-loop ribbing</title>
<desc>Chain 21 gives 20 sc, the height. Rows set the width. Fold between stitches 10 and 11.</desc>
<rect width="480" height="684" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="16" y="36" font-size="22" fill="#2f2a26">Chain 21. Row 1: sc in the 2nd chain</text>
<text x="16" y="68" font-size="22" fill="#2f2a26">and across. (20)</text>
<text x="16" y="132" font-size="22" fill="#2f2a26">Later rows: ch 1, turn, sc in the</text>
<text x="16" y="164" font-size="22" fill="#2f2a26">back loop of each stitch. (20)</text>
<text x="16" y="228" font-size="22" fill="#2f2a26">Ch 1 is not a stitch.</text>
<text x="16" y="292" font-size="22" fill="#2f2a26">Stitches 1-10 are the front.</text>
<text x="16" y="324" font-size="22" fill="#2f2a26">Stitches 11-20 are the back.</text>
<text x="16" y="388" font-size="22" fill="#2f2a26">The fold is between stitches 10 and</text>
<text x="16" y="420" font-size="22" fill="#2f2a26">11.</text>
<text x="16" y="484" font-size="22" fill="#2f2a26">20 stitches are about 5 in, which</text>
<text x="16" y="516" font-size="22" fill="#2f2a26">folds to about 2.5 in.</text>
<text x="16" y="580" font-size="22" fill="#2f2a26">Work an even number of rows until</text>
<text x="16" y="612" font-size="22" fill="#2f2a26">the piece is about 4.25 in wide.</text>
<text x="16" y="644" font-size="22" fill="#2f2a26">About 22 rows at the example gauge.</text>
</g>
</svg>
