<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 556" role="img">
<title>Ghost wallet: face placement on the head</title>
<desc>Back panel rows 14-22, 17 stitches, stitch 9 at center. Eyes on rows 17-18 at stitches 6 and 12. Mouth and cheeks on row 16.</desc>
<rect width="480" height="556" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="16" y="36" font-size="22" fill="#2f2a26">Back panel only, before joining. Row</text>
<text x="16" y="68" font-size="22" fill="#2f2a26">14 is the pocket opening.</text>
<text x="16" y="132" font-size="22" fill="#2f2a26">Eyes, black: rows 17-18, stitches 6</text>
<text x="16" y="164" font-size="22" fill="#2f2a26">and 12.</text>
<text x="16" y="228" font-size="22" fill="#2f2a26">Mouth: row 16, stitch 9.</text>
<text x="16" y="292" font-size="22" fill="#2f2a26">Cheeks, pink: row 16, stitches 5 and</text>
<text x="16" y="324" font-size="22" fill="#2f2a26">13.</text>
<text x="16" y="388" font-size="22" fill="#2f2a26">Stitch k matches stitch 18 minus k.</text>
<text x="16" y="420" font-size="22" fill="#2f2a26">So 6 matches 12 and 5 matches 13.</text>
<text x="16" y="484" font-size="22" fill="#2f2a26">Do not stitch through the front</text>
<text x="16" y="516" font-size="22" fill="#2f2a26">panel. Row 14 stays the opening.</text>
</g>
</svg>
