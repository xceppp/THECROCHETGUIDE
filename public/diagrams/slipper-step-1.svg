<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 486" role="img">
<title>Three pieces per slipper</title>
<desc>Sole: 14 sc, 48 rows. Toe cap: 24 sc, 16 rows. Heel wall: 26 sc, 8 rows.</desc>
<rect width="480" height="486" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<circle cx="36" cy="36" r="20" fill="#b0604a"/><text x="36" y="44" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="66" y="44" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Three pieces per slipper</text><rect x="20" y="80" width="85.75" height="235.2" fill="#f6efe6" stroke="#6b4428" stroke-width="3"/><text x="62.875" y="341.2" font-size="20" fill="#2f2a26" text-anchor="middle" font-weight="bold">Sole</text><text x="62.875" y="365.2" font-size="20" fill="#6d635a" text-anchor="middle">14 sc</text><text x="62.875" y="389.2" font-size="20" fill="#6d635a" text-anchor="middle">48 rows</text><rect x="129.75" y="80" width="147" height="78.4" fill="#f6efe6" stroke="#6b4428" stroke-width="3"/><text x="203.25" y="184.4" font-size="20" fill="#2f2a26" text-anchor="middle" font-weight="bold">Toe cap</text><text x="203.25" y="208.4" font-size="20" fill="#6d635a" text-anchor="middle">24 sc</text><text x="203.25" y="232.4" font-size="20" fill="#6d635a" text-anchor="middle">16 rows</text><rect x="300.75" y="80" width="159.25" height="39.2" fill="#f6efe6" stroke="#6b4428" stroke-width="3"/><text x="380.375" y="145.2" font-size="20" fill="#2f2a26" text-anchor="middle" font-weight="bold">Heel wall</text><text x="380.375" y="169.2" font-size="20" fill="#6d635a" text-anchor="middle">26 sc</text><text x="380.375" y="193.2" font-size="20" fill="#6d635a" text-anchor="middle">8 rows</text><text x="20" y="419.2" font-size="20" fill="#6d635a" text-anchor="start">Chain one more than the stitch count for</text>
<text x="20" y="444.2" font-size="20" fill="#6d635a" text-anchor="start">each: 15, 25, and 27.</text>
</svg>
