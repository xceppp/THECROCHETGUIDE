<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 514" role="img">
<title>Lace bandana row 1</title>
<desc>A chain of 4. Every stitch of row 1 goes into the 4th chain from the hook: 2 double crochet, a chain-2 corner, then 3 double crochet. The 3 skipped chains stand up as the first double crochet, so the row has 6 double crochet and one corner.</desc>
<rect width="480" height="514" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<circle cx="36" cy="36" r="20" fill="#b0604a"/><text x="36" y="44" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="66" y="44" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Row 1: everything in one</text>
<text x="66" y="74" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">chain</text><circle cx="120" cy="278" r="8" fill="#6b4428"/><ellipse cx="150" cy="278" rx="19" ry="9" fill="none" stroke="#b0604a" stroke-width="4"/><ellipse cx="194" cy="278" rx="19" ry="9" fill="none" stroke="#7d8b72" stroke-width="4" stroke-dasharray="5 3"/><ellipse cx="238" cy="278" rx="19" ry="9" fill="none" stroke="#7d8b72" stroke-width="4" stroke-dasharray="5 3"/><ellipse cx="282" cy="278" rx="19" ry="9" fill="none" stroke="#7d8b72" stroke-width="4" stroke-dasharray="5 3"/><line x1="150" y1="270" x2="37.236885505691006" y2="236.95758280091974" stroke="#2f2a26" stroke-width="3"/><line x1="30.236885505691006" y1="236.95758280091974" x2="44.236885505691006" y2="236.95758280091974" stroke="#2f2a26" stroke-width="3" transform="rotate(-70 37.236885505691006 236.95758280091974)"/><line x1="150" y1="270" x2="65.14718625761431" y2="193.1471862576143" stroke="#2f2a26" stroke-width="3"/><line x1="58.14718625761431" y1="193.1471862576143" x2="72.14718625761431" y2="193.1471862576143" stroke="#2f2a26" stroke-width="3" transform="rotate(-45 65.14718625761431 193.1471862576143)"/><line x1="150" y1="270" x2="108.95758280091975" y2="165.236885505691" stroke="#2f2a26" stroke-width="3"/><line x1="101.95758280091975" y1="165.236885505691" x2="115.95758280091975" y2="165.236885505691" stroke="#2f2a26" stroke-width="3" transform="rotate(-20 108.95758280091975 165.236885505691)"/><line x1="150" y1="270" x2="210" y2="174.07695154586736" stroke="#2f2a26" stroke-width="3"/><line x1="203" y1="174.07695154586736" x2="217" y2="174.07695154586736" stroke="#2f2a26" stroke-width="3" transform="rotate(30 210 174.07695154586736)"/><line x1="150" y1="270" x2="248.29824531467904" y2="209.17082763787448" stroke="#2f2a26" stroke-width="3"/><line x1="241.29824531467904" y1="209.17082763787448" x2="255.29824531467904" y2="209.17082763787448" stroke="#2f2a26" stroke-width="3" transform="rotate(55 248.29824531467904 209.17082763787448)"/><path d="M108.95758280091975 165.236885505691 Q163.07336141214873 128.57079528623817 210 174.07695154586736" fill="none" stroke="#b0604a" stroke-width="4"/><text x="163.07336141214873" y="116.57079528623817" font-size="20" fill="#8f4a37" text-anchor="middle">ch-2 corner</text><path d="M282 270 q-10 -40 -80 -100" fill="none" stroke="#7d8b72" stroke-width="4" stroke-dasharray="6 4"/><text x="20" y="330" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Ch 4. Work 2 dc, ch 2, 3 dc all in</text>
<text x="20" y="357.5" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">the 4th chain from the hook</text>
<text x="20" y="385" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">(terracotta).</text><text x="20" y="418.5" font-size="20" fill="#7d8b72" text-anchor="start">The 3 skipped chains (green, dashed) stand</text>
<text x="20" y="443.5" font-size="20" fill="#7d8b72" text-anchor="start">up as the first dc. Row 1: 6 dc and one</text>
<text x="20" y="468.5" font-size="20" fill="#7d8b72" text-anchor="start">ch-2 corner.</text>
