<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 620" role="img">
<title>Market bag: 8-stitch handles</title>
<desc>Ninety-six band stitches in two halves of forty-eight. Each half is ten empty, eight handle, twelve empty, eight handle, ten empty.</desc>
<rect width="480" height="620" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif" fill="#2f2a26">
<text x="16" y="36" font-size="22" font-weight="bold">Market bag: 8-stitch handles</text>
<text x="16" y="76" font-size="20">Handle: chain 9.</text>
<text x="16" y="104" font-size="20">Sc in the 2nd chain and across.</text>
<text x="16" y="132" font-size="20">That is 8 sc. Keep 8 each row.</text>
<text x="16" y="176" font-size="20">One half of the band is 48:</text>
<rect x="16" y="196" width="80" height="64" fill="#e6ddd1" stroke="#7d8b72" stroke-width="2"/><text x="40" y="236" font-size="22">10</text>
<rect x="96" y="196" width="64" height="64" fill="#f3d7cc" stroke="#b0604a" stroke-width="2"/><text x="116" y="236" font-size="22">8</text>
<rect x="160" y="196" width="96" height="64" fill="#e6ddd1" stroke="#7d8b72" stroke-width="2"/><text x="188" y="236" font-size="22">12</text>
<rect x="256" y="196" width="64" height="64" fill="#f3d7cc" stroke="#b0604a" stroke-width="2"/><text x="276" y="236" font-size="22">8</text>
<rect x="320" y="196" width="80" height="64" fill="#e6ddd1" stroke="#7d8b72" stroke-width="2"/><text x="344" y="236" font-size="22">10</text>
<text x="16" y="300" font-size="20">The two shaded 8s are the</text>
<text x="16" y="328" font-size="20">handle ends. Repeat on the</text>
<text x="16" y="356" font-size="20">other 48 stitches.</text>
<text x="16" y="400" font-size="20">Sew all 8 stitches of each end</text>
<text x="16" y="428" font-size="20">through the three band rounds.</text>
<text x="16" y="468" font-size="20">Sew into the solid band only.</text>
<text x="16" y="496" font-size="20">Do not sew into a mesh space.</text>
<text x="16" y="540" font-size="20">This placement is not a load</text>
<text x="16" y="568" font-size="20">rating.</text>
</g>
</svg>
