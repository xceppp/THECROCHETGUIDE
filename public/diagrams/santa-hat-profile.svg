<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 603" role="img">
<title>Santa hat, tip to brim</title>
<desc>Santa hat, tip to brim, as bars sized by stitch count. Rounds 1 to 3: 6, Round 4: 9, Round 5: 9, Round 6: 12, Round 7: 12, Round 8: 15, Round 9: 15, Round 10: 18, Round 11: 18, Round 12: 21, Round 13: 21, Round 14: 24, Round 15: 24, Round 16: 27. Three stitches added every other round from round 4. The white brim adds two rounds of 27.</desc>
<rect width="480" height="603" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
