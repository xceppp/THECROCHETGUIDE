<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1011" role="img">
<title>Magic ring, step by step</title>
<desc>Four steps. 1: wrap the yarn around two fingers so the tail crosses over the working yarn. 2: insert the hook under the ring, catch the working yarn, and pull up a loop, then ch 1; the ch 1 is not a stitch. 3: work the stated number of sc into the ring, over both strands of the ring and the tail. 4: pull the tail to close the center, then count the stitches.</desc>
<rect width="480" height="1011" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<text x="20" y="44" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Magic ring, step by step</text><rect x="12" y="64" width="456" height="218.5" rx="10" fill="#f6efe6" stroke="#e6ddd1"/><circle cx="38" cy="90" r="15" fill="#b0604a"/><text x="38" y="97" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="62" y="97" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Wrap</text><circle cx="220" cy="154.5" r="34" fill="none" stroke="#6b4428" stroke-width="5"/><path d="M190 170.5 L140 200.5" stroke="#6b4428" stroke-width="5" stroke-linecap="round"/><path d="M248 172.5 L310 204.5" stroke="#6b4428" stroke-width="5" stroke-linecap="round"/><text x="116" y="194.5" font-size="20" fill="#6d635a" text-anchor="end">tail</text><text x="320" y="206.5" font-size="20" fill="#6d635a">to ball</text><text x="36" y="238.5" font-size="20" fill="#2f2a26" text-anchor="start">Loop the yarn so the tail crosses over</text>
<text x="36" y="263.5" font-size="20" fill="#2f2a26" text-anchor="start">the working yarn.</text><rect x="12" y="294.5" width="456" height="231.5" rx="10" fill="#f6efe6" stroke="#e6ddd1"/><circle cx="38" cy="320.5" r="15" fill="#b0604a"/><text x="38" y="327.5" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="62" y="327.5" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Pull up a loop, ch 1</text><circle cx="180" cy="385" r="34" fill="none" stroke="#6b4428" stroke-width="5"/><path d="M216 375 H350 q12 0 12 -12" fill="none" stroke="#b0604a" stroke-width="5" stroke-linecap="round"/><ellipse cx="250" cy="375" rx="12" ry="8" fill="none" stroke="#7d8b72" stroke-width="3"/><text x="36" y="457" font-size="20" fill="#2f2a26" text-anchor="start">Hook under the ring, catch the working</text>
<text x="36" y="482" font-size="20" fill="#2f2a26" text-anchor="start">yarn, pull up a loop, ch 1. The ch 1 is</text>
<text x="36" y="507" font-size="20" fill="#2f2a26" text-anchor="start">not a stitch.</text><rect x="12" y="538" width="456" height="226.5" rx="10" fill="#f6efe6" stroke="#e6ddd1"/><circle cx="38" cy="564" r="15" fill="#b0604a"/><text x="38" y="571" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">3</text><text x="62" y="571" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Stitches into the ring</text><circle cx="220" cy="638.5" r="34" fill="none" stroke="#6b4428" stroke-width="5"/><path d="M213 581.5L227 595.5M227 581.5L213 595.5" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M256.30127018922195 606.5L270.30127018922195 620.5M270.30127018922195 606.5L256.30127018922195 620.5" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M256.30127018922195 656.5L270.30127018922195 670.5M270.30127018922195 656.5L256.30127018922195 670.5" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M213 681.5L227 695.5M227 681.5L213 695.5" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M169.69872981077808 656.5L183.69872981077808 670.5M183.69872981077808 656.5L169.69872981077808 670.5" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M169.69872981077808 606.5L183.69872981077808 620.5M183.69872981077808 606.5L169.69872981077808 620.5" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><text x="36" y="720.5" font-size="20" fill="#2f2a26" text-anchor="start">Work each sc over both the ring and the</text>
<text x="36" y="745.5" font-size="20" fill="#2f2a26" text-anchor="start">tail. Six is the usual first round.</text><rect x="12" y="776.5" width="456" height="214.5" rx="10" fill="#f6efe6" stroke="#e6ddd1"/><circle cx="38" cy="802.5" r="15" fill="#b0604a"/><text x="38" y="809.5" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">4</text><text x="62" y="809.5" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Pull the tail tight</text><circle cx="220" cy="871" r="5" fill="#6b4428"/><path d="M220 876 V913" stroke="#6b4428" stroke-width="4"/><path d="M213 838L227 852M227 838L213 852" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M235.5166604983954 851L249.5166604983954 865M249.5166604983954 851L235.5166604983954 865" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M235.5166604983954 877L249.5166604983954 891M249.5166604983954 877L235.5166604983954 891" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M213 890L227 904M227 890L213 904" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M190.4833395016046 877L204.4833395016046 891M204.4833395016046 877L190.4833395016046 891" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M190.4833395016046 851L204.4833395016046 865M204.4833395016046 851L190.4833395016046 865" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><text x="36" y="947" font-size="20" fill="#2f2a26" text-anchor="start">The center closes. Count the stitches</text>
<text x="36" y="972" font-size="20" fill="#2f2a26" text-anchor="start">before you start the next round.</text>
</svg>
