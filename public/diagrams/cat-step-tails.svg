<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 244" role="img">
<title>Tails run inside the tube</title>
<desc>Each tail follows a fold, then changes direction once.</desc>
<rect width="480" height="244" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="240" y="36" font-size="22" fill="#2f2a26" text-anchor="middle" font-weight="bold">The tails</text>
<rect x="150" y="60" width="180" height="130" rx="12" fill="#f6efe6" stroke="#2f2a26" stroke-width="3"/>
<path d="M180 80 V160 H300" fill="none" stroke="#b0604a" stroke-width="4"/>
<text x="240" y="224" font-size="22" fill="#2f2a26" text-anchor="middle">inside, then turn once</text>
</svg>
