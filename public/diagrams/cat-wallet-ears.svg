<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 780" role="img">
<title>Black cat wallet: ear triangles and where they go</title>
<desc>Each ear is three rows: 5, then 3, then 1. On the 16-stitch fold the ears cover 5 stitches each, with 1 outside and 4 between.</desc>
<rect width="480" height="780" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="16" y="36" font-size="22" fill="#2f2a26" font-weight="bold">One ear, three rows:</text>
<text x="16" y="100" font-size="22" fill="#2f2a26">Row 1: chain 6, sc in the 2nd chain</text>
<text x="16" y="132" font-size="22" fill="#2f2a26">and across. (5)</text>
<text x="16" y="196" font-size="22" fill="#2f2a26">Row 2: ch 1, turn, sc2tog, sc,</text>
<text x="16" y="228" font-size="22" fill="#2f2a26">sc2tog. (3)</text>
<text x="16" y="292" font-size="22" fill="#2f2a26">Row 3: ch 1, turn, sc3tog. (1)</text>
<text x="16" y="356" font-size="22" fill="#2f2a26">About 1.25 in wide and 0.6 in tall</text>
<text x="16" y="388" font-size="22" fill="#2f2a26">at the example gauge.</text>
<text x="16" y="452" font-size="22" fill="#2f2a26" font-weight="bold">Placement on the 16-stitch fold:</text>
<text x="16" y="516" font-size="22" fill="#2f2a26">1 stitch, ear over 5, gap of 4, ear</text>
<text x="16" y="548" font-size="22" fill="#2f2a26">over 5, 1 stitch.</text>
<text x="16" y="612" font-size="22" fill="#2f2a26">1 + 5 + 4 + 5 + 1 = 16.</text>
<text x="16" y="676" font-size="22" fill="#2f2a26">Sew each ear's row-1 edge along the</text>
<text x="16" y="708" font-size="22" fill="#2f2a26">fold so the ear stands above the</text>
<text x="16" y="740" font-size="22" fill="#2f2a26">closed wallet.</text>
</g>
</svg>
