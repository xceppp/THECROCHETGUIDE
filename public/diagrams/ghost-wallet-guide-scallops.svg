<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
<title>Ghost wallet: four scallops across 17 hem stitches</title>
<desc>Hem stitch 1 is a slip stitch through both layers. Each scallop then uses four stitches: skip, five half double crochet in the next stitch, skip, slip stitch. Four scallops use the remaining 16 stitches.</desc>
<rect width="640" height="420" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="24" y="36" font-size="22" fill="#2f2a26">17 hem stitches, four scallops</text>
<text x="24" y="64" font-size="18" fill="#6d635a">1 slip stitch, then 4 times 4 stitches = 17</text>
<!-- stitch cells. width 32, start 24 -->
<rect x="20" y="100" width="32" height="48" fill="#b0604a"/>
<rect x="54" y="100" width="32" height="48" fill="#7d8b72"/>
<rect x="88" y="100" width="32" height="48" fill="#f6efe6" stroke="#b0604a" stroke-width="2"/>
<rect x="122" y="100" width="32" height="48" fill="#7d8b72"/>
<rect x="156" y="100" width="32" height="48" fill="#b0604a"/>
<rect x="190" y="100" width="32" height="48" fill="#7d8b72"/>
<rect x="224" y="100" width="32" height="48" fill="#f6efe6" stroke="#b0604a" stroke-width="2"/>
<rect x="258" y="100" width="32" height="48" fill="#7d8b72"/>
<rect x="292" y="100" width="32" height="48" fill="#b0604a"/>
<rect x="326" y="100" width="32" height="48" fill="#7d8b72"/>
<rect x="360" y="100" width="32" height="48" fill="#f6efe6" stroke="#b0604a" stroke-width="2"/>
<rect x="394" y="100" width="32" height="48" fill="#7d8b72"/>
<rect x="428" y="100" width="32" height="48" fill="#b0604a"/>
<rect x="462" y="100" width="32" height="48" fill="#7d8b72"/>
<rect x="496" y="100" width="32" height="48" fill="#f6efe6" stroke="#b0604a" stroke-width="2"/>
<rect x="530" y="100" width="32" height="48" fill="#7d8b72"/>
<rect x="564" y="100" width="32" height="48" fill="#b0604a"/>
<text x="36" y="90" text-anchor="middle" font-size="16" fill="#2f2a26">1</text>
<text x="70" y="90" text-anchor="middle" font-size="16" fill="#2f2a26">2</text>
<text x="104" y="90" text-anchor="middle" font-size="16" fill="#2f2a26">3</text>
<text x="138" y="90" text-anchor="middle" font-size="16" fill="#2f2a26">4</text>
<text x="172" y="90" text-anchor="middle" font-size="16" fill="#2f2a26">5</text>
<text x="206" y="90" text-anchor="middle" font-size="16" fill="#2f2a26">6</text>
<text x="240" y="90" text-anchor="middle" font-size="16" fill="#2f2a26">7</text>
<text x="274" y="90" text-anchor="middle" font-size="16" fill="#2f2a26">8</text>
<text x="308" y="90" text-anchor="middle" font-size="16" fill="#2f2a26">9</text>
<text x="342" y="90" text-anchor="middle" font-size="16" fill="#2f2a26">10</text>
<text x="376" y="90" text-anchor="middle" font-size="16" fill="#2f2a26">11</text>
<text x="410" y="90" text-anchor="middle" font-size="16" fill="#2f2a26">12</text>
<text x="444" y="90" text-anchor="middle" font-size="16" fill="#2f2a26">13</text>
<text x="478" y="90" text-anchor="middle" font-size="16" fill="#2f2a26">14</text>
<text x="512" y="90" text-anchor="middle" font-size="16" fill="#2f2a26">15</text>
<text x="546" y="90" text-anchor="middle" font-size="16" fill="#2f2a26">16</text>
<text x="580" y="90" text-anchor="middle" font-size="16" fill="#2f2a26">17</text>
<rect x="24" y="180" width="28" height="20" fill="#b0604a"/>
<text x="60" y="196" font-size="18" fill="#2f2a26">Slip stitch through both layers</text>
<rect x="24" y="214" width="28" height="20" fill="#7d8b72"/>
<text x="60" y="230" font-size="18" fill="#2f2a26">Skip this hem stitch</text>
<rect x="24" y="248" width="28" height="20" fill="#f6efe6" stroke="#b0604a" stroke-width="2"/>
<text x="60" y="264" font-size="18" fill="#2f2a26">5 half double crochet in this one stitch</text>
<text x="24" y="312" font-size="18" fill="#2f2a26">Scallop 1 uses stitches 2, 3, 4, and 5.</text>
<text x="24" y="340" font-size="18" fill="#2f2a26">Scallop 2 uses 6 to 9. Scallop 3 uses 10 to 13.</text>
<text x="24" y="368" font-size="18" fill="#2f2a26">Scallop 4 uses 14 to 17. Stitch 17 is the last slip stitch.</text>
<text x="24" y="400" font-size="18" fill="#6d635a">Stitches left over means a skip was missed. Ending early means an extra stitch.</text>
</g>
</svg>
