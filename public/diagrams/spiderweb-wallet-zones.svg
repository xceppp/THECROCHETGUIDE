<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 652" role="img">
<title>Spiderweb wallet: rectangle and pointed flap</title>
<desc>17 sc wide. Front rows 1-13, back 14-26, flap 27-34 decreasing to 1, then a chain-8 loop.</desc>
<rect width="480" height="652" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="16" y="36" font-size="22" fill="#2f2a26">Chain 18. Row 1: sc in the 2nd chain</text>
<text x="16" y="68" font-size="22" fill="#2f2a26">and across. (17)</text>
<text x="16" y="132" font-size="22" fill="#2f2a26">Ch 1 does not count as a stitch.</text>
<text x="16" y="196" font-size="22" fill="#2f2a26">Rows 1-13: front. It folds up. The</text>
<text x="16" y="228" font-size="22" fill="#2f2a26">chain edge becomes the rim.</text>
<text x="16" y="292" font-size="22" fill="#2f2a26">Rows 14-26: back, 13 rows, about 2.6</text>
<text x="16" y="324" font-size="22" fill="#2f2a26">in at the example gauge.</text>
<text x="16" y="388" font-size="22" fill="#2f2a26">Rows 27-34: flap. Each row is</text>
<text x="16" y="420" font-size="22" fill="#2f2a26">sc2tog, sc across, sc2tog.</text>
<text x="16" y="484" font-size="22" fill="#2f2a26">Flap counts: 15, 13, 11, 9, 7, 5, 3,</text>
<text x="16" y="516" font-size="22" fill="#2f2a26">then sc3tog. (1)</text>
<text x="16" y="580" font-size="22" fill="#2f2a26">Chain 8 at that stitch for the loop.</text>
<text x="16" y="612" font-size="22" fill="#2f2a26">Leave the top of the front open.</text>
</g>
</svg>
