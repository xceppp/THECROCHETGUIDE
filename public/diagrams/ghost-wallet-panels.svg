<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 684" role="img">
<title>Ghost wallet: back and front panels, row by row</title>
<desc>Both panels start chain 18 and are 17 sc wide. Back is 18 even rows then decreases to 15, 13, 11, 9. Front is 14 even rows.</desc>
<rect width="480" height="684" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="16" y="36" font-size="22" fill="#2f2a26">Both panels: chain 18. Sc in the 2nd</text>
<text x="16" y="68" font-size="22" fill="#2f2a26">chain and across. (17)</text>
<text x="16" y="132" font-size="22" fill="#2f2a26">Ch 1 turns. It is not a stitch.</text>
<text x="16" y="196" font-size="22" fill="#2f2a26">Back, rows 2-18: sc in each stitch.</text>
<text x="16" y="228" font-size="22" fill="#2f2a26">(17)</text>
<text x="16" y="292" font-size="22" fill="#2f2a26">Back rows 19-22: sc2tog at both</text>
<text x="16" y="324" font-size="22" fill="#2f2a26">ends. Counts 15, 13, 11, 9.</text>
<text x="16" y="388" font-size="22" fill="#2f2a26">Front, rows 2-14: sc in each stitch.</text>
<text x="16" y="420" font-size="22" fill="#2f2a26">(17)</text>
<text x="16" y="484" font-size="22" fill="#2f2a26">The top of front row 14 is the</text>
<text x="16" y="516" font-size="22" fill="#2f2a26">pocket opening. Leave it unjoined.</text>
<text x="16" y="580" font-size="22" fill="#2f2a26">About 4.25 in wide at the example</text>
<text x="16" y="612" font-size="22" fill="#2f2a26">gauge. Slide a card in before the</text>
<text x="16" y="644" font-size="22" fill="#2f2a26">edging.</text>
</g>
</svg>
