<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 509" role="img">
<title>Base: rounds 1 and 2</title>
<desc>Base: rounds 1 and 2, drawn as rings from the center out. Round 1: 6 sc in a magic ring, 6 stitches. Round 2: (sc, 2 sc in next) 3 times, 9 stitches.</desc>
<rect width="480" height="509" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<circle cx="36" cy="36" r="20" fill="#b0604a"/><text x="36" y="44" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="66" y="44" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Base: rounds 1 and 2</text><circle cx="240" cy="210" r="48.75" fill="none" stroke="#c9bfb3" stroke-width="1.5" /><circle cx="240" cy="210" r="113.75" fill="none" stroke="#b0604a" stroke-width="2" /><circle cx="240.0" cy="96.3" r="5" fill="#2f2a26"/><circle cx="313.1" cy="122.9" r="5" fill="#b0604a"/><circle cx="352.0" cy="190.2" r="5" fill="#b0604a"/><circle cx="338.5" cy="266.9" r="5" fill="#2f2a26"/><circle cx="278.9" cy="316.9" r="5" fill="#b0604a"/><circle cx="201.1" cy="316.9" r="5" fill="#b0604a"/><circle cx="141.5" cy="266.9" r="5" fill="#2f2a26"/><circle cx="128.0" cy="190.2" r="5" fill="#b0604a"/><circle cx="166.9" cy="122.9" r="5" fill="#b0604a"/><text x="240" y="219" font-size="26" fill="#2f2a26" text-anchor="middle" font-weight="bold">9</text><text x="20" y="374" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Round 2: (sc, 2 sc in next) 3 times</text>
<text x="20" y="401.5" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">(9)</text><text x="20" y="439" font-size="20" fill="#6d635a" text-anchor="start">Terracotta dots: the 2 stitches made by</text>
<text x="20" y="464" font-size="20" fill="#6d635a" text-anchor="start">each increase.</text>
</svg>
