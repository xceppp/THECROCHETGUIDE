<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 504" role="img">
<title>Lace bandana rows 1 to 4</title>
<desc>The bandana drawn as nested V shapes hanging from the long edge. Each row is a V with its corner at the point. Row 4 is drawn in full: four shells of three double crochet on each arm, counting the corner halves, one ch-2 corner at the point, and six ch-1 spaces. Row n has 6n double crochet: 6, 12, 18, 24.</desc>
<rect width="480" height="504" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<circle cx="36" cy="36" r="20" fill="#b0604a"/><text x="36" y="44" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="66" y="44" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Rows 1 to 4: the triangle</text>
<text x="66" y="74" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">grows from the corner</text><line x1="40" y1="118" x2="440" y2="118" stroke="#6b4428" stroke-width="3"/><text x="40" y="108" font-size="20" fill="#6d635a">long edge (row ends)</text><path d="M194 118 L240 164 L286 118" fill="none" stroke="#c9bfb3" stroke-width="1.5"/><text x="254" y="166" font-size="20" fill="#6d635a">6</text><path d="M148 118 L240 210 L332 118" fill="none" stroke="#c9bfb3" stroke-width="1.5"/><text x="254" y="212" font-size="20" fill="#6d635a">12</text><path d="M102 118 L240 256 L378 118" fill="none" stroke="#c9bfb3" stroke-width="1.5"/><text x="254" y="258" font-size="20" fill="#6d635a">18</text><path d="M56 118 L240 302 L424 118" fill="none" stroke="#b0604a" stroke-width="2.5"/><g transform="rotate(45 79 141)"><path d="M72 149 V133" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M79 149 V133" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M86 149 V133" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/></g><circle cx="102" cy="164" r="5" fill="#fdfaf6" stroke="#7d8b72" stroke-width="3"/><g transform="rotate(45 125 187)"><path d="M118 195 V179" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M125 195 V179" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M132 195 V179" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/></g><circle cx="148" cy="210" r="5" fill="#fdfaf6" stroke="#7d8b72" stroke-width="3"/><g transform="rotate(45 171 233)"><path d="M164 241 V225" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M171 241 V225" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M178 241 V225" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/></g><circle cx="194" cy="256" r="5" fill="#fdfaf6" stroke="#7d8b72" stroke-width="3"/><g transform="rotate(45 217 279)"><path d="M210 287 V271" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M217 287 V271" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M224 287 V271" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/></g><g transform="rotate(-45 401 141)"><path d="M394 149 V133" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M401 149 V133" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M408 149 V133" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/></g><circle cx="378" cy="164" r="5" fill="#fdfaf6" stroke="#7d8b72" stroke-width="3"/><g transform="rotate(-45 355 187)"><path d="M348 195 V179" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M355 195 V179" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M362 195 V179" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/></g><circle cx="332" cy="210" r="5" fill="#fdfaf6" stroke="#7d8b72" stroke-width="3"/><g transform="rotate(-45 309 233)"><path d="M302 241 V225" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M309 241 V225" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M316 241 V225" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/></g><circle cx="286" cy="256" r="5" fill="#fdfaf6" stroke="#7d8b72" stroke-width="3"/><g transform="rotate(-45 263 279)"><path d="M256 287 V271" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M263 287 V271" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M270 287 V271" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/></g><circle cx="240" cy="302" r="9" fill="#fdfaf6" stroke="#b0604a" stroke-width="4"/><text x="254" y="304" font-size="20" fill="#8f4a37">24</text><text x="440" y="308" font-size="20" fill="#6d635a" text-anchor="end">dc per row</text><text x="20" y="342" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Row n: n shells on each arm, 6n dc.</text><text x="20" y="375.5" font-size="20" fill="#8f4a37" text-anchor="start">Terracotta ring: the one ch-2 corner, (3</text>
<text x="20" y="400.5" font-size="20" fill="#8f4a37" text-anchor="start">dc, ch 2, 3 dc) every row.</text><text x="20" y="431.5" font-size="20" fill="#7d8b72" text-anchor="start">Green rings: ch-1 spaces, 2(n − 1) of</text>
<text x="20" y="456.5" font-size="20" fill="#7d8b72" text-anchor="start">them. Row 4 has 6.</text>
</svg>
