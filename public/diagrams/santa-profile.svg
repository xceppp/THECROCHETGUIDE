<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 541" role="img">
<title>Santa body and head, round by round</title>
<desc>Santa body and head, round by round, as bars sized by stitch count. Round 1: 6, Round 2: 12, Round 3: 18, Round 4: 24, Round 5: 30, Rounds 6 to 13: 30, Round 14: 24, Rounds 15 to 20: 24, Round 21: 18, Round 22: 12, Round 23: 6. Body: rounds 6 to 13 at 30. Round 14 drops to 24 for the shoulders. Head: rounds 15 to 20 at 24, then close.</desc>
<rect width="480" height="541" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<text x="20" y="44" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Santa body and head, round by</text>
<text x="20" y="74" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">round</text><rect x="270" y="99" width="60" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="119" font-size="20" fill="#6d635a">R1</text><text x="140" y="119" font-size="20" fill="#2f2a26" text-anchor="end">6</text><rect x="240" y="129" width="120" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="149" font-size="20" fill="#6d635a">R2</text><text x="140" y="149" font-size="20" fill="#2f2a26" text-anchor="end">12</text><rect x="210" y="159" width="180" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="179" font-size="20" fill="#6d635a">R3</text><text x="140" y="179" font-size="20" fill="#2f2a26" text-anchor="end">18</text><rect x="180" y="189" width="240" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="209" font-size="20" fill="#6d635a">R4</text><text x="140" y="209" font-size="20" fill="#2f2a26" text-anchor="end">24</text><rect x="150" y="219" width="300" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="239" font-size="20" fill="#6d635a">R5</text><text x="140" y="239" font-size="20" fill="#2f2a26" text-anchor="end">30</text><rect x="150" y="249" width="300" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="269" font-size="20" fill="#6d635a">R6–13</text><text x="140" y="269" font-size="20" fill="#2f2a26" text-anchor="end">30</text><rect x="180" y="279" width="240" height="24" rx="4" fill="#b0604a" stroke="#8f4a37"/><text x="20" y="299" font-size="20" fill="#6d635a">R14</text><text x="140" y="299" font-size="20" fill="#2f2a26" text-anchor="end">24</text><rect x="180" y="309" width="240" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="329" font-size="20" fill="#6d635a">R15–20</text><text x="140" y="329" font-size="20" fill="#2f2a26" text-anchor="end">24</text><rect x="210" y="339" width="180" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="359" font-size="20" fill="#6d635a">R21</text><text x="140" y="359" font-size="20" fill="#2f2a26" text-anchor="end">18</text><rect x="240" y="369" width="120" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="389" font-size="20" fill="#6d635a">R22</text><text x="140" y="389" font-size="20" fill="#2f2a26" text-anchor="end">12</text><rect x="270" y="399" width="60" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="419" font-size="20" fill="#6d635a">R23</text><text x="140" y="419" font-size="20" fill="#2f2a26" text-anchor="end">6</text><text x="20" y="450" font-size="20" fill="#6d635a" text-anchor="start">Body: rounds 6 to 13 at 30. Round 14 drops</text>
<text x="20" y="475" font-size="20" fill="#6d635a" text-anchor="start">to 24 for the shoulders. Head: rounds 15</text>
<text x="20" y="500" font-size="20" fill="#6d635a" text-anchor="start">to 20 at 24, then close.</text>
