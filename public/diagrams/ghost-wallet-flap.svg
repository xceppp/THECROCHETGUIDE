<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 556" role="img">
<title>Ghost mini wallet: flap rows</title>
<desc>Rows 29-30 stay at 16. Rows 31-33 decrease to 14, 12, and 10. Row 34 is 3 sc, chain 5, skip 4, 3 sc.</desc>
<rect width="480" height="556" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="16" y="36" font-size="22" fill="#2f2a26">Rows 29-30: sc in each stitch. (16)</text>
<text x="16" y="100" font-size="22" fill="#2f2a26">Row 31: sc2tog, sc 12, sc2tog. (14)</text>
<text x="16" y="164" font-size="22" fill="#2f2a26">Row 32: sc2tog, sc 10, sc2tog. (12)</text>
<text x="16" y="228" font-size="22" fill="#2f2a26">Row 33: sc2tog, sc 8, sc2tog. (10)</text>
<text x="16" y="292" font-size="22" fill="#2f2a26">Row 34: sc 3, chain 5, skip 4, sc 3.</text>
<text x="16" y="356" font-size="22" fill="#2f2a26">3 + 4 skipped + 3 = 10. Test the</text>
<text x="16" y="388" font-size="22" fill="#2f2a26">button before fastening off.</text>
<text x="16" y="452" font-size="22" fill="#2f2a26">The pocket sides stop at the</text>
<text x="16" y="484" font-size="22" fill="#2f2a26">opening. Do not sew the flap into</text>
<text x="16" y="516" font-size="22" fill="#2f2a26">the seam.</text>
</g>
</svg>
