<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" role="img">
<title>Gauge sets the stitch count</title>
<desc>Gauge and fit. At an example 4 single crochet per inch, 24 stitches measure 6.0 inches around and grip, 26 stitches measure 6.5 inches and is the worked example, 28 stitches measure 7.0 inches and is roomy. The case footprint perimeter is 6.48 inches, so 26 stitches sits closest.</desc>
<rect width="480" height="500" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<circle cx="36" cy="36" r="20" fill="#b0604a"/><text x="36" y="44" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">4</text><text x="66" y="44" font-size="24" fill="#2f2a26" font-weight="bold">Gauge sets the stitch count</text><text x="20" y="110" font-size="20" fill="#6d635a">Example gauge: 4 sc = 1 in. Perimeter 6.48 in.</text><rect x="20" y="122" width="440" height="48" fill="#fdfaf6" stroke="#c9bfb3" stroke-width="1.5"/><text x="40" y="150" font-size="22" fill="#2f2a26" font-weight="bold">24 sts</text><text x="190" y="150" font-size="22" fill="#2f2a26">6.0 in</text><text x="320" y="150" font-size="20" fill="#6d635a">snug, grips</text><rect x="20" y="178" width="440" height="48" fill="#f6e7df" stroke="#c9bfb3" stroke-width="1.5"/><text x="40" y="206" font-size="22" fill="#2f2a26" font-weight="bold">26 sts</text><text x="190" y="206" font-size="22" fill="#2f2a26">6.5 in</text><text x="320" y="206" font-size="20" fill="#6d635a">the example</text><rect x="20" y="234" width="440" height="48" fill="#fdfaf6" stroke="#c9bfb3" stroke-width="1.5"/><text x="40" y="262" font-size="22" fill="#2f2a26" font-weight="bold">28 sts</text><text x="190" y="262" font-size="22" fill="#2f2a26">7.0 in</text><text x="320" y="262" font-size="20" fill="#6d635a">roomy</text><text x="20" y="338" font-size="20" fill="#6d635a">Count stitches across 1 in of your base,</text><text x="20" y="364" font-size="20" fill="#6d635a">then pick the row nearest your perimeter.</text><text x="20" y="390" font-size="20" fill="#6d635a">Crochet stretches: 26 drops in and holds.</text>
</svg>
