<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 563" role="img">
<title>A flat circle in single crochet</title>
<desc>A flat circle in single crochet, drawn as rings from the center out. Round 1: 6 sc in a magic ring, 6 stitches. Round 2: 2 sc in each st, 12 stitches. Round 3: (sc, 2 sc in next) 6 times, 18 stitches. Round 4: (sc 2, 2 sc in next) 6 times, 24 stitches. Round 5: (sc 3, 2 sc in next) 6 times, 30 stitches. Round 3 uses the 12 stitches of round 2: 6 plain and 6 increases make 18.</desc>
<rect width="480" height="563" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<text x="20" y="44" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">A flat circle in single crochet</text><circle cx="240" cy="210" r="19.5" fill="none" stroke="#c9bfb3" stroke-width="1.5" /><circle cx="240" cy="210" r="45.5" fill="none" stroke="#c9bfb3" stroke-width="1.5" /><circle cx="240" cy="210" r="71.5" fill="none" stroke="#b0604a" stroke-width="2" /><circle cx="240" cy="210" r="97.5" fill="none" stroke="#e6ddd1" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="240" cy="210" r="123.5" fill="none" stroke="#e6ddd1" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="240.0" cy="138.5" r="5" fill="#2f2a26"/><circle cx="264.5" cy="142.8" r="5" fill="#b0604a"/><circle cx="286.0" cy="155.2" r="5" fill="#b0604a"/><circle cx="301.9" cy="174.3" r="5" fill="#2f2a26"/><circle cx="310.4" cy="197.6" r="5" fill="#b0604a"/><circle cx="310.4" cy="222.4" r="5" fill="#b0604a"/><circle cx="301.9" cy="245.8" r="5" fill="#2f2a26"/><circle cx="286.0" cy="264.8" r="5" fill="#b0604a"/><circle cx="264.5" cy="277.2" r="5" fill="#b0604a"/><circle cx="240.0" cy="281.5" r="5" fill="#2f2a26"/><circle cx="215.5" cy="277.2" r="5" fill="#b0604a"/><circle cx="194.0" cy="264.8" r="5" fill="#b0604a"/><circle cx="178.1" cy="245.8" r="5" fill="#2f2a26"/><circle cx="169.6" cy="222.4" r="5" fill="#b0604a"/><circle cx="169.6" cy="197.6" r="5" fill="#b0604a"/><circle cx="178.1" cy="174.3" r="5" fill="#2f2a26"/><circle cx="194.0" cy="155.2" r="5" fill="#b0604a"/><circle cx="215.5" cy="142.8" r="5" fill="#b0604a"/><text x="240" y="219" font-size="26" fill="#2f2a26" text-anchor="middle" font-weight="bold">18</text><text x="20" y="374" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Round 3: (sc, 2 sc in next) 6 times</text>
<text x="20" y="401.5" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">(18)</text><text x="20" y="439" font-size="20" fill="#6d635a" text-anchor="start">Terracotta dots: the 2 stitches made by</text>
<text x="20" y="464" font-size="20" fill="#6d635a" text-anchor="start">each increase.</text><text x="20" y="495" font-size="20" fill="#6d635a" text-anchor="start">Round 3 uses the 12 stitches of round 2: 6</text>
<text x="20" y="520" font-size="20" fill="#6d635a" text-anchor="start">plain and 6 increases make 18.</text>
</svg>
