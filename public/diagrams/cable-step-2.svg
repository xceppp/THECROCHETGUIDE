<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 415" role="img">
<title>Row 24: the buttonhole</title>
<desc>Buttonhole row over 8 stitches: sc 3, ch 3 over 2 skipped stitches, sc 3. Rows 1 to 23 are 8 sc. The button goes on row 3, centered.</desc>
