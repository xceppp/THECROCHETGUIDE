="228" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Sc 3, ch 3, skip 2, sc 3.</text><text x="20" y="265.5" font-size="20" fill="#7d8b72" text-anchor="start">Green circles: the 2 skipped stitches. The</text>
