<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 470" role="img">
<title>Cat ear: 6, 4, 2, 1</title>
<desc>Cat ear worked flat as a triangle. Row 1 has 6 single crochet. Row 2 decreases one stitch at each edge to 4. Row 3 decreases to 2. Row 4 is a single decrease to 1, the point. Make two.</desc>
<rect width="480" height="470" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<circle cx="36" cy="36" r="20" fill="#b0604a"/><text x="36" y="44" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">6</text><text x="66" y="44" font-size="24" fill="#2f2a26" font-weight="bold">Cat ear: 6, 4, 2, 1</text><text x="20" y="130" font-size="20" fill="#2f2a26" font-weight="bold">Row 1: 6 sc</text><rect x="300" y="110" width="132" height="26" fill="#322d2a"/><text x="448" y="130" font-size="20" fill="#6d635a">6</text><text x="20" y="190" font-size="20" fill="#2f2a26" font-weight="bold">Row 2: sc2tog, sc 2, sc2tog</text><rect x="322" y="170" width="88" height="26" fill="#322d2a"/><text x="448" y="190" font-size="20" fill="#6d635a">4</text><text x="20" y="250" font-size="20" fill="#2f2a26" font-weight="bold">Row 3: sc2tog, sc2tog</text><rect x="344" y="230" width="44" height="26" fill="#322d2a"/><text x="448" y="250" font-size="20" fill="#6d635a">2</text><text x="20" y="310" font-size="20" fill="#2f2a26" font-weight="bold">Row 4: sc2tog</text><rect x="355" y="290" width="22" height="26" fill="#322d2a"/><text x="448" y="310" font-size="20" fill="#6d635a">1</text><polygon points="300,110 432,110 366,330" fill="none" stroke="#b0604a" stroke-width="2"/><text x="20" y="370" font-size="20" fill="#6d635a">Each middle row loses 1 st each edge,</text><text x="20" y="396" font-size="20" fill="#6d635a">so it slopes to a point. Make two.</text><text x="20" y="422" font-size="20" fill="#6d635a">Leave a long tail to sew it on.</text>
</svg>
