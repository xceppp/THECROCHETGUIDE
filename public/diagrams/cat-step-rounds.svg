<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 322" role="img">
<title>Rounds around the tube</title>
<desc>Each round is 32 single crochet and does not turn.</desc>
<rect width="480" height="322" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="240" y="40" font-size="22" fill="#2f2a26" text-anchor="middle" font-weight="bold">The tube</text>
<ellipse cx="240" cy="160" rx="90" ry="110" fill="#f6efe6" stroke="#2f2a26" stroke-width="3"/>
<ellipse cx="240" cy="70" rx="70" ry="22" fill="#fdfaf6" stroke="#b0604a" stroke-width="3"/>
<text x="240" y="300" font-size="22" fill="#2f2a26" text-anchor="middle">do not turn</text>
</svg>
