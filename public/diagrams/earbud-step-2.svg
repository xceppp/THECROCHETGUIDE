<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 391" role="img">
<title>The whole pouch by stitch count</title>
<desc>The whole pouch by stitch count, as bars sized by stitch count. Round 1: 6, Round 2: 12, Round 3: 18, Round 4: 24, Round 5: 27, Rounds 6 to 18: 27. Base: rounds 1 to 5. Wall: 13 even rounds of 27, about 2.6 in tall at 5 rounds per inch.</desc>
<rect width="480" height="391" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<circle cx="36" cy="36" r="20" fill="#b0604a"/><text x="36" y="44" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="66" y="44" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">The whole pouch by stitch</text>
<text x="66" y="74" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">count</text><rect x="266.6666666666667" y="99" width="66.66666666666666" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="119" font-size="20" fill="#6d635a">R1</text><text x="140" y="119" font-size="20" fill="#2f2a26" text-anchor="end">6</text><rect x="233.33333333333334" y="129" width="133.33333333333331" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="149" font-size="20" fill="#6d635a">R2</text><text x="140" y="149" font-size="20" fill="#2f2a26" text-anchor="end">12</text><rect x="200" y="159" width="200" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="179" font-size="20" fill="#6d635a">R3</text><text x="140" y="179" font-size="20" fill="#2f2a26" text-anchor="end">18</text><rect x="166.66666666666669" y="189" width="266.66666666666663" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="209" font-size="20" fill="#6d635a">R4</text><text x="140" y="209" font-size="20" fill="#2f2a26" text-anchor="end">24</text><rect x="150" y="219" width="300" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="239" font-size="20" fill="#6d635a">R5</text><text x="140" y="239" font-size="20" fill="#2f2a26" text-anchor="end">27</text><rect x="150" y="249" width="300" height="24" rx="4" fill="#b0604a" stroke="#8f4a37"/><text x="20" y="269" font-size="20" fill="#6d635a">R6–18</text><text x="140" y="269" font-size="20" fill="#2f2a26" text-anchor="end">27</text><text x="20" y="300" font-size="20" fill="#6d635a" text-anchor="start">Base: rounds 1 to 5. Wall: 13 even rounds</text>
<text x="20" y="325" font-size="20" fill="#6d635a" text-anchor="start">of 27, about 2.6 in tall at 5 rounds per</text>
<text x="20" y="350" font-size="20" fill="#6d635a" text-anchor="start">inch.</text>
</svg>
