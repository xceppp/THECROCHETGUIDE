<title>Rows around the mug</title>
<desc>Rows around the mug. Rows of 12 sc drawn one symbol per stitch and worked back and forth, each starting with a turning chain (ch 1, not a st). Row 45 is highlighted. Every row: 12 sc. About 45 rows in the example. Stop when the strip reaches from one side of the handle to the other, relaxed.</desc>
