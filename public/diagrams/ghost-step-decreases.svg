<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" role="img">
<title>Ghost wallet: the wide hem and the narrow top</title>
<desc>Rows 1 to 18 stay 17 stitches wide. Only rows 19 to 22 step inward at the top, ending at 9 stitches. The hem is the wide bottom.</desc>
<rect width="480" height="560" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="24" y="40" font-size="24" font-weight="bold" fill="#2f2a26">Wide hem, narrow top</text>
<rect x="70" y="200" width="340" height="280" fill="#f6efe6" stroke="#2f2a26" stroke-width="3"/>
<polygon points="70,200 410,200 360,80 120,80" fill="#f6efe6" stroke="#b0604a" stroke-width="4"/>
<text x="240" y="160" font-size="22" font-weight="bold" fill="#b0604a" text-anchor="middle">rows 19–22</text>
<text x="240" y="360" font-size="22" fill="#2f2a26" text-anchor="middle">rows 1–18 stay wide</text>
<text x="240" y="520" font-size="22" font-weight="bold" fill="#2f2a26" text-anchor="middle">hem, the wide bottom</text>
</svg>
