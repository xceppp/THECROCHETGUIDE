<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img">
<title>Ghost wallet: rows 19 to 22</title>
<desc>Each row decreases at both ends. Counts are 15, then 13, then 11, then 9. The wide hem stays at the bottom.</desc>
<rect width="480" height="400" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="16" y="40" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Ghost wallet: rows 19 to 22</text>
<rect x="16" y="72" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="100" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Row 19 ends at 15</text>
<text x="32" y="126" font-size="20" fill="#6d635a" text-anchor="start">Decrease, 13 single crochet, decrease.</text>
<rect x="16" y="150" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="178" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Row 20 ends at 13</text>
<text x="32" y="204" font-size="20" fill="#6d635a" text-anchor="start">Decrease, 11 single crochet, decrease.</text>
<rect x="16" y="228" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="256" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Row 21 ends at 11</text>
<text x="32" y="282" font-size="20" fill="#6d635a" text-anchor="start">Decrease, 9 single crochet, decrease.</text>
<rect x="16" y="306" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="334" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Row 22 ends at 9</text>
<text x="32" y="360" font-size="20" fill="#6d635a" text-anchor="start">Decrease, 7 single crochet, decrease.</text>
</svg>
