<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 844" role="img">
<title>Granny square tote: two flat panels, no base</title>
<desc>Eight 4-round squares make two panels of two by two. Join the sides and the bottom. Leave the top open. There is no separate base.</desc>
<rect width="480" height="844" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="16" y="36" font-size="22" fill="#2f2a26">Make 8 squares, 4 rounds each.</text>
<text x="16" y="100" font-size="22" fill="#2f2a26">Join them into two panels, each 2</text>
<text x="16" y="132" font-size="22" fill="#2f2a26">squares by 2.</text>
<text x="16" y="196" font-size="22" fill="#2f2a26">One square edge is 19 sc. A panel</text>
<text x="16" y="228" font-size="22" fill="#2f2a26">edge is 19 + 19 = 38.</text>
<text x="16" y="292" font-size="22" fill="#2f2a26">Put the panels right sides together.</text>
<text x="16" y="356" font-size="22" fill="#2f2a26">Join both sides and the bottom.</text>
<text x="16" y="388" font-size="22" fill="#2f2a26">Leave the top open.</text>
<text x="16" y="452" font-size="22" fill="#2f2a26">There is no base strip and no boxed</text>
<text x="16" y="484" font-size="22" fill="#2f2a26">bottom.</text>
<text x="16" y="548" font-size="22" fill="#2f2a26">Then work two rounds around the</text>
<text x="16" y="580" font-size="22" fill="#2f2a26">opening and sew the straps into that</text>
<text x="16" y="612" font-size="22" fill="#2f2a26">edge.</text>
<text x="16" y="676" font-size="22" fill="#2f2a26">One panel's top, before the straps:</text>
<text x="16" y="708" font-size="22" fill="#2f2a26">17 + 17 = 34 sc.</text>
<text x="16" y="772" font-size="22" fill="#2f2a26">Strap placement on that 34: skip 8,</text>
<text x="16" y="804" font-size="22" fill="#2f2a26">sew 5, skip 8, sew 5, skip 8.</text>
</g>
</svg>
