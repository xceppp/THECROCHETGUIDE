<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1500" role="img">
<title>Granny tote: two flat panels, no base</title>
<desc>Eight 4-round squares make two panels of two by two. Join each pair of squares. Join the panels on both sides and the bottom. Leave the top open. A square seam is 19 positions, a panel seam is 38, and one panel top is 34. Strap placement on that 34 is 8, sew 5, 8, sew 5, 8.</desc>
<rect width="480" height="1500" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#7d8b72" stroke-width="1.5"/></pattern>
</defs>

<text x="16" y="36" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Two panels. No base.</text>
<rect x="40" y="80" width="80" height="80" fill="#f6efe6" stroke="#2f2a26" stroke-width="3"/><rect x="40" y="170" width="80" height="80" fill="#f6efe6" stroke="#2f2a26" stroke-width="3"/><rect x="130" y="80" width="80" height="80" fill="#f6efe6" stroke="#2f2a26" stroke-width="3"/><rect x="130" y="170" width="80" height="80" fill="#f6efe6" stroke="#2f2a26" stroke-width="3"/>
<line x1="120" y1="80" x2="120" y2="250" stroke="#b0604a" stroke-width="4"/>
<line x1="40" y1="160" x2="210" y2="160" stroke="#b0604a" stroke-width="4"/>
<text x="40" y="70" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">front 2 x 2</text>
<rect x="260" y="80" width="80" height="80" fill="#fff" stroke="#2f2a26" stroke-width="3"/><rect x="260" y="170" width="80" height="80" fill="#fff" stroke="#2f2a26" stroke-width="3"/><rect x="350" y="80" width="80" height="80" fill="#fff" stroke="#2f2a26" stroke-width="3"/><rect x="350" y="170" width="80" height="80" fill="#fff" stroke="#2f2a26" stroke-width="3"/>
<line x1="340" y1="80" x2="340" y2="250" stroke="#7d8b72" stroke-width="4"/>
<line x1="260" y1="160" x2="430" y2="160" stroke="#7d8b72" stroke-width="4"/>
<text x="260" y="70" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">back 2 x 2</text>
<text x="16" y="290" font-size="20" fill="#2f2a26" text-anchor="start">Colored lines: square-to-square joins.</text>
<text x="16" y="320" font-size="20" fill="#2f2a26" text-anchor="start" font-weight="bold">One square edge = 19 positions.</text>
<rect x="90" y="370" width="280" height="220" fill="#f6efe6" stroke="#2f2a26" stroke-width="3"/>
<line x1="90" y1="370" x2="90" y2="590" stroke="#b0604a" stroke-width="6"/>
<line x1="370" y1="370" x2="370" y2="590" stroke="#b0604a" stroke-width="6"/>
<line x1="90" y1="590" x2="370" y2="590" stroke="#b0604a" stroke-width="6"/>
<text x="180" y="480" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">flat bag</text>
<text x="150" y="516" font-size="20" fill="#2f2a26" text-anchor="start">front against back</text>
<text x="16" y="640" font-size="20" fill="#2f2a26" text-anchor="start" font-weight="bold">Join both sides and the bottom.</text>
<text x="16" y="670" font-size="20" fill="#2f2a26" text-anchor="start" font-weight="bold">Leave the top open. No base strip.</text>
<text x="16" y="710" font-size="20" fill="#2f2a26" text-anchor="start">A panel side is 19 + 19 = 38.</text>
<text x="16" y="750" font-size="20" fill="#2f2a26" text-anchor="start">One panel top is 34.</text>
<rect x="12" y="790" width="456" height="280" rx="10" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="28" y="822" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Strap places on one 34-stitch top</text>
<rect x="30" y="860" width="80" height="40" fill="#fff" stroke="#2f2a26"/>
<rect x="110" y="850" width="60" height="60" fill="#b0604a"/>
<rect x="170" y="860" width="80" height="40" fill="#fff" stroke="#2f2a26"/>
<rect x="250" y="850" width="60" height="60" fill="#b0604a"/>
<rect x="310" y="860" width="80" height="40" fill="#fff" stroke="#2f2a26"/>
<text x="50" y="888" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">8</text>
<text x="128" y="888" font-size="22" fill="#fdfaf6" text-anchor="start" font-weight="bold">5</text>
<text x="190" y="888" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">8</text>
<text x="268" y="888" font-size="22" fill="#fdfaf6" text-anchor="start" font-weight="bold">5</text>
<text x="330" y="888" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">8</text>
<text x="28" y="960" font-size="20" fill="#2f2a26" text-anchor="start">Skip 8, sew 5, skip 8, sew 5, skip 8.</text>
<text x="28" y="1000" font-size="20" fill="#2f2a26" text-anchor="start">Sew through both edge rounds.</text>
<text x="16" y="1120" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">8 + 5 + 8 + 5 + 8 = 34.</text>
<text x="16" y="1180" font-size="20" fill="#2f2a26" text-anchor="start">Do the same count on the other panel.</text>
<text x="16" y="1240" font-size="20" fill="#6d635a" text-anchor="start">Legend: terra blocks = strap ends.</text>
<text x="16" y="1270" font-size="20" fill="#6d635a" text-anchor="start">White blocks = skipped stitches.</text>

</svg>
