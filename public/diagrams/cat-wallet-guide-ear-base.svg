<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
<title>Black cat wallet: ear bases on the 16-stitch fold</title>
<desc>Sixteen fold stitches in order. Skip 1, ear over the next 5, gap of 4, ear over the next 5, skip 1. The sum is 16, so the ears sit level with each other.</desc>
<rect width="640" height="420" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="24" y="40" font-size="22" fill="#2f2a26">Fold stitches, left to right</text>
<text x="24" y="72" font-size="18" fill="#6d635a">1 + 5 + 4 + 5 + 1 = 16</text>
<!-- 16 cells, x from 24, width 36, gap 2 -->
<rect x="24" y="110" width="34" height="64" fill="#f6efe6" stroke="#2f2a26"/>
<rect x="60" y="110" width="34" height="64" fill="#b0604a"/>
<rect x="96" y="110" width="34" height="64" fill="#b0604a"/>
<rect x="132" y="110" width="34" height="64" fill="#b0604a"/>
<rect x="168" y="110" width="34" height="64" fill="#b0604a"/>
<rect x="204" y="110" width="34" height="64" fill="#b0604a"/>
<rect x="240" y="110" width="34" height="64" fill="#f6efe6" stroke="#7d8b72"/>
<rect x="276" y="110" width="34" height="64" fill="#f6efe6" stroke="#7d8b72"/>
<rect x="312" y="110" width="34" height="64" fill="#f6efe6" stroke="#7d8b72"/>
<rect x="348" y="110" width="34" height="64" fill="#f6efe6" stroke="#7d8b72"/>
<rect x="384" y="110" width="34" height="64" fill="#b0604a"/>
<rect x="420" y="110" width="34" height="64" fill="#b0604a"/>
<rect x="456" y="110" width="34" height="64" fill="#b0604a"/>
<rect x="492" y="110" width="34" height="64" fill="#b0604a"/>
<rect x="528" y="110" width="34" height="64" fill="#b0604a"/>
<rect x="564" y="110" width="34" height="64" fill="#f6efe6" stroke="#2f2a26"/>
<text x="41" y="100" text-anchor="middle" font-size="16" fill="#2f2a26">1</text>
<text x="77" y="100" text-anchor="middle" font-size="16" fill="#2f2a26">2</text>
<text x="113" y="100" text-anchor="middle" font-size="16" fill="#2f2a26">3</text>
<text x="149" y="100" text-anchor="middle" font-size="16" fill="#2f2a26">4</text>
<text x="185" y="100" text-anchor="middle" font-size="16" fill="#2f2a26">5</text>
<text x="221" y="100" text-anchor="middle" font-size="16" fill="#2f2a26">6</text>
<text x="257" y="100" text-anchor="middle" font-size="16" fill="#2f2a26">7</text>
<text x="293" y="100" text-anchor="middle" font-size="16" fill="#2f2a26">8</text>
<text x="329" y="100" text-anchor="middle" font-size="16" fill="#2f2a26">9</text>
<text x="365" y="100" text-anchor="middle" font-size="16" fill="#2f2a26">10</text>
<text x="401" y="100" text-anchor="middle" font-size="16" fill="#2f2a26">11</text>
<text x="437" y="100" text-anchor="middle" font-size="16" fill="#2f2a26">12</text>
<text x="473" y="100" text-anchor="middle" font-size="16" fill="#2f2a26">13</text>
<text x="509" y="100" text-anchor="middle" font-size="16" fill="#2f2a26">14</text>
<text x="545" y="100" text-anchor="middle" font-size="16" fill="#2f2a26">15</text>
<text x="581" y="100" text-anchor="middle" font-size="16" fill="#2f2a26">16</text>
<text x="41" y="148" text-anchor="middle" font-size="16" fill="#2f2a26">skip</text>
<text x="149" y="200" text-anchor="middle" font-size="18" fill="#b0604a">First ear, stitches 2 to 6</text>
<text x="320" y="230" text-anchor="middle" font-size="18" fill="#7d8b72">Gap, stitches 7 to 10</text>
<text x="473" y="260" text-anchor="middle" font-size="18" fill="#b0604a">Second ear, stitches 11 to 15</text>
<text x="24" y="310" font-size="18" fill="#2f2a26">Each ear's row-1 edge is 5 stitches. Sew that edge to the fold.</text>
<text x="24" y="342" font-size="18" fill="#2f2a26">Tack both ears, then open the flap all the way.</text>
<text x="24" y="374" font-size="18" fill="#6d635a">If a base crosses the opening, the flap will not lie flat.</text>
<text x="24" y="406" font-size="18" fill="#6d635a">Stitch 16 is the other skip. It balances stitch 1.</text>
</g>
</svg>
