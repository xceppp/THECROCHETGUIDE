<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 322" role="img">
<title>Hems together</title>
<desc>The shorter front sits on the taller back. Both are 17 stitches wide.</desc>
<rect width="480" height="322" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="240" y="40" font-size="22" fill="#2f2a26" text-anchor="middle" font-weight="bold">Match the hems</text>
<rect x="120" y="58" width="240" height="210" fill="#f6efe6" stroke="#2f2a26" stroke-width="3"/>
<rect x="120" y="128" width="240" height="140" fill="#fdfaf6" stroke="#b0604a" stroke-width="3"/>
<text x="240" y="100" font-size="22" fill="#6d635a" text-anchor="middle">back</text>
<text x="240" y="200" font-size="22" fill="#2f2a26" text-anchor="middle">front</text>
<text x="240" y="300" font-size="22" fill="#2f2a26" text-anchor="middle">hems line up at the bottom</text>
</svg>
