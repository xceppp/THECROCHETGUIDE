<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 322" role="img">
<title>Ghost wallet: match the panels</title>
<desc>Hems together, 17 stitches on both, eight back rows showing above the front. Remake a panel that is a different width.</desc>
<rect width="480" height="322" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="16" y="40" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Ghost wallet: match the panels</text>
<rect x="16" y="72" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="100" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Hems at the bottom</text>
<text x="32" y="126" font-size="20" fill="#6d635a" text-anchor="start">Chain edges touch, stitch for stitch.</text>
<rect x="16" y="150" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="178" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Count both widths</text>
<text x="32" y="204" font-size="20" fill="#6d635a" text-anchor="start">Both must be 17.</text>
<rect x="16" y="228" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="256" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Do not stretch a short panel</text>
<text x="32" y="282" font-size="20" fill="#6d635a" text-anchor="start">Remake it if the ruler disagrees.</text>
</svg>
