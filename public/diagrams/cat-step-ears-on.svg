<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 244" role="img">
<title>Black cat wallet: ears on the fold</title>
<desc>Skip 1 stitch, ear over 5, gap of 4, ear over 5, skip 1. The bases must not bridge the opening.</desc>
<rect width="480" height="244" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="16" y="40" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Black cat wallet: ears on the fold</text>
<rect x="16" y="72" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="100" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">1 + 5 + 4 + 5 + 1 = 16</text>
<text x="32" y="126" font-size="20" fill="#6d635a" text-anchor="start">That uses the whole fold.</text>
<rect x="16" y="150" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="178" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Tack, then open the flap</text>
<text x="32" y="204" font-size="20" fill="#6d635a" text-anchor="start">Sew the base twice after the check.</text>
</svg>
