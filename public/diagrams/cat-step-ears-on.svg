<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 244" role="img">
<title>Two ears on the fold</title>
<desc>Each ear covers five stitches, with a gap between them.</desc>
<rect width="480" height="244" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="240" y="36" font-size="22" fill="#2f2a26" text-anchor="middle" font-weight="bold">Ears on the fold</text>
<rect x="90" y="120" width="300" height="70" fill="#f6efe6" stroke="#2f2a26" stroke-width="3"/>
<polygon points="140,120 180,60 220,120" fill="#fdfaf6" stroke="#b0604a" stroke-width="3"/>
<polygon points="260,120 300,60 340,120" fill="#fdfaf6" stroke="#b0604a" stroke-width="3"/>
<text x="240" y="224" font-size="22" fill="#2f2a26" text-anchor="middle">gap between the ears</text>
</svg>
