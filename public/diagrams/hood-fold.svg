<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
<title>Folding a rectangle into a hood</title>
<desc>Fold the width in half. The fold is center back. Seam one edge for the crown. Opened out, the bottom edge is still the full width. Depth from the fold to the face is half the width.</desc>
<rect width="640" height="420" fill="#fdfaf6"/>
<style>
  text { font-family: Georgia, "Times New Roman", serif; }
  .label { font-size: 20px; fill: #2f2a26; }
  .soft { font-size: 16px; fill: #6d635a; }
  .ink { fill: none; stroke: #2f2a26; stroke-width: 3; stroke-linecap: round; }
  .hook { fill: none; stroke: #b0604a; stroke-width: 4; stroke-linecap: round; }
  .mark { fill: none; stroke: #7d8b72; stroke-width: 3; stroke-dasharray: 6 4; }
</style>
<rect x="16" y="16" width="608" height="388" rx="10" fill="#f6efe6" stroke="#e6ddd1"/>
<text class="label" x="32" y="46">Flat rectangle</text>
<rect x="40" y="70" width="250" height="140" fill="#f3e6d4" stroke="#6b4428" stroke-width="6"/>
<text class="soft" x="120" y="148">width W</text>
<text class="soft" x="48" y="230">height H</text>
<path class="mark" d="M165 70 V210"/>
<text class="label" x="330" y="46">Folded, fold at the left</text>
<rect x="340" y="70" width="125" height="140" fill="#f3e6d4" stroke="#6b4428" stroke-width="6"/>
<path class="hook" d="M340 70 H465"/>
<text class="soft" x="348" y="100">crown seam</text>
<text class="soft" x="348" y="150">depth W/2</text>
<path class="ink" d="M340 210 H465"/>
<text class="soft" x="340" y="240">opened edge = W</text>
<text class="label" x="40" y="290">Failed example: W is 12 in, so the open edge is 12 in</text>
<text class="soft" x="40" y="322">and the depth is 6 in. Adult head charts start at 21 in.</text>
<text class="soft" x="40" y="354">Do not add rows to fix an opening. The opening is the width.</text>
<text class="soft" x="40" y="386">Measure a hood that fits. Do not invent a replacement width.</text>
</svg>
