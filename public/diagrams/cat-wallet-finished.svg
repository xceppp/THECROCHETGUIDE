<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 652" role="img">
<title>Black cat wallet: closed size on paper</title>
<desc>Outside about 4.0 by 2.4 inches at the example gauge, ears extra. Inside about 3.8 by 2.3. Not a measured sample.</desc>
<rect width="480" height="652" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="16" y="36" font-size="22" fill="#2f2a26">Outside, from the example gauge:</text>
<text x="16" y="68" font-size="22" fill="#2f2a26">about 4.0 in wide and 2.4 in tall.</text>
<text x="16" y="132" font-size="22" fill="#2f2a26">The ears stand above that, on the</text>
<text x="16" y="164" font-size="22" fill="#2f2a26">fold.</text>
<text x="16" y="228" font-size="22" fill="#2f2a26">Inside on paper: about 3.8 in wide</text>
<text x="16" y="260" font-size="22" fill="#2f2a26">and 2.3 in deep.</text>
<text x="16" y="324" font-size="22" fill="#2f2a26">An ID-1 card is 3.37 by 2.125 in.</text>
<text x="16" y="388" font-size="22" fill="#2f2a26">Slip the card in at round 10, before</text>
<text x="16" y="420" font-size="22" fill="#2f2a26">the flap.</text>
<text x="16" y="484" font-size="22" fill="#2f2a26">The closure is a snap, not a zipper.</text>
<text x="16" y="548" font-size="22" fill="#2f2a26">These inches are calculations. They</text>
<text x="16" y="580" font-size="22" fill="#2f2a26">are not measurements from a finished</text>
<text x="16" y="612" font-size="22" fill="#2f2a26">wallet.</text>
</g>
</svg>
