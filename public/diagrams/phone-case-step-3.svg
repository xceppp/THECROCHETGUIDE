<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 678" role="img">
<title>Fold in half, seam both sides</title>
<desc>Drawn to scale. A flat piece 16 sc, 3.9 in wide and 70 rows, 14 in tall, folded at the dashed line into a pocket. Right side in. Whipstitch each side from the fold up, through the outer loops only. Top stays open. Each side ends up about 7 in deep: the phone's 6.43 in plus the fold and a collar.</desc>
<rect width="480" height="678" fill="#fdfaf6"/>
