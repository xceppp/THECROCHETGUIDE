<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
<title>Where the hood meets the scarf</title>
<desc>Sew the hood's open bottom to the center of one long edge of the scarf. Sewing across the scarf's width pulls the fabric up toward the face.</desc>
<rect width="640" height="420" fill="#fdfaf6"/>
<style>
  text { font-family: Georgia, "Times New Roman", serif; }
  .label { font-size: 22px; fill: #2f2a26; }
  .soft { font-size: 18px; fill: #6d635a; }
  .ink { fill: none; stroke: #2f2a26; stroke-width: 3; stroke-linecap: round; }
  .hook { fill: none; stroke: #b0604a; stroke-width: 4; stroke-linecap: round; }
  .mark { fill: none; stroke: #7d8b72; stroke-width: 3; stroke-dasharray: 5 4; }
</style>
<rect x="16" y="16" width="608" height="388" rx="10" fill="#f6efe6" stroke="#e6ddd1"/>
<text class="label" x="32" y="48">Sew to one long edge, at the center</text>
<rect x="48" y="150" width="544" height="70" fill="#f3e6d4" stroke="#6b4428" stroke-width="6"/>
<path class="mark" d="M320 150 V220"/>
<text class="soft" x="292" y="244">center</text>
<rect x="250" y="78" width="140" height="72" fill="#f6efe6" stroke="#7d8b72" stroke-width="4"/>
<path class="hook" d="M250 150 H390"/>
<text class="soft" x="286" y="112">hood</text>
<text class="label" x="48" y="310">The seam is the line where the hood touches the scarf edge.</text>
<text class="soft" x="48" y="348">A seam that crosses the scarf, toward the far edge, can</text>
<text class="soft" x="48" y="376">drag the scarf up. Take that seam out and retry.</text>
</svg>
