<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
<title>Straight seam and a twisted seam</title>
<desc>Match the short ends without a twist so the rib stays a loop. A half twist makes the rib spiral around the head.</desc>
<rect width="640" height="420" fill="#fdfaf6"/>
<style>
  text { font-family: Georgia, "Times New Roman", serif; }
  .label { font-size: 22px; fill: #2f2a26; }
  .soft { font-size: 18px; fill: #6d635a; }
  .ink { fill: none; stroke: #2f2a26; stroke-width: 4; stroke-linecap: round; }
  .bad { fill: none; stroke: #b0604a; stroke-width: 4; stroke-linecap: round; }
</style>
<rect x="16" y="16" width="608" height="388" rx="10" fill="#f6efe6" stroke="#e6ddd1"/>
<text class="label" x="40" y="70">Ends matched</text>
<path class="ink" d="M60 120 H200"/>
<path class="ink" d="M60 160 H200"/>
<text class="soft" x="40" y="210">Rib stays a band</text>
<text class="label" x="340" y="70">One end flipped</text>
<path class="bad" d="M360 120 H500"/>
<path class="bad" d="M360 160 C420 120, 440 200, 500 140"/>
<text class="soft" x="330" y="210">Rib spirals</text>
<text class="soft" x="32" y="300">Lay the strip flat. Both short ends face the same way.</text>
<text class="soft" x="32" y="336">Then sew. A nape seam is a preference.</text>
<text class="soft" x="32" y="372">It is not a tested fit.</text>
</svg>
