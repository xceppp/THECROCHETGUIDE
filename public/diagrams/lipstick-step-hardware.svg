<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img">
<title>Fold the strap through the ring</title>
<desc>Both ends are sewn to the outside, below the opening.</desc>
<rect width="480" height="300" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="240" y="36" font-size="22" fill="#2f2a26" text-anchor="middle" font-weight="bold">Fold the strap through the ring</text>
<circle cx="240" cy="80" r="22" fill="none" stroke="#7d8b72" stroke-width="5"/>
<path d="M210 90 V200 H270 V90" fill="none" stroke="#b0604a" stroke-width="4"/>
<rect x="150" y="190" width="180" height="50" fill="#f6efe6" stroke="#2f2a26" stroke-width="3"/>
<text x="240" y="275" font-size="22" fill="#2f2a26" text-anchor="middle">sew both ends</text>
</svg>
