<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" role="img">
<title>Oval base: 20, then 26</title>
<desc>Oval base worked around a foundation chain of 9. Round 1: single crochet 7 along one side, 3 in the end, 7 along the opposite side, 3 in the other end, total 20 stitches. Round 2: double the 3-stitch ends to 6 each and leave the two straight sides of 7 unworked for 26 stitches. The increases fall only at the two rounded ends.</desc>
<rect width="480" height="540" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<circle cx="36" cy="36" r="20" fill="#b0604a"/><text x="36" y="44" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="66" y="44" font-size="24" fill="#2f2a26" font-weight="bold">Oval base: 20, then 26</text><ellipse cx="240" cy="150" rx="150" ry="70" fill="none" stroke="#b0604a" stroke-width="2"/><ellipse cx="240" cy="150" rx="120" ry="44" fill="none" stroke="#c9bfb3" stroke-width="2"/><line x1="170" y1="150" x2="310" y2="150" stroke="#9a9088" stroke-width="2" stroke-dasharray="5 5"/><text x="240" y="156" font-size="20" fill="#6d635a" text-anchor="middle">ch 9</text><circle cx="90" cy="150" r="6" fill="#d9731f"/><circle cx="98" cy="124" r="6" fill="#d9731f"/><circle cx="98" cy="176" r="6" fill="#d9731f"/><circle cx="390" cy="150" r="6" fill="#d9731f"/><circle cx="382" cy="124" r="6" fill="#d9731f"/><circle cx="382" cy="176" r="6" fill="#d9731f"/><text x="240" y="70" font-size="22" fill="#2f2a26" text-anchor="middle" font-weight="bold">Round 2 (26)</text><text x="240" y="246" font-size="20" fill="#6d635a" text-anchor="middle">Round 1 (20)</text><text x="20" y="300" font-size="20" fill="#6d635a">Rnd 1: sc 7, 3 in end, sc 7, 3 in end = 20.</text><text x="20" y="326" font-size="20" fill="#6d635a">Rnd 2: double each end 3 to 6; sides stay</text><text x="20" y="352" font-size="20" fill="#6d635a">= 26. Orange dots = the increases.</text><text x="20" y="378" font-size="20" fill="#6d635a">A flat oval grows only at the ends.</text>
</svg>
