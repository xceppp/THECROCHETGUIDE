<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 509" role="img">
<title>Base: rounds 1 to 7</title>
<desc>Base: rounds 1 to 7, drawn as rings from the center out. Round 1: 6 sc in a magic ring, 6 stitches. Round 2: 2 sc in each st, 12 stitches. Round 3: (2 sc in next, sc in next) 6 times, 18 stitches. Round 4: (2 sc in next, sc 2) 6 times, 24 stitches. Round 5: (2 sc in next, sc 3) 6 times, 30 stitches. Round 6: (2 sc in next, sc 4) 6 times, 36 stitches. Round 7: (2 sc in next, sc 8) 4 times, 40 stitches.</desc>
<rect width="480" height="509" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
