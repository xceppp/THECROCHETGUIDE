<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 731" role="img">
<title>Closing the strip around the elastic</title>
<desc>Three cross-section steps. 1: lay the elastic along the middle of the strip's wrong side. 2: fold both long edges up over it so they meet. 3: whipstitch the two long edges together along the full length, catching only the crochet and never the elastic, pushing the fabric along as you go because the strip is twice as long as the elastic.</desc>
<rect width="480" height="731" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<text x="20" y="44" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Closing the strip around the</text>
<text x="20" y="74" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">elastic</text><rect x="12" y="92" width="456" height="157.5" rx="10" fill="#f6efe6" stroke="#e6ddd1"/><circle cx="38" cy="118" r="15" fill="#b0604a"/><text x="38" y="125" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="62" y="125" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Elastic on the wrong side</text><rect x="70" y="152.5" width="340" height="40" rx="4" fill="#f6efe6" stroke="#6b4428" stroke-width="3"/><line x1="80" y1="172.5" x2="400" y2="172.5" stroke="#2f2a26" stroke-width="6" stroke-linecap="round"/><text x="36" y="230.5" font-size="20" fill="#2f2a26" text-anchor="start">Lay it along the middle of the strip.</text><rect x="12" y="261.5" width="456" height="206.5" rx="10" fill="#f6efe6" stroke="#e6ddd1"/><circle cx="38" cy="287.5" r="15" fill="#b0604a"/><text x="38" y="294.5" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="62" y="294.5" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Fold the long edges up</text><circle cx="240" cy="352" r="10" fill="#2f2a26"/><path d="M220 324 C180 332 180 384 240 384 C300 384 300 332 260 324" fill="none" stroke="#6b4428" stroke-width="6" stroke-linecap="round"/><text x="36" y="424" font-size="20" fill="#2f2a26" text-anchor="start">Seen from the end: the strip wraps the</text>
<text x="36" y="449" font-size="20" fill="#2f2a26" text-anchor="start">elastic and the long edges meet on top.</text><rect x="12" y="480" width="456" height="231" rx="10" fill="#f6efe6" stroke="#e6ddd1"/><circle cx="38" cy="506" r="15" fill="#b0604a"/><text x="38" y="513" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">3</text><text x="62" y="513" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Whipstitch, not through the</text>
<text x="62" y="540.5" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">elastic</text><rect x="70" y="574" width="340" height="30" rx="15" fill="#f6efe6" stroke="#6b4428" stroke-width="3"/><path d="M90 566 l14 14" stroke="#b0604a" stroke-width="3"/><path d="M122 566 l14 14" stroke="#b0604a" stroke-width="3"/><path d="M154 566 l14 14" stroke="#b0604a" stroke-width="3"/><path d="M186 566 l14 14" stroke="#b0604a" stroke-width="3"/><path d="M218 566 l14 14" stroke="#b0604a" stroke-width="3"/><path d="M250 566 l14 14" stroke="#b0604a" stroke-width="3"/><path d="M282 566 l14 14" stroke="#b0604a" stroke-width="3"/><path d="M314 566 l14 14" stroke="#b0604a" stroke-width="3"/><path d="M346 566 l14 14" stroke="#b0604a" stroke-width="3"/><path d="M378 566 l14 14" stroke="#b0604a" stroke-width="3"/><text x="36" y="642" font-size="20" fill="#2f2a26" text-anchor="start">Catch both long edges, skip the</text>
<text x="36" y="667" font-size="20" fill="#2f2a26" text-anchor="start">elastic, and slide the fabric along as</text>
<text x="36" y="692" font-size="20" fill="#2f2a26" text-anchor="start">you sew.</text>
</svg>
