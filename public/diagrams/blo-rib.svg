<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 593" role="img">
<title>Back-loop-only rib</title>
<desc>Two steps. 1: the top of each stitch has a front loop, nearer you, and a back loop, farther away. For the rib, insert the hook under the back loop only. 2: the front loops left behind form a raised ridge on every row. The fabric stretches across the ridges, in the direction the rows stack up, so a band worked sideways stretches around the head.</desc>
<rect width="480" height="593" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<text x="20" y="44" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Back-loop-only rib</text><rect x="12" y="64" width="456" height="206.5" rx="10" fill="#f6efe6" stroke="#e6ddd1"/><circle cx="38" cy="90" r="15" fill="#b0604a"/><text x="38" y="97" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="62" y="97" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Back loop only</text><path d="M80 140.5 h300" stroke="#c9bfb3" stroke-width="7" stroke-linecap="round"/><path d="M80 166.5 h300" stroke="#6b4428" stroke-width="7" stroke-linecap="round"/><text x="390" y="147.5" font-size="20" fill="#6d635a">back</text><text x="390" y="173.5" font-size="20" fill="#6d635a">front</text><path d="M170 186.5 L220 134.5" stroke="#b0604a" stroke-width="5" stroke-linecap="round"/><text x="36" y="226.5" font-size="20" fill="#2f2a26" text-anchor="start">Hook under the far loop. The near loop</text>
<text x="36" y="251.5" font-size="20" fill="#2f2a26" text-anchor="start">stays unworked.</text><rect x="12" y="282.5" width="456" height="290.5" rx="10" fill="#f6efe6" stroke="#e6ddd1"/><circle cx="38" cy="308.5" r="15" fill="#b0604a"/><text x="38" y="315.5" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="62" y="315.5" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Ridges</text><rect x="80" y="345" width="300" height="10" rx="5" fill="#e9d6c3" stroke="#c9bfb3"/><rect x="80" y="361" width="300" height="10" rx="5" fill="#f6efe6" stroke="#c9bfb3"/><rect x="80" y="377" width="300" height="10" rx="5" fill="#e9d6c3" stroke="#c9bfb3"/><rect x="80" y="393" width="300" height="10" rx="5" fill="#f6efe6" stroke="#c9bfb3"/><rect x="80" y="409" width="300" height="10" rx="5" fill="#e9d6c3" stroke="#c9bfb3"/><path d="M410 339 V429" stroke="#b0604a" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="60" y="443" font-size="20" fill="#8f4a37">stretch runs across the ridges</text><text x="36" y="479" font-size="20" fill="#2f2a26" text-anchor="start">The leftover front loops make a ridge</text>
<text x="36" y="504" font-size="20" fill="#2f2a26" text-anchor="start">on every row. The rib stretches across</text>
<text x="36" y="529" font-size="20" fill="#2f2a26" text-anchor="start">the ridges, the way the rows stack up,</text>
<text x="36" y="554" font-size="20" fill="#2f2a26" text-anchor="start">which is why bands are worked sideways.</text>
</svg>
