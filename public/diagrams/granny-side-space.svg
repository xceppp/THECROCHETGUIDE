<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 721" role="img">
<title>Side clusters go into spaces</title>
<desc>One side of a granny square, round 3 worked over round 2. Correct: the side cluster of round 3 sits in the chain-1 space between round 2's two corner halves, with a chain-1 on each side of it. Common mistake: the cluster goes into the top of a double crochet instead. The gap closes, the side goes stiff, and the square starts to cup.</desc>
<rect width="480" height="721" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<text x="20" y="44" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Side clusters go into spaces</text><rect x="12" y="66" width="456" height="297" rx="10" fill="#f1f3ed" stroke="#7d8b72" stroke-width="2"/><text x="32" y="98" font-size="20" font-weight="bold" fill="#7d8b72">CORRECT: in the ch-1 space</text><text x="40" y="246" font-size="20" fill="#6d635a">R2</text><text x="40" y="176" font-size="20" fill="#6d635a">R3</text><path d="M150 244 V218 M145 218 h10" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M160 244 V218 M155 218 h10" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M170 244 V218 M165 218 h10" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><circle cx="240" cy="230" r="7" fill="#fdfaf6" stroke="#7d8b72" stroke-width="3"/><path d="M310 244 V218 M305 218 h10" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M320 244 V218 M315 218 h10" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M330 244 V218 M325 218 h10" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M100 182 V156 M95 156 h10" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M110 182 V156 M105 156 h10" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M120 182 V156 M115 156 h10" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M360 182 V156 M355 156 h10" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M370 182 V156 M365 156 h10" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M380 182 V156 M375 156 h10" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><circle cx="170" cy="168" r="7" fill="#fdfaf6" stroke="#7d8b72" stroke-width="3"/><path d="M230 182 V156 M225 156 h10" stroke="#7d8b72" stroke-width="3" stroke-linecap="round"/><path d="M240 182 V156 M235 156 h10" stroke="#7d8b72" stroke-width="3" stroke-linecap="round"/><path d="M250 182 V156 M245 156 h10" stroke="#7d8b72" stroke-width="3" stroke-linecap="round"/><circle cx="310" cy="168" r="7" fill="#fdfaf6" stroke="#7d8b72" stroke-width="3"/><path d="M240 186 V218" stroke="#7d8b72" stroke-width="3" marker-end="url(#ah)"/><text x="36" y="292" font-size="20" fill="#2f2a26" text-anchor="start">The hook goes into the gap. Round n</text>
<text x="36" y="317" font-size="20" fill="#2f2a26" text-anchor="start">then has n clusters per side, counting</text>
<text x="36" y="342" font-size="20" fill="#2f2a26" text-anchor="start">the corner halves.</text><rect x="12" y="377" width="456" height="322" rx="10" fill="#f8ebe5" stroke="#b0604a" stroke-width="2"/><text x="32" y="409" font-size="20" font-weight="bold" fill="#b0604a">COMMON MISTAKE: into a stitch top</text><text x="40" y="557" font-size="20" fill="#6d635a">R2</text><text x="40" y="487" font-size="20" fill="#6d635a">R3</text><path d="M150 555 V529 M145 529 h10" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M160 555 V529 M155 529 h10" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M170 555 V529 M165 529 h10" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><circle cx="240" cy="541" r="7" fill="#fdfaf6" stroke="#7d8b72" stroke-width="3"/><path d="M310 555 V529 M305 529 h10" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M320 555 V529 M315 529 h10" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M330 555 V529 M325 529 h10" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M100 493 V467 M95 467 h10" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M110 493 V467 M105 467 h10" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M120 493 V467 M115 467 h10" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M360 493 V467 M355 467 h10" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M370 493 V467 M365 467 h10" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M380 493 V467 M375 467 h10" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M160 493 V467 M155 467 h10" stroke="#b0604a" stroke-width="3" stroke-linecap="round"/><path d="M170 493 V467 M165 467 h10" stroke="#b0604a" stroke-width="3" stroke-linecap="round"/><path d="M180 493 V467 M175 467 h10" stroke="#b0604a" stroke-width="3" stroke-linecap="round"/><path d="M170 497 V525" stroke="#b0604a" stroke-width="3" marker-end="url(#ah)"/><text x="260" y="483" font-size="20" fill="#8f4a37">no space</text><text x="36" y="603" font-size="20" fill="#2f2a26" text-anchor="start">Worked into the top of a dc, the hole</text>
<text x="36" y="628" font-size="20" fill="#2f2a26" text-anchor="start">closes and the square stiffens and</text>
<text x="36" y="653" font-size="20" fill="#2f2a26" text-anchor="start">cups. The side also stops lining up</text>
<text x="36" y="678" font-size="20" fill="#2f2a26" text-anchor="start">with the round below.</text>
</svg>
