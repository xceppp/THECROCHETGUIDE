<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 449" role="img">
<title>Flap: 6 rows over 10 stitches</title>
<desc>A flap of 6 rows worked over 10 of the 30 stitches on the last round, with a chain loop on the top row. Rows 1 to 5: 10 sc. Row 6: sc 4, ch 4, skip 2, sc 4. For a 36-stitch body the flap is 12 wide: sc 5, ch 4, skip 2, sc 5.</desc>
