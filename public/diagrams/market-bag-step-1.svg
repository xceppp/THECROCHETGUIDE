>R8</text><text x="140" y="301" font-size="20" fill="#2f2a26" text-anchor="end">48</text><rect x="215.625" y="311" width="168.75" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="331" font-size="20" fill="#6d635a">R9</text><text x="140" y="331" font-size="20" fill="#2f2a26" text-anchor="end">54</text><rect x="206.25" y="341" width="187.5" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="361" font-size="20" fill="#6d635a">R10</text><text x="140" y="361" font-size="20" fill="#2f2a26" text-anchor="end">60</text><rect x="196.875" y="371" width="206.25" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="391" font-size="20" fill="#6d635a">R11</text><text x="140" y="391" font-size="20" fill="#2f2a26" text-anchor="end">66</text><rect x="187.5" y="401" width="225" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="421" font-size="20" fill="#6d635a">R12</text><text x="140" y="421" font-size="20" fill="#2f2a26" text-anchor="end">72</text><rect x="178.125" y="431" width="243.75" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="451" font-size="20" fill="#6d635a">R13</text><text x="140" y="451" font-size="20" fill="#2f2a26" text-anchor="end">78</text><rect x="168.75" y="461" width="262.5" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="481" font-size="20" fill="#6d635a">R14</text><text x="140" y="481" font-size="20" fill="#2f2a26" text-anchor="end">84</text><rect x="159.375" y="491" width="281.25" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="511" font-size="20" fill="#6d635a">R15</text><text x="140" y="511" font-size="20" fill="#2f2a26" text-anchor="end">90</text><rect x="150" y="521" width="300" height="24" rx="4" fill="#b0604a" stroke="#8f4a37"/><text x="20" y="541" font-size="20" fill="#6d635a">R16</text><text x="140" y="541" font-size="20" fill="#2f2a26" text-anchor="end">96</text><rect x="150" y="551" width="300" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="571" font-size="20" fill="#6d635a">R17</text><text x="140" y="571" font-size="20" fill="#2f2a26" text-anchor="end">96</text><text x="20" y="602" font-size="20" fill="#6d635a" text-anchor="start">Round 16 is 96, about 7.6 in across. Round</text>
<text x="20" y="627" font-size="20" fill="#6d635a" text-anchor="start">17 is even and starts the turn.</text>
