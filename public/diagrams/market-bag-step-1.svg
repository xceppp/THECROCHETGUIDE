<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 668" role="img">
<title>Base: rounds 1 to 17</title>
<desc>Base: rounds 1 to 17, as bars sized by stitch count. Round 1: 6, Round 2: 12, Round 3: 18, Round 4: 24, Round 5: 30, Round 6: 36, Round 7: 42, Round 8: 48, Round 9: 54, Round 10: 60, Round 11: 66, Round 12: 72, Round 13: 78, Round 14: 84, Round 15: 90, Round 16: 96, Round 17: 96. Round 16 is 96, about 7.6 in across. Round 17 is even and starts the turn.</desc>
<rect width="480" height="668" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
