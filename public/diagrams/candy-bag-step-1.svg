<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 509" role="img">
<title>Base: rounds 1 to 9</title>
<desc>Base: rounds 1 to 9, drawn as rings from the center out. Round 1: 6 sc in a magic ring, 6 stitches. Round 2: 2 sc in each st, 12 stitches. Round 3: (sc, 2 sc in next) 6 times, 18 stitches. Round 4: (sc 2, 2 sc in next) 6 times, 24 stitches. Round 5: (sc 3, 2 sc in next) 6 times, 30 stitches. Round 6: (sc 4, 2 sc in next) 6 times, 36 stitches. Round 7: (sc 5, 2 sc in next) 6 times, 42 stitches. Round 8: (sc 6, 2 sc in next) 6 times, 48 stitches. Round 9: (sc 7, 2 sc in next) 6 times, 54 stitches.</desc>
<rect width="480" height="509" fill="#fdfaf6"/>
