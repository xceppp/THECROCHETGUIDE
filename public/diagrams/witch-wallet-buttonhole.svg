<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 716" role="img">
<title>Witch hat wallet: buttonhole rows and button placement</title>
<desc>Row 31 is 7 sc, chain 3, skip 3, 7 sc. Row 32 works 3 sc into the chain. Button sits near row 7, stitch 9.</desc>
<rect width="480" height="716" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="16" y="36" font-size="22" fill="#2f2a26">Row 31: sc 7, chain 3, skip 3, sc 7.</text>
<text x="16" y="100" font-size="22" fill="#2f2a26">Row 32: sc 7, 3 sc in the chain-3</text>
<text x="16" y="132" font-size="22" fill="#2f2a26">space, sc 7. (17)</text>
<text x="16" y="196" font-size="22" fill="#2f2a26">The hole is about 0.75 in for a 5/8</text>
<text x="16" y="228" font-size="22" fill="#2f2a26">in button. Test the button before</text>
<text x="16" y="260" font-size="22" fill="#2f2a26">row 33.</text>
<text x="16" y="324" font-size="22" fill="#2f2a26">If the button slips out, redo row 31</text>
<text x="16" y="356" font-size="22" fill="#2f2a26">as sc 7, ch 2, skip 2, sc 8.</text>
<text x="16" y="420" font-size="22" fill="#2f2a26">Then row 32 is sc 7, 2 sc in the</text>
<text x="16" y="452" font-size="22" fill="#2f2a26">space, sc 8.</text>
<text x="16" y="516" font-size="22" fill="#2f2a26">The hole lands about 1.3 in below</text>
<text x="16" y="548" font-size="22" fill="#2f2a26">the fold at the example gauge.</text>
<text x="16" y="612" font-size="22" fill="#2f2a26">Close the flap with cards in it.</text>
<text x="16" y="644" font-size="22" fill="#2f2a26">Mark the button near row 7, stitch</text>
<text x="16" y="676" font-size="22" fill="#2f2a26">9.</text>
</g>
</svg>
