<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 684" role="img">
<title>Spiderweb wallet: web embroidery paths on the flap</title>
<desc>Five spokes from the point to row 27 at stitches 2, 5, 8, 11, and 14. Three rings at rows 29, 31, and 33. Spider last.</desc>
<rect width="480" height="684" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="16" y="36" font-size="22" fill="#2f2a26">Flap seen closed. The point is row</text>
<text x="16" y="68" font-size="22" fill="#2f2a26">34. The fold is row 27.</text>
<text x="16" y="132" font-size="22" fill="#2f2a26">Spokes first. Backstitch from the</text>
<text x="16" y="164" font-size="22" fill="#2f2a26">point to row 27.</text>
<text x="16" y="228" font-size="22" fill="#2f2a26">End the spokes at stitches 2, 5, 8,</text>
<text x="16" y="260" font-size="22" fill="#2f2a26">11, and 14.</text>
<text x="16" y="324" font-size="22" fill="#2f2a26">The middle spoke runs up stitch 8.</text>
<text x="16" y="388" font-size="22" fill="#2f2a26">Rings next, inner ring first, near</text>
<text x="16" y="420" font-size="22" fill="#2f2a26">rows 33, then 31, then 29.</text>
<text x="16" y="484" font-size="22" fill="#2f2a26">Each ring is four segments, spoke to</text>
<text x="16" y="516" font-size="22" fill="#2f2a26">spoke, dipping slightly toward the</text>
<text x="16" y="548" font-size="22" fill="#2f2a26">point.</text>
<text x="16" y="612" font-size="22" fill="#2f2a26">Sew the spider last so its legs lie</text>
<text x="16" y="644" font-size="22" fill="#2f2a26">over the web.</text>
</g>
</svg>
