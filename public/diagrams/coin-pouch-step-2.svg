<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 451" role="img">
<title>The whole pouch by stitch count</title>
<desc>The whole pouch by stitch count, as bars sized by stitch count. Round 1: 6, Round 2: 12, Round 3: 18, Round 4: 24, Rounds 5 to 15: 30, Round 16: 15+15, Round 17: 30, Round 18: 30. Round 16 is the eyelet round: (sc, ch 1, skip 1) 15 times. Round 17 puts 1 sc in each sc and each space, back to 30.</desc>
<rect width="480" height="451" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<circle cx="36" cy="36" r="20" fill="#b0604a"/><text x="36" y="44" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="66" y="44" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">The whole pouch by stitch</text>
<text x="66" y="74" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">count</text><rect x="270" y="99" width="60" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="119" font-size="20" fill="#6d635a">R1</text><text x="140" y="119" font-size="20" fill="#2f2a26" text-anchor="end">6</text><rect x="240" y="129" width="120" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="149" font-size="20" fill="#6d635a">R2</text><text x="140" y="149" font-size="20" fill="#2f2a26" text-anchor="end">12</text><rect x="210" y="159" width="180" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="179" font-size="20" fill="#6d635a">R3</text><text x="140" y="179" font-size="20" fill="#2f2a26" text-anchor="end">18</text><rect x="180" y="189" width="240" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="209" font-size="20" fill="#6d635a">R4</text><text x="140" y="209" font-size="20" fill="#2f2a26" text-anchor="end">24</text><rect x="150" y="219" width="300" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="239" font-size="20" fill="#6d635a">R5–15</text><text x="140" y="239" font-size="20" fill="#2f2a26" text-anchor="end">30</text><rect x="150" y="249" width="300" height="24" rx="4" fill="#b0604a" stroke="#8f4a37"/><text x="20" y="269" font-size="20" fill="#6d635a">R16</text><text x="140" y="269" font-size="20" fill="#2f2a26" text-anchor="end">15+15</text><rect x="150" y="279" width="300" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="299" font-size="20" fill="#6d635a">R17</text><text x="140" y="299" font-size="20" fill="#2f2a26" text-anchor="end">30</text><rect x="150" y="309" width="300" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="329" font-size="20" fill="#6d635a">R18</text><text x="140" y="329" font-size="20" fill="#2f2a26" text-anchor="end">30</text><text x="20" y="360" font-size="20" fill="#6d635a" text-anchor="start">Round 16 is the eyelet round: (sc, ch 1,</text>
<text x="20" y="385" font-size="20" fill="#6d635a" text-anchor="start">skip 1) 15 times. Round 17 puts 1 sc in</text>
<text x="20" y="410" font-size="20" fill="#6d635a" text-anchor="start">each sc and each space, back to 30.</text>
</svg>
