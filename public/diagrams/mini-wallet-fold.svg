<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img">
<title>Fold and seam</title>
<desc>Fold the rectangle and seam the sides.</desc>
<rect width="480" height="300" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="240" y="36" font-size="22" fill="#2f2a26" text-anchor="middle" font-weight="bold">Fold and seam</text><rect x="150" y="60" width="180" height="160" fill="#f6efe6" stroke="#2f2a26" stroke-width="3"/><line x1="150" y1="140" x2="330" y2="140" stroke="#b0604a" stroke-width="4" stroke-dasharray="8 6"/><text x="240" y="250" font-size="22" fill="#2f2a26" text-anchor="middle">fold, then seam the sides</text>
</svg>
