<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 538" role="img">
<title>Standing ghost, round by round</title>
<desc>Standing ghost, round by round, as bars sized by stitch count. Round 1: 6, Round 2: 12, Round 3: 18, Round 4: 24, Round 5: 30, Rounds 6 to 16: 30, Round 17: 30, Round 18: 24, Round 19: 18, Round 20: 12, Round 21: 6. Rounds 1 to 5 add 6 each. Rounds 6 to 16 stay at 30. Round 17 (terracotta) is back loops only, then rounds 18 to 21 remove 6 each.</desc>
<rect width="480" height="538" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<text x="20" y="44" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Standing ghost, round by round</text><rect x="270" y="71" width="60" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="91" font-size="20" fill="#6d635a">R1</text><text x="140" y="91" font-size="20" fill="#2f2a26" text-anchor="end">6</text><rect x="240" y="101" width="120" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="121" font-size="20" fill="#6d635a">R2</text><text x="140" y="121" font-size="20" fill="#2f2a26" text-anchor="end">12</text><rect x="210" y="131" width="180" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="151" font-size="20" fill="#6d635a">R3</text><text x="140" y="151" font-size="20" fill="#2f2a26" text-anchor="end">18</text><rect x="180" y="161" width="240" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="181" font-size="20" fill="#6d635a">R4</text><text x="140" y="181" font-size="20" fill="#2f2a26" text-anchor="end">24</text><rect x="150" y="191" width="300" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="211" font-size="20" fill="#6d635a">R5</text><text x="140" y="211" font-size="20" fill="#2f2a26" text-anchor="end">30</text><rect x="150" y="221" width="300" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="241" font-size="20" fill="#6d635a">R6–16</text><text x="140" y="241" font-size="20" fill="#2f2a26" text-anchor="end">30</text><rect x="150" y="251" width="300" height="24" rx="4" fill="#b0604a" stroke="#8f4a37"/><text x="20" y="271" font-size="20" fill="#6d635a">R17</text><text x="140" y="271" font-size="20" fill="#2f2a26" text-anchor="end">30</text><rect x="180" y="281" width="240" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="301" font-size="20" fill="#6d635a">R18</text><text x="140" y="301" font-size="20" fill="#2f2a26" text-anchor="end">24</text><rect x="210" y="311" width="180" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="331" font-size="20" fill="#6d635a">R19</text><text x="140" y="331" font-size="20" fill="#2f2a26" text-anchor="end">18</text><rect x="240" y="341" width="120" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="361" font-size="20" fill="#6d635a">R20</text><text x="140" y="361" font-size="20" fill="#2f2a26" text-anchor="end">12</text><rect x="270" y="371" width="60" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="391" font-size="20" fill="#6d635a">R21</text><text x="140" y="391" font-size="20" fill="#2f2a26" text-anchor="end">6</text><text x="20" y="422" font-size="20" fill="#6d635a" text-anchor="start">Rounds 1 to 5 add 6 each. Rounds 6 to 16</text>
<text x="20" y="447" font-size="20" fill="#6d635a" text-anchor="start">stay at 30. Round 17 (terracotta) is back</text>
<text x="20" y="472" font-size="20" fill="#6d635a" text-anchor="start">loops only, then rounds 18 to 21 remove 6</text>
<text x="20" y="497" font-size="20" fill="#6d635a" text-anchor="start">each.</text>
</svg>
