"#c9bfb3"/><text x="20" y="301" font-size="20" fill="#6d635a">R13</text><text x="140" y="301" font-size="20" fill="#2f2a26" text-anchor="end">24</text><rect x="214.28571428571428" y="311" width="171.42857142857142" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="331" font-size="20" fill="#6d635a">R14</text><text x="140" y="331" font-size="20" fill="#2f2a26" text-anchor="end">24</text><rect x="192.85714285714286" y="341" width="214.28571428571428" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="361" font-size="20" fill="#6d635a">R15</text><text x="140" y="361" font-size="20" fill="#2f2a26" text-anchor="end">30</text><rect x="192.85714285714286" y="371" width="214.28571428571428" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="391" font-size="20" fill="#6d635a">R16</text><text x="140" y="391" font-size="20" fill="#2f2a26" text-anchor="end">30</text><rect x="171.42857142857144" y="401" width="257.1428571428571" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="421" font-size="20" fill="#6d635a">R17</text><text x="140" y="421" font-size="20" fill="#2f2a26" text-anchor="end">36</text><rect x="171.42857142857144" y="431" width="257.1428571428571" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="451" font-size="20" fill="#6d635a">R18</text><text x="140" y="451" font-size="20" fill="#2f2a26" text-anchor="end">36</text><rect x="150" y="461" width="300" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="481" font-size="20" fill="#6d635a">R19</text><text x="140" y="481" font-size="20" fill="#2f2a26" text-anchor="end">42</text><rect x="150" y="491" width="300" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="511" font-size="20" fill="#6d635a">R20–21</text><text x="140" y="511" font-size="20" fill="#2f2a26" text-anchor="end">42</text><text x="20" y="542" font-size="20" fill="#6d635a" text-anchor="start">A thin tip first: 3 added every third</text>
