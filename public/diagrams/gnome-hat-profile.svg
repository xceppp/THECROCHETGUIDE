<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 633" role="img">
<title>Gnome hat, tip down</title>
<desc>Gnome hat, tip down, as bars sized by stitch count. Rounds 1 to 4: 6, Round 5: 9, Rounds 6 to 7: 9, Round 8: 12, Rounds 9 to 10: 12, Round 11: 18, Round 12: 18, Round 13: 24, Round 14: 24, Round 15: 30, Round 16: 30, Round 17: 36, Round 18: 36, Round 19: 42, Rounds 20 to 21: 42. A thin tip first: 3 added every third round to 12. Then 6 every other round to 42.</desc>
<rect width="480" height="633" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
