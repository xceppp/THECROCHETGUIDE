<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 693" role="img">
<title>Gnome body, top down</title>
<desc>Gnome body, top down, as bars sized by stitch count. Round 1: 6, Round 2: 12, Round 3: 18, Round 4: 24, Round 5: 30, Rounds 6 to 7: 30, Round 8: 36, Rounds 9 to 10: 36, Round 11: 42, Rounds 12 to 14: 42, Round 15: 42, Round 16: 36, Round 17: 30, Round 18: 24, Round 19: 18, Round 20: 12, Round 21: 6. Round 15 (terracotta) is back loops only at 42. Rounds 16 to 21 remove 6 each to close a flat base.</desc>
