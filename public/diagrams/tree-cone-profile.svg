"#c9bfb3"/><text x="20" y="331" font-size="20" fill="#6d635a">R10</text><text x="140" y="331" font-size="20" fill="#2f2a26" text-anchor="end">24</text><rect x="200" y="341" width="200" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="361" font-size="20" fill="#6d635a">R11</text><text x="140" y="361" font-size="20" fill="#2f2a26" text-anchor="end">24</text><rect x="200" y="371" width="200" height="24" rx="4" fill="#b0604a" stroke="#8f4a37"/><text x="20" y="391" font-size="20" fill="#6d635a">R12</text><text x="140" y="391" font-size="20" fill="#2f2a26" text-anchor="end">24</text><rect x="175" y="401" width="250" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="421" font-size="20" fill="#6d635a">R13</text><text x="140" y="421" font-size="20" fill="#2f2a26" text-anchor="end">30</text><rect x="175" y="431" width="250" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="451" font-size="20" fill="#6d635a">R14</text><text x="140" y="451" font-size="20" fill="#2f2a26" text-anchor="end">30</text><rect x="175" y="461" width="250" height="24" rx="4" fill="#b0604a" stroke="#8f4a37"/><text x="20" y="481" font-size="20" fill="#6d635a">R15</text><text x="140" y="481" font-size="20" fill="#2f2a26" text-anchor="end">30</text><rect x="150" y="491" width="300" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="511" font-size="20" fill="#6d635a">R16</text><text x="140" y="511" font-size="20" fill="#2f2a26" text-anchor="end">36</text><rect x="150" y="521" width="300" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="541" font-size="20" fill="#6d635a">R17–18</text><text x="140" y="541" font-size="20" fill="#2f2a26" text-anchor="end">36</text><rect x="150" y="551" width="300" height="24" rx="4" fill="#b0604a" stroke="#8f4a37"/><text x="20" y="571" font-size="20" fill="#6d635a">R19</text><text x="140" y="571" font-size="20" fill="#2f2a26" text-anchor="end">36</text><rect x="175" y="581" width="250" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="601" font-size="20" fill="#6d635a">R20</text><text x="140" y="601" font-size="20" fill="#2f2a26" text-anchor="end">30</text><rect x="200" y="611" width="200" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="631" font-size="20" fill="#6d635a">R21</text><text x="140" y="631" font-size="20" fill="#2f2a26" text-anchor="end">24</text><rect x="225" y="641" width="150" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="661" font-size="20" fill="#6d635a">R22</text><text x="140" y="661" font-size="20" fill="#2f2a26" text-anchor="end">18</text><rect x="250" y="671" width="100" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="691" font-size="20" fill="#6d635a">R23</text><text x="140" y="691" font-size="20" fill="#2f2a26" text-anchor="end">12</text><rect x="275" y="701" width="50" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="721" font-size="20" fill="#6d635a">R24</text><text x="140" y="721" font-size="20" fill="#2f2a26" text-anchor="end">6</text><text x="20" y="752" font-size="20" fill="#6d635a" text-anchor="start">Rounds 9, 12 and 15 are back loops only,</text>
<text x="20" y="777" font-size="20" fill="#6d635a" text-anchor="start">one per tier. Round 19 is the back-loop</text>
<text x="20" y="802" font-size="20" fill="#6d635a" text-anchor="start">fold for the base, then rounds 20 to 24</text>
<text x="20" y="827" font-size="20" fill="#6d635a" text-anchor="start">close it.</text>
</svg>
