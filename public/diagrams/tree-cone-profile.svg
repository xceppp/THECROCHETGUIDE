<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 868" role="img">
<title>Tiered cone tree, round by round</title>
<desc>Tiered cone tree, round by round, as bars sized by stitch count. Rounds 1 to 2: 6, Round 3: 9, Round 4: 9, Round 5: 12, Round 6: 12, Round 7: 18, Round 8: 18, Round 9: 18, Round 10: 24, Round 11: 24, Round 12: 24, Round 13: 30, Round 14: 30, Round 15: 30, Round 16: 36, Rounds 17 to 18: 36, Round 19: 36, Round 20: 30, Round 21: 24, Round 22: 18, Round 23: 12, Round 24: 6. Rounds 9, 12 and 15 are back loops only, one per tier. Round 19 is the back-loop fold for the base, then rounds 20 to 24 close it.</desc>
<rect width="480" height="868" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
