<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 466" role="img">
<title>Strap: chain 5, then 4 sc</title>
<desc>A foundation chain of 5. The chain nearest the hook is skipped and the first sc goes into the 2nd chain from the hook, so row 1 has 4 sc.</desc>
<rect width="480" height="466" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<circle cx="36" cy="36" r="20" fill="#b0604a"/><text x="36" y="44" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">3</text><text x="66" y="44" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Strap: chain 5, then 4 sc</text><circle cx="26" cy="116" r="8" fill="#6b4428"/><text x="18" y="152" font-size="20" fill="#6d635a" text-anchor="start">slip knot</text><ellipse cx="76" cy="116" rx="32.4" ry="8" fill="none" stroke="#6b4428" stroke-width="4"/><ellipse cx="148" cy="116" rx="32.4" ry="8" fill="none" stroke="#6b4428" stroke-width="4"/><ellipse cx="220" cy="116" rx="32.4" ry="8" fill="none" stroke="#6b4428" stroke-width="4"/><ellipse cx="292" cy="116" rx="32.4" ry="8" fill="none" stroke="#b0604a" stroke-width="4"/><ellipse cx="364" cy="116" rx="32.4" ry="8" fill="none" stroke="#7d8b72" stroke-width="4" stroke-dasharray="5 3"/><path d="M412 116 H462 q10 0 10 -10" fill="none" stroke="#b0604a" stroke-width="5" stroke-linecap="round"/><text x="470" y="152" font-size="20" fill="#6d635a" text-anchor="end">hook</text><text x="240" y="92" font-size="20" fill="#2f2a26" text-anchor="middle">ch 5</text><path d="M292 180 V130" stroke="#b0604a" stroke-width="3" marker-end="url(#ah)"/><text x="20" y="206" font-size="22" fill="#8f4a37" text-anchor="start">First sc goes in the 2nd chain from</text>
<text x="20" y="233.5" font-size="22" fill="#8f4a37" text-anchor="start">the hook.</text><text x="20" y="267" font-size="20" fill="#7d8b72" text-anchor="start">The skipped chain next to the hook is the</text>
<text x="20" y="292" font-size="20" fill="#7d8b72" text-anchor="start">turning chain, not a stitch.</text><path d="M76 326L94 344M94 326L76 344" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M166 326L184 344M184 326L166 344" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M256 326L274 344M274 326L256 344" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M346 326L364 344M364 326L346 344" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M400 361 H50" stroke="#b0604a" stroke-width="3" marker-end="url(#ah)"/><text x="20" y="391" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Strap rows: 4 sc. Work to the</text>
<text x="20" y="418.5" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">length that fits you.</text>
</svg>
