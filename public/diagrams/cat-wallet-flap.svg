<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 556" role="img">
<title>Black cat wallet: the flap and the snap</title>
<desc>The flap rises from the back half of round 12. Rows 1-7 are 16 stitches, row 8 is 14, row 9 is 12. Snap on the flap underside at row 8.</desc>
<rect width="480" height="556" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="16" y="36" font-size="22" fill="#2f2a26">The flap starts on the back 16</text>
<text x="16" y="68" font-size="22" fill="#2f2a26">stitches of round 12 and folds</text>
<text x="16" y="100" font-size="22" fill="#2f2a26">forward over the opening.</text>
<text x="16" y="164" font-size="22" fill="#2f2a26">Rows 1-7: 16 sc.</text>
<text x="16" y="228" font-size="22" fill="#2f2a26">Row 8: sc2tog at both ends. (14)</text>
<text x="16" y="292" font-size="22" fill="#2f2a26">Row 9: sc2tog at both ends. (12)</text>
<text x="16" y="356" font-size="22" fill="#2f2a26">Sew the ball half of the snap to the</text>
<text x="16" y="388" font-size="22" fill="#2f2a26">underside of the flap at row 8.</text>
<text x="16" y="452" font-size="22" fill="#2f2a26">Close the flap and mark the front</text>
<text x="16" y="484" font-size="22" fill="#2f2a26">about round 5 before sewing the</text>
<text x="16" y="516" font-size="22" fill="#2f2a26">socket.</text>
</g>
</svg>
