<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 580" role="img">
<title>Whipstitch seam: outer loops only</title>
<desc>Two edges laid side by side, right sides together. Correct: the needle passes through the outer loop of each edge stitch only, so the seam is flat and takes almost no width. Mistake: the needle goes through the whole stitch on both sides, which builds a thick ridge and takes width from the inside.</desc>
<rect width="480" height="580" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<text x="20" y="44" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Whipstitch seam: outer loops</text>
<text x="20" y="74" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">only</text><rect x="12" y="94" width="456" height="223" rx="10" fill="#f1f3ed" stroke="#7d8b72" stroke-width="2"/><text x="32" y="126" font-size="20" font-weight="bold" fill="#7d8b72">CORRECT: flat seam</text><ellipse cx="80" cy="160" rx="22" ry="9" fill="none" stroke="#6b4428" stroke-width="3"/><ellipse cx="80" cy="196" rx="22" ry="9" fill="none" stroke="#6b4428" stroke-width="3"/><path d="M94 154 C110 176, 110 180, 94 202" fill="none" stroke="#b0604a" stroke-width="3"/><ellipse cx="138" cy="160" rx="22" ry="9" fill="none" stroke="#6b4428" stroke-width="3"/><ellipse cx="138" cy="196" rx="22" ry="9" fill="none" stroke="#6b4428" stroke-width="3"/><path d="M152 154 C168 176, 168 180, 152 202" fill="none" stroke="#b0604a" stroke-width="3"/><ellipse cx="196" cy="160" rx="22" ry="9" fill="none" stroke="#6b4428" stroke-width="3"/><ellipse cx="196" cy="196" rx="22" ry="9" fill="none" stroke="#6b4428" stroke-width="3"/><path d="M210 154 C226 176, 226 180, 210 202" fill="none" stroke="#b0604a" stroke-width="3"/><ellipse cx="254" cy="160" rx="22" ry="9" fill="none" stroke="#6b4428" stroke-width="3"/><ellipse cx="254" cy="196" rx="22" ry="9" fill="none" stroke="#6b4428" stroke-width="3"/><path d="M268 154 C284 176, 284 180, 268 202" fill="none" stroke="#b0604a" stroke-width="3"/><ellipse cx="312" cy="160" rx="22" ry="9" fill="none" stroke="#6b4428" stroke-width="3"/><ellipse cx="312" cy="196" rx="22" ry="9" fill="none" stroke="#6b4428" stroke-width="3"/><path d="M326 154 C342 176, 342 180, 326 202" fill="none" stroke="#b0604a" stroke-width="3"/><ellipse cx="370" cy="160" rx="22" ry="9" fill="none" stroke="#6b4428" stroke-width="3"/><ellipse cx="370" cy="196" rx="22" ry="9" fill="none" stroke="#6b4428" stroke-width="3"/><path d="M384 154 C400 176, 400 180, 384 202" fill="none" stroke="#b0604a" stroke-width="3"/><text x="36" y="246" font-size="20" fill="#2f2a26" text-anchor="start">Through the outer loop of each edge</text>
<text x="36" y="271" font-size="20" fill="#2f2a26" text-anchor="start">stitch. The seam lies flat and the</text>
<text x="36" y="296" font-size="20" fill="#2f2a26" text-anchor="start">inside keeps its width.</text><rect x="12" y="331" width="456" height="227" rx="10" fill="#f8ebe5" stroke="#b0604a" stroke-width="2"/><text x="32" y="363" font-size="20" font-weight="bold" fill="#b0604a">COMMON MISTAKE: bulky ridge</text><ellipse cx="80" cy="397" rx="22" ry="9" fill="none" stroke="#6b4428" stroke-width="3"/><ellipse cx="80" cy="433" rx="22" ry="9" fill="none" stroke="#6b4428" stroke-width="3"/><path d="M80 381 C120 407, 120 423, 80 449" fill="none" stroke="#b0604a" stroke-width="4"/><ellipse cx="138" cy="397" rx="22" ry="9" fill="none" stroke="#6b4428" stroke-width="3"/><ellipse cx="138" cy="433" rx="22" ry="9" fill="none" stroke="#6b4428" stroke-width="3"/><path d="M138 381 C178 407, 178 423, 138 449" fill="none" stroke="#b0604a" stroke-width="4"/><ellipse cx="196" cy="397" rx="22" ry="9" fill="none" stroke="#6b4428" stroke-width="3"/><ellipse cx="196" cy="433" rx="22" ry="9" fill="none" stroke="#6b4428" stroke-width="3"/><path d="M196 381 C236 407, 236 423, 196 449" fill="none" stroke="#b0604a" stroke-width="4"/><ellipse cx="254" cy="397" rx="22" ry="9" fill="none" stroke="#6b4428" stroke-width="3"/><ellipse cx="254" cy="433" rx="22" ry="9" fill="none" stroke="#6b4428" stroke-width="3"/><path d="M254 381 C294 407, 294 423, 254 449" fill="none" stroke="#b0604a" stroke-width="4"/><ellipse cx="312" cy="397" rx="22" ry="9" fill="none" stroke="#6b4428" stroke-width="3"/><ellipse cx="312" cy="433" rx="22" ry="9" fill="none" stroke="#6b4428" stroke-width="3"/><path d="M312 381 C352 407, 352 423, 312 449" fill="none" stroke="#b0604a" stroke-width="4"/><ellipse cx="370" cy="397" rx="22" ry="9" fill="none" stroke="#6b4428" stroke-width="3"/><ellipse cx="370" cy="433" rx="22" ry="9" fill="none" stroke="#6b4428" stroke-width="3"/><path d="M370 381 C410 407, 410 423, 370 449" fill="none" stroke="#b0604a" stroke-width="4"/><text x="36" y="487" font-size="20" fill="#2f2a26" text-anchor="start">Through whole stitches. The seam stands</text>
<text x="36" y="512" font-size="20" fill="#2f2a26" text-anchor="start">up as a ridge and a snug piece loses</text>
<text x="36" y="537" font-size="20" fill="#2f2a26" text-anchor="start">width.</text>
</svg>
