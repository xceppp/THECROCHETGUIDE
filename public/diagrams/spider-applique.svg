<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 716" role="img">
<title>Spiderweb wallet: purple spider assembly</title>
<desc>Abdomen: 6, 12, 12, 6. Head: 6, then 6. Eight legs, two stitches each, four per side.</desc>
<rect width="480" height="716" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="16" y="36" font-size="22" fill="#2f2a26">Abdomen, purple. Round 1: magic</text>
<text x="16" y="68" font-size="22" fill="#2f2a26">ring, 6 sc. (6)</text>
<text x="16" y="132" font-size="22" fill="#2f2a26">Round 2: 2 sc in each stitch. (12)</text>
<text x="16" y="196" font-size="22" fill="#2f2a26">Round 3: sc in each stitch. (12)</text>
<text x="16" y="260" font-size="22" fill="#2f2a26">Round 4: sc2tog 6 times. (6)</text>
<text x="16" y="324" font-size="22" fill="#2f2a26">Stuff with yarn scraps. Close the</text>
<text x="16" y="356" font-size="22" fill="#2f2a26">hole with the tail.</text>
<text x="16" y="420" font-size="22" fill="#2f2a26">Head: magic ring, 6 sc, then one</text>
<text x="16" y="452" font-size="22" fill="#2f2a26">even round of 6. Close it.</text>
<text x="16" y="516" font-size="22" fill="#2f2a26">Sew the head to the abdomen, then</text>
<text x="16" y="548" font-size="22" fill="#2f2a26">both to the flap.</text>
<text x="16" y="612" font-size="22" fill="#2f2a26">Each leg is two straight stitches,</text>
<text x="16" y="644" font-size="22" fill="#2f2a26">four legs each side, bent at the</text>
<text x="16" y="676" font-size="22" fill="#2f2a26">knee.</text>
</g>
</svg>
