<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" role="img">
<title>Ears, flap, and button</title>
<desc>Assembly. Two ears sit on the top front, one near each end of the oval. The flap rises from the back, folds over the top, and buttons to the front; a buttonhole on its last row drops over a sewn button. The optional carrying loop sits at the back. To charge, the case comes out.</desc>
<rect width="480" height="500" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<circle cx="36" cy="36" r="20" fill="#b0604a"/><text x="36" y="44" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">7</text><text x="66" y="44" font-size="24" fill="#2f2a26" font-weight="bold">Ears, flap, and button</text><rect x="150" y="150" width="180" height="120" rx="16" fill="#322d2a"/><polygon points="170,150 194,116 218,150" fill="#241f1d"/><polygon points="262,150 286,116 310,150" fill="#241f1d"/><polygon points="240,224 228,206 252,206" fill="#d9731f"/><circle cx="206" cy="194" r="7" fill="#d9731f"/><circle cx="274" cy="194" r="7" fill="#d9731f"/><path d="M180 150 q60 -52 120 0" fill="none" stroke="#b0604a" stroke-width="3" stroke-dasharray="6 5"/><circle cx="240" cy="170" r="8" fill="none" stroke="#fdfaf6" stroke-width="3"/><text x="240" y="110" font-size="20" fill="#6d635a" text-anchor="middle">flap folds over</text><text x="342" y="174" font-size="20" fill="#6d635a">button</text><text x="20" y="340" font-size="20" fill="#6d635a">Ears near the ends; face embroidered,</text><text x="20" y="366" font-size="20" fill="#6d635a">not plastic, so nothing pulls off.</text><text x="20" y="392" font-size="20" fill="#6d635a">Flap buttons on the front. The back loop</text><text x="20" y="418" font-size="20" fill="#6d635a">is for a bag clip. Remove case to charge.</text>
</svg>
