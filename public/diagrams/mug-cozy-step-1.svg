<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 466" role="img">
<title>Chain 13, then 12 sc</title>
<desc>A foundation chain of 13. The chain nearest the hook is skipped and the first sc goes into the 2nd chain from the hook, so row 1 has 12 sc.</desc>
