" stroke="#b0604a" stroke-width="5" stroke-linecap="round"/><text x="470" y="152" font-size="20" fill="#6d635a" text-anchor="end">hook</text><text x="240" y="92" font-size="20" fill="#2f2a26" text-anchor="middle">ch 13</text><path d="M358.46153846153845 180 V130" stroke="#b0604a" stroke-width="3" marker-end="url(#ah)"/><text x="20" y="206" font-size="22" fill="#8f4a37" text-anchor="start">First sc goes in the 2nd chain from</text>
