<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 322" role="img">
<title>One stitch on each row end</title>
<desc>Each long edge gets one single crochet per row.</desc>
<rect width="480" height="322" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="240" y="40" font-size="22" fill="#2f2a26" text-anchor="middle" font-weight="bold">The two rims</text>
<rect x="150" y="70" width="180" height="200" fill="#f6efe6" stroke="#2f2a26" stroke-width="3"/>
<line x1="150" y1="70" x2="150" y2="270" stroke="#b0604a" stroke-width="8"/>
<line x1="330" y1="70" x2="330" y2="270" stroke="#b0604a" stroke-width="8"/>
<text x="240" y="300" font-size="22" fill="#2f2a26" text-anchor="middle">one stitch per row end</text>
</svg>
