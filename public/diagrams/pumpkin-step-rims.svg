<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 322" role="img">
<title>Pumpkin wallet: the two rims</title>
<desc>Each long edge gets one single crochet in each row-end bump. The stitch count matches the row count.</desc>
<rect width="480" height="322" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="16" y="40" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Pumpkin wallet: the two rims</text>
<rect x="16" y="72" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="100" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Count the bumps first</text>
<text x="32" y="126" font-size="20" fill="#6d635a" text-anchor="start">Write the number down.</text>
<rect x="16" y="150" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="178" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">One single crochet in each</text>
<text x="32" y="204" font-size="20" fill="#6d635a" text-anchor="start">Two in one bump makes a ripple.</text>
<rect x="16" y="228" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="256" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Both rims, then fasten off</text>
<text x="32" y="282" font-size="20" fill="#6d635a" text-anchor="start">These edges become the opening.</text>
</svg>
