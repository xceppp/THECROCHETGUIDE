<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 244" role="img">
<title>A loop at the point</title>
<desc>The loop comes out of the point and returns to the same stitch.</desc>
<rect width="480" height="244" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="240" y="36" font-size="22" fill="#2f2a26" text-anchor="middle" font-weight="bold">Button loop</text>
<polygon points="160,80 320,80 240,170" fill="#f6efe6" stroke="#2f2a26" stroke-width="3"/>
<ellipse cx="240" cy="168" rx="28" ry="36" fill="none" stroke="#b0604a" stroke-width="5"/>
<text x="240" y="228" font-size="22" fill="#2f2a26" text-anchor="middle">from the point</text>
</svg>
