<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
<title>Estimating yardage by weighing</title>
<desc>Three steps. First, read the yarn label: an example label says 200 yards in 100 grams, which is 2 yards per gram. Second, weigh one finished piece, or a measured part such as a base, on a kitchen scale: 14 grams in the example. Third, multiply: 14 grams times 2 yards per gram is 28 yards. Add 10 to 20 percent for the swatch and mistakes. The example numbers are invented.</desc>
<rect width="640" height="420" fill="#fdfaf6"/>
<style>
  text { font-family: Georgia, "Times New Roman", serif; }
  .label { font-size: 20px; fill: #2f2a26; }
  .soft { font-size: 16px; fill: #6d635a; }
  .box { fill: #f3e6d4; stroke: #6b4428; stroke-width: 2.5; }
  .arrow { fill: none; stroke: #b0604a; stroke-width: 3; }
  .scale { fill: #f6efe6; stroke: #7d8b72; stroke-width: 2.5; }
</style>
<rect x="16" y="16" width="608" height="388" rx="10" fill="#f6efe6" stroke="#e6ddd1"/>
<text class="label" x="32" y="46">Weigh one, then multiply</text>
<rect class="box" x="40" y="100" width="160" height="110" rx="8"/>
<text class="soft" x="58" y="132">Label:</text>
<text class="soft" x="58" y="156">200 yd / 100 g</text>
<text class="soft" x="58" y="190">= 2 yd per gram</text>
<path class="arrow" d="M206 155 H236 M228 147 L236 155 L228 163"/>
<rect class="scale" x="244" y="150" width="150" height="60" rx="6"/>
<ellipse cx="319" cy="140" rx="50" ry="14" fill="#f3e6d4" stroke="#6b4428" stroke-width="2"/>
<text class="soft" x="290" y="188">14 g</text>
<text class="soft" x="250" y="236">One finished piece</text>
<path class="arrow" d="M400 155 H430 M422 147 L430 155 L422 163"/>
<rect class="box" x="438" y="100" width="160" height="110" rx="8"/>
<text class="soft" x="454" y="132">14 x 2</text>
<text class="soft" x="454" y="156">= 28 yd</text>
<text class="soft" x="454" y="190">+ 10 to 20%</text>
<text class="soft" x="40" y="290">For a set, multiply by the number of pieces.</text>
<text class="soft" x="40" y="314">For a big piece, weigh a part you can measure, such as the base.</text>
<text class="soft" x="40" y="338">Buy for the whole set in one dye lot.</text>
<text class="soft" x="40" y="384">Example numbers only. Your label and your scale give the real ones.</text>
</svg>
