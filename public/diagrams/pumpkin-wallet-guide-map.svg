<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
<title>Pumpkin wallet stitch map</title>
<desc>Twenty stitches run from the front rim at stitch 1 to the back rim at stitch 20. The fold sits between stitch 10 and stitch 11. Rows run the other way and set the 4.25 inch width. The face stays on stitches 1 through 10.</desc>
<rect width="640" height="420" fill="#fdfaf6"/>
<style>
  text { font-family: Georgia, "Times New Roman", serif; }
  .label { font-size: 22px; fill: #2f2a26; }
  .soft { font-size: 18px; fill: #6d635a; }
  .ink { fill: none; stroke: #2f2a26; stroke-width: 3; }
  .sage { fill: none; stroke: #7d8b72; stroke-width: 4; }
  .terra { fill: none; stroke: #b0604a; stroke-width: 4; }
</style>
<rect x="16" y="16" width="608" height="388" rx="10" fill="#f6efe6" stroke="#e6ddd1"/>
<text class="label" x="32" y="52">Sideways map: 20 stitches, rows set the width</text>
<rect class="ink" x="48" y="78" width="360" height="250" fill="#fdfaf6"/>
<line class="terra" x1="48" y1="198" x2="408" y2="198"/>
<text class="soft" x="56" y="110">Stitch 1, front rim</text>
<text class="soft" x="56" y="150">Stitches 2 to 9, front half</text>
<text class="label" x="56" y="186">Stitch 10</text>
<text class="label" x="56" y="228">Stitch 11</text>
<text class="soft" x="56" y="268">Stitches 12 to 19, back half</text>
<text class="soft" x="56" y="308">Stitch 20, back rim</text>
<text class="soft" x="48" y="356">Row 1</text>
<text class="soft" x="330" y="356">Last even row</text>
<path class="sage" d="M430 90 H600"/>
<text class="soft" x="430" y="122">Face: stitches 1 to 10</text>
<path class="terra" d="M430 160 H600"/>
<text class="soft" x="430" y="192">Fold between 10 and 11</text>
<text class="soft" x="430" y="250">Width target: 4.25 in</text>
<text class="soft" x="430" y="282">About 22 rows</text>
<text class="soft" x="430" y="330">Stop on an even row</text>
<text class="soft" x="430" y="362">that measures 4.25 in</text>
</svg>
