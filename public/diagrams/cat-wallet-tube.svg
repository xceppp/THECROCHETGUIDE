<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
<title>Black cat wallet: a seamless pocket from both sides of a chain</title>
<desc>Left: a foundation chain of 17. Round 1 works 16 single crochet along the top of the chain from right to left, skipping the chain nearest the hook, then 16 along the other side from left to right, for 32 stitches. Right: rounds 2 to 12 are worked around without turning, making a flat tube 16 stitches wide, about 4 inches, and 12 rounds tall, about 2.4 inches. The chain becomes the bottom fold, so the pocket has no side seams.</desc>
<rect width="640" height="420" fill="#fdfaf6"/>
<style>
  text { font-family: Georgia, "Times New Roman", serif; }
  .label { font-size: 20px; fill: #2f2a26; }
  .soft { font-size: 16px; fill: #6d635a; }
  .small { font-size: 13px; fill: #6d635a; }
  .panel { fill: #f6efe6; stroke: #e6ddd1; }
  .ch { fill: none; stroke: #3b3532; stroke-width: 3; }
  .arrow { fill: none; stroke: #b0604a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .fab { fill: #4a4440; stroke: #2f2a26; stroke-width: 2; }
  .back { fill: #6d635a; stroke: #2f2a26; stroke-width: 2; }
</style>
<rect class="panel" x="16" y="16" width="296" height="388" rx="10"/>
<rect class="panel" x="328" y="16" width="296" height="388" rx="10"/>
<text class="label" x="32" y="48">Round 1: both sides</text>
<text class="label" x="344" y="48">Rounds 2-12: a tube</text>
<g>
  <ellipse class="ch" cx="58" cy="160" rx="6" ry="4"/><ellipse class="ch" cx="72" cy="160" rx="6" ry="4"/>
  <ellipse class="ch" cx="86" cy="160" rx="6" ry="4"/><ellipse class="ch" cx="100" cy="160" rx="6" ry="4"/>
  <ellipse class="ch" cx="114" cy="160" rx="6" ry="4"/><ellipse class="ch" cx="128" cy="160" rx="6" ry="4"/>
  <ellipse class="ch" cx="142" cy="160" rx="6" ry="4"/><ellipse class="ch" cx="156" cy="160" rx="6" ry="4"/>
  <ellipse class="ch" cx="170" cy="160" rx="6" ry="4"/><ellipse class="ch" cx="184" cy="160" rx="6" ry="4"/>
  <ellipse class="ch" cx="198" cy="160" rx="6" ry="4"/><ellipse class="ch" cx="212" cy="160" rx="6" ry="4"/>
  <ellipse class="ch" cx="226" cy="160" rx="6" ry="4"/><ellipse class="ch" cx="240" cy="160" rx="6" ry="4"/>
  <ellipse class="ch" cx="254" cy="160" rx="6" ry="4"/><ellipse class="ch" cx="268" cy="160" rx="6" ry="4"/>
  <ellipse cx="282" cy="160" rx="6" ry="4" fill="none" stroke="#b0604a" stroke-width="3"/>
</g>
<text class="small" x="230" y="142">skip this ch</text>
<path class="arrow" d="M266 124 H60 M74 116 L60 124 L74 132"/>
<text class="soft" x="40" y="108">16 sc along the top</text>
<path class="arrow" d="M60 196 H266 M252 188 L266 196 L252 204"/>
<text class="soft" x="40" y="226">rotate, 16 sc on the</text>
<text class="soft" x="40" y="246">other side of the chain</text>
<text class="label" x="40" y="290">Ch 17. 16 + 16 = 32 sts</text>
<text class="soft" x="40" y="320">Join with a sl st in the</text>
<text class="soft" x="40" y="340">first sc. The chain is the</text>
<text class="soft" x="40" y="360">bottom fold of the pocket.</text>
<rect class="back" x="368" y="88" width="216" height="168"/>
<rect class="fab" x="360" y="96" width="216" height="168"/>
<text x="400" y="186" font-size="16" fill="#fdfaf6" font-family="Georgia, serif">front: 16 sts</text>
<text class="small" x="470" y="82">back: 16 sts</text>
<path class="arrow" d="M352 280 Q468 312 584 280 M570 274 L584 280 L572 290"/>
<text class="soft" x="344" y="320">16 sts = about 4.0 in wide</text>
<text class="soft" x="344" y="342">12 rnds = about 2.4 in deep</text>
<text class="soft" x="344" y="364">Sl st to join, ch 1 (not a st).</text>
<text class="soft" x="344" y="386">Do not turn. 32 sts each rnd.</text>
</svg>
