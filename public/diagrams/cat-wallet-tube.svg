<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 780" role="img">
<title>Black cat wallet: a seamless pocket from both sides of a chain</title>
<desc>Chain 17. Round 1 is 16 sc along the top and 16 along the underside, 32 stitches. Rounds 2-12 continue without turning.</desc>
<rect width="480" height="780" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="16" y="36" font-size="22" fill="#2f2a26">Chain 17. Skip the chain nearest the</text>
<text x="16" y="68" font-size="22" fill="#2f2a26">hook.</text>
<text x="16" y="132" font-size="22" fill="#2f2a26">Round 1: 16 sc along the top, then</text>
<text x="16" y="164" font-size="22" fill="#2f2a26">rotate and work 16 sc along the</text>
<text x="16" y="196" font-size="22" fill="#2f2a26">unused loops. (32)</text>
<text x="16" y="260" font-size="22" fill="#2f2a26">The last top stitch and the first</text>
<text x="16" y="292" font-size="22" fill="#2f2a26">underside stitch share the chain</text>
<text x="16" y="324" font-size="22" fill="#2f2a26">next to the slip knot.</text>
<text x="16" y="388" font-size="22" fill="#2f2a26">Join with a slip stitch in the first</text>
<text x="16" y="420" font-size="22" fill="#2f2a26">sc. Ch 1 does not count. Do not</text>
<text x="16" y="452" font-size="22" fill="#2f2a26">turn.</text>
<text x="16" y="516" font-size="22" fill="#2f2a26">Rounds 2-12: sc in each stitch. (32)</text>
<text x="16" y="580" font-size="22" fill="#2f2a26">The chain is the bottom fold. Front</text>
<text x="16" y="612" font-size="22" fill="#2f2a26">16, back 16. No side seams.</text>
<text x="16" y="676" font-size="22" fill="#2f2a26">About 4.0 in wide and 2.4 in deep at</text>
<text x="16" y="708" font-size="22" fill="#2f2a26">the example gauge. Check a card</text>
<text x="16" y="740" font-size="22" fill="#2f2a26">before the flap.</text>
</g>
</svg>
