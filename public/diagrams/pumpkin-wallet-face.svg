<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 652" role="img">
<title>Pumpkin wallet: jack-o-lantern embroidery map</title>
<desc>Front half only. Rows run sideways. Stitch 1 is the rim. Tab covers rows 10-13. Eyes, nose, and mouth stay clear of the tab.</desc>
<rect width="480" height="652" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="16" y="36" font-size="22" fill="#2f2a26">Embroider the front half before</text>
<text x="16" y="68" font-size="22" fill="#2f2a26">folding. Rows run left to right.</text>
<text x="16" y="132" font-size="22" fill="#2f2a26">Stitch 1 is the rim. Stitch 10 is</text>
<text x="16" y="164" font-size="22" fill="#2f2a26">the fold.</text>
<text x="16" y="228" font-size="22" fill="#2f2a26">Leaf tab: rows 10-13, stitches 1-5.</text>
<text x="16" y="260" font-size="22" fill="#2f2a26">Sew it on later. Keep the face clear</text>
<text x="16" y="292" font-size="22" fill="#2f2a26">of it.</text>
<text x="16" y="356" font-size="22" fill="#2f2a26">Eyes: rows 5-7 and 16-18, stitches</text>
<text x="16" y="388" font-size="22" fill="#2f2a26">3-5.</text>
<text x="16" y="452" font-size="22" fill="#2f2a26">Nose: rows 11-12, stitches 6-7.</text>
<text x="16" y="516" font-size="22" fill="#2f2a26">Mouth: rows 6-17, stitches 8-9.</text>
<text x="16" y="580" font-size="22" fill="#2f2a26">Row k matches row 23 minus k, so row</text>
<text x="16" y="612" font-size="22" fill="#2f2a26">5 matches row 18.</text>
</g>
</svg>
