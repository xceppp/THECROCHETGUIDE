<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
<title>How to fix the AirPods sleeve from what you see</title>
<desc>Four fixes that keep the published method. A tight case adds two stitches or a larger hook. A loose case drops two stitches or uses a smaller hook. A ruffle moves increases back to the ends. A blocked lid is unbuttoned, then the wall is shortened if the seam is still covered.</desc>
<rect width="640" height="420" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="20" y="34" font-size="22" fill="#2f2a26" font-weight="bold">Match the fix to what you see</text>
<rect x="16" y="52" width="296" height="160" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="80" font-size="18" fill="#b0604a" font-weight="bold">Case will not enter</text>
<text x="32" y="110" font-size="16" fill="#2f2a26">Count is under the perimeter,</text>
<text x="32" y="134" font-size="16" fill="#2f2a26">or the fabric is stiff.</text>
<text x="32" y="170" font-size="16" fill="#6d635a">Add 2 stitches, or a larger hook.</text>
<rect x="328" y="52" width="296" height="160" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="344" y="80" font-size="18" fill="#b0604a" font-weight="bold">Case rattles</text>
<text x="344" y="110" font-size="16" fill="#2f2a26">Too much ease around</text>
<text x="344" y="134" font-size="16" fill="#2f2a26">the footprint.</text>
<text x="344" y="170" font-size="16" fill="#6d635a">Drop 2 stitches, or a smaller hook.</text>
<rect x="16" y="224" width="296" height="160" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="252" font-size="18" fill="#b0604a" font-weight="bold">Base ruffles</text>
<text x="32" y="282" font-size="16" fill="#2f2a26">Extra increases sit on</text>
<text x="32" y="306" font-size="16" fill="#2f2a26">the straight sides.</text>
<text x="32" y="342" font-size="16" fill="#6d635a">Increases belong at the ends only.</text>
<rect x="328" y="224" width="296" height="160" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="344" y="252" font-size="18" fill="#b0604a" font-weight="bold">Lid will not open</text>
<text x="344" y="282" font-size="16" fill="#2f2a26">Flap is buttoned, or the rim</text>
<text x="344" y="306" font-size="16" fill="#2f2a26">covers the seam.</text>
<text x="344" y="342" font-size="16" fill="#6d635a">Fold the flap back. Then shorten.</text>
</g>
</svg>
