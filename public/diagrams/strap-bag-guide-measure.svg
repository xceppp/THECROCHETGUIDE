<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
<title>Measure the stack before the chain</title>
<desc>Width, thickness, and height of the items, then the rectangle. Width of the chain is item width plus stack thickness plus seam and ease. Row length is two faces, folded at the middle. The phone example stays 15 single crochet by 70 rows. The shoulder example stays 27 single crochet by 66 rows.</desc>
<rect width="640" height="420" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<rect x="16" y="16" width="608" height="52" rx="8" fill="#f6efe6"/>
<text x="32" y="48" font-size="22" fill="#2f2a26" font-weight="bold">Measure the stack before you chain</text>
<rect x="16" y="84" width="296" height="320" rx="8" fill="#f6efe6"/>
<text x="32" y="114" font-size="18" fill="#2f2a26" font-weight="bold">On the items</text>
<rect x="40" y="136" width="70" height="96" rx="4" fill="#e6ddd1" stroke="#6d635a" stroke-width="2"/>
<rect x="56" y="148" width="70" height="96" rx="4" fill="#fdfaf6" stroke="#2f2a26" stroke-width="2"/>
<rect x="72" y="160" width="70" height="96" rx="4" fill="#f6efe6" stroke="#b0604a" stroke-width="3"/>
<path d="M72 272 H142" stroke="#b0604a" stroke-width="3"/>
<text x="160" y="168" font-size="16" fill="#2f2a26">Width</text>
<text x="160" y="190" font-size="16" fill="#6d635a">widest piece</text>
<path d="M40 256 H112" stroke="#7d8b72" stroke-width="3"/>
<text x="160" y="230" font-size="16" fill="#2f2a26">Thickness</text>
<text x="160" y="252" font-size="16" fill="#6d635a">whole stack</text>
<path d="M148 160 V256" stroke="#2f2a26" stroke-width="3"/>
<text x="160" y="292" font-size="16" fill="#2f2a26">Height</text>
<text x="160" y="314" font-size="16" fill="#6d635a">tallest piece</text>
<text x="32" y="352" font-size="16" fill="#6d635a">Closed size, not the</text>
<text x="32" y="374" font-size="16" fill="#6d635a">diagonal on the box.</text>
<rect x="328" y="84" width="296" height="320" rx="8" fill="#f6efe6"/>
<text x="344" y="114" font-size="18" fill="#2f2a26" font-weight="bold">On the rectangle</text>
<rect x="360" y="140" width="120" height="200" fill="#fdfaf6" stroke="#2f2a26" stroke-width="2"/>
<line x1="360" y1="240" x2="480" y2="240" stroke="#b0604a" stroke-width="2" stroke-dasharray="6 4"/>
<text x="488" y="168" font-size="16" fill="#2f2a26">Face</text>
<text x="488" y="248" font-size="16" fill="#b0604a">Fold</text>
<text x="488" y="312" font-size="16" fill="#2f2a26">Face</text>
<text x="344" y="364" font-size="16" fill="#6d635a">Chain width = width + thickness</text>
<text x="344" y="386" font-size="16" fill="#6d635a">+ seams + ease. Rows = two faces.</text>
</svg>
