<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
<title>Gnome proportions and build direction</title>
<desc>Side view of a gnome. The body is worked from the top down: a flat top of 30 stitches, then it widens to 36 and 42, then a back-loop round and decreases make a flat base with a weight bag inside. The hat is worked from its floppy tip down to 42 stitches, wider than the 36-stitch part of the body it covers. Its brim comes down to touch the top of the nose. The beard hangs below the nose.</desc>
<rect width="640" height="420" fill="#fdfaf6"/>
<style>
  text { font-family: Georgia, "Times New Roman", serif; }
  .label { font-size: 20px; fill: #2f2a26; }
  .soft { font-size: 16px; fill: #6d635a; }
  .body { fill: #f3e6d4; stroke: #6b4428; stroke-width: 2.5; }
  .hat { fill: #f6efe6; stroke: #b0604a; stroke-width: 3; }
  .beard { fill: #fdfaf6; stroke: #7d8b72; stroke-width: 2.5; }
  .bag { fill: none; stroke: #6d635a; stroke-width: 2; stroke-dasharray: 5 4; }
</style>
<rect x="16" y="16" width="608" height="388" rx="10" fill="#f6efe6" stroke="#e6ddd1"/>
<text class="label" x="32" y="46">The brim comes down to the nose</text>
<path class="body" d="M120 200 L110 240 L100 300 L100 360 L260 360 L260 300 L250 240 L240 200 Z"/>
<rect class="bag" x="120" y="330" width="120" height="24" rx="6"/>
<path class="hat" d="M96 236 L264 236 L230 150 C215 110 200 90 230 70 C190 80 170 110 150 150 Z"/>
<path class="beard" d="M130 248 Q180 250 230 248 L222 320 Q180 345 138 320 Z"/>
<circle cx="180" cy="248" r="16" fill="#f3e6d4" stroke="#6b4428" stroke-width="2.5"/>
<text class="soft" x="290" y="80">Hat: from the tip down</text>
<text class="soft" x="290" y="102">to 42 sts, slightly wider</text>
<text class="soft" x="290" y="124">than the body it covers</text>
<text class="soft" x="290" y="190">Body: from the top down,</text>
<text class="soft" x="290" y="212">30, then 36, then 42</text>
<text class="soft" x="290" y="250">Brim touches the nose</text>
<text class="soft" x="290" y="310">Back-loop round, then decreases:</text>
<text class="soft" x="290" y="332">a flat base, weight bag inside</text>
<text class="soft" x="32" y="390">Brim above the nose: a person in a cap. Brim on the nose: a gnome.</text>
</svg>
