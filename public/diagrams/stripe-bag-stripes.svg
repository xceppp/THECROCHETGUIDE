<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img">
<title>Sample stripe map, 34 body rows</title>
<desc>Front panel rows 1 to 34: terracotta 1-4, cream 5-7, terracotta 8-11, cream 12-14, terracotta 15-18, cream 19-21, terracotta 22-25, cream 26-28, terracotta 29-32, cream 33-34. The back continues in cream for rows 35-40, with the buttonhole on row 38.</desc>
<rect width="640" height="520" fill="#fdfaf6"/>
<style>
  text { font-family: Georgia, "Times New Roman", serif; }
  .label { font-size: 22px; fill: #2f2a26; }
  .soft { font-size: 16px; fill: #6d635a; }
</style>
<rect x="16" y="16" width="608" height="488" rx="10" fill="#f6efe6" stroke="#e6ddd1"/>
<text class="label" x="32" y="48">Sample color map, 17 sc wide</text>
<g transform="translate(40,70)">
  <rect x="0" y="0" width="220" height="28" fill="#f4efe6" stroke="#2f2a26"/>
  <text class="soft" x="8" y="19">Rows 35-40 cream, back only</text>
  <rect x="0" y="28" width="220" height="16" fill="#f4efe6" stroke="#2f2a26"/>
  <text class="soft" x="8" y="40">33-34 cream</text>
  <rect x="0" y="44" width="220" height="36" fill="#c46a4a" stroke="#2f2a26"/>
  <text x="8" y="66" font-size="16" fill="#fff">29-32 terracotta</text>
  <rect x="0" y="80" width="220" height="28" fill="#f4efe6" stroke="#2f2a26"/>
  <text class="soft" x="8" y="98">26-28 cream</text>
  <rect x="0" y="108" width="220" height="36" fill="#c46a4a" stroke="#2f2a26"/>
  <text x="8" y="130" font-size="16" fill="#fff">22-25 terracotta</text>
  <rect x="0" y="144" width="220" height="28" fill="#f4efe6" stroke="#2f2a26"/>
  <text class="soft" x="8" y="162">19-21 cream</text>
  <rect x="0" y="172" width="220" height="36" fill="#c46a4a" stroke="#2f2a26"/>
  <text x="8" y="194" font-size="16" fill="#fff">15-18 terracotta</text>
  <rect x="0" y="208" width="220" height="28" fill="#f4efe6" stroke="#2f2a26"/>
  <text class="soft" x="8" y="226">12-14 cream</text>
  <rect x="0" y="236" width="220" height="36" fill="#c46a4a" stroke="#2f2a26"/>
  <text x="8" y="258" font-size="16" fill="#fff">8-11 terracotta</text>
  <rect x="0" y="272" width="220" height="28" fill="#f4efe6" stroke="#2f2a26"/>
  <text class="soft" x="8" y="290">5-7 cream</text>
  <rect x="0" y="300" width="220" height="36" fill="#c46a4a" stroke="#2f2a26"/>
  <text x="8" y="322" font-size="16" fill="#fff">1-4 terracotta</text>
</g>
<text class="label" x="300" y="120">Front stops at row 34.</text>
<text class="soft" x="300" y="150">Back matches rows 1-34,</text>
<text class="soft" x="300" y="174">then six more cream rows.</text>
<text class="soft" x="300" y="214">Row 38 is the buttonhole:</text>
<text class="soft" x="300" y="238">7 sc, ch 3, skip 3, 7 sc.</text>
<text class="soft" x="300" y="278">Row 39 puts 3 sc in the chain</text>
<text class="soft" x="300" y="302">and returns to 17 sc.</text>
<text class="soft" x="32" y="470">Four terracotta rows, then three cream rows, repeated.</text>
<text class="soft" x="32" y="494">If your row count changes, keep the top band cream.</text>
</svg>
