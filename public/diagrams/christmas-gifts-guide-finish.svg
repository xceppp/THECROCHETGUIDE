<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
<title>Finish a Christmas crochet gift before it is wrapped</title>
<desc>Four steps in order. Weave the ends. Let stiffener or a washed swatch dry. Write a care card with fiber, wash method, and what the object is not. Keep the ball band. Then wrap it.</desc>
<rect width="640" height="420" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="20" y="36" font-size="22" fill="#2f2a26" font-weight="bold">Done means finished, not cast off</text>
<rect x="16" y="64" width="140" height="250" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="86" y="100" font-size="20" fill="#b0604a" text-anchor="middle" font-weight="bold">1</text>
<text x="86" y="140" font-size="16" fill="#2f2a26" text-anchor="middle">Weave</text>
<text x="86" y="164" font-size="16" fill="#2f2a26" text-anchor="middle">every end</text>
<text x="86" y="210" font-size="16" fill="#6d635a" text-anchor="middle">Loose tails</text>
<text x="86" y="234" font-size="16" fill="#6d635a" text-anchor="middle">are not a gift.</text>
<rect x="172" y="64" width="140" height="250" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="242" y="100" font-size="20" fill="#b0604a" text-anchor="middle" font-weight="bold">2</text>
<text x="242" y="140" font-size="16" fill="#2f2a26" text-anchor="middle">Dry what</text>
<text x="242" y="164" font-size="16" fill="#2f2a26" text-anchor="middle">must dry</text>
<text x="242" y="210" font-size="16" fill="#6d635a" text-anchor="middle">Snowflake overnight.</text>
<text x="242" y="234" font-size="16" fill="#6d635a" text-anchor="middle">Blanket swatch first.</text>
<rect x="328" y="64" width="140" height="250" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="398" y="100" font-size="20" fill="#b0604a" text-anchor="middle" font-weight="bold">3</text>
<text x="398" y="140" font-size="16" fill="#2f2a26" text-anchor="middle">Care card</text>
<text x="398" y="176" font-size="16" fill="#6d635a" text-anchor="middle">Fiber.</text>
<text x="398" y="200" font-size="16" fill="#6d635a" text-anchor="middle">How to wash.</text>
<text x="398" y="224" font-size="16" fill="#6d635a" text-anchor="middle">What it is not.</text>
<rect x="484" y="64" width="140" height="250" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="554" y="100" font-size="20" fill="#b0604a" text-anchor="middle" font-weight="bold">4</text>
<text x="554" y="140" font-size="16" fill="#2f2a26" text-anchor="middle">Keep the</text>
<text x="554" y="164" font-size="16" fill="#2f2a26" text-anchor="middle">ball band</text>
<text x="554" y="210" font-size="16" fill="#6d635a" text-anchor="middle">Pin it to a</text>
<text x="554" y="234" font-size="16" fill="#6d635a" text-anchor="middle">spare strand.</text>
<text x="20" y="360" font-size="16" fill="#2f2a26">A cozy is not a hot pad. Slippers slide. A stiffened ornament dissolves if it gets wet.</text>
<text x="20" y="392" font-size="16" fill="#6d635a">Say that on the card. The person opening the box did not read the tutorial.</text>
</g>
</svg>
