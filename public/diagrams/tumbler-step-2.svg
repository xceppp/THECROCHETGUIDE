<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 585" role="img">
<title>Tumbler sleeve wedge: four short rows</title>
<desc>The sleeve strip drawn with each row as a column 18 stitches tall and the top edge at the top. Between rows 17 and 18 sit four short rows worked from the top edge: two of 12 stitches and two of 6. The top edge gains four rows and the bottom edge none, which is what makes the top 39 rows long and the bottom 35.</desc>
