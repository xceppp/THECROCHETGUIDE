<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 244" role="img">
<title>Granny tote: the top edge</title>
<desc>Each square's top takes 17 single crochet. Four tops make 68. Work that count twice.</desc>
<rect width="480" height="244" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="16" y="40" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Granny tote: the top edge</text>
<rect x="16" y="72" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="100" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">1 in each stitch and space</text>
<text x="32" y="126" font-size="20" fill="#6d635a" text-anchor="start">Including one in each corner space.</text>
<rect x="16" y="150" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="178" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">68, then 68 again</text>
<text x="32" y="204" font-size="20" fill="#6d635a" text-anchor="start">More ruffles. Fewer draws the opening in.</text>
</svg>
