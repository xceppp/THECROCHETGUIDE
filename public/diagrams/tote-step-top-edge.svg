<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 244" role="img">
<title>Single crochet around the top</title>
<desc>Each square top takes 17 stitches. Four tops make 68.</desc>
<rect width="480" height="244" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="240" y="36" font-size="22" fill="#2f2a26" text-anchor="middle" font-weight="bold">The top edge</text>
<rect x="100" y="70" width="280" height="110" fill="#f6efe6" stroke="#2f2a26" stroke-width="3"/>
<line x1="100" y1="70" x2="380" y2="70" stroke="#b0604a" stroke-width="8"/>
<text x="240" y="220" font-size="22" fill="#2f2a26" text-anchor="middle">17 on each square</text>
</svg>
