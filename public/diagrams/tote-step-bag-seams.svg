<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 322" role="img">
<title>Granny tote: three seams</title>
<desc>Front and back right sides together. 38 down one side, 38 across the bottom, 38 up the other side. Leave the top open.</desc>
<rect width="480" height="322" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="16" y="40" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Granny tote: three seams</text>
<rect x="16" y="72" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="100" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Count 38 on each edge</text>
<text x="32" y="126" font-size="20" fill="#6d635a" text-anchor="start">A different count puckers.</text>
<rect x="16" y="150" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="178" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Four stitches turn a bottom corner</text>
<text x="32" y="204" font-size="20" fill="#6d635a" text-anchor="start">The two corner spaces already provide them.</text>
<rect x="16" y="228" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="256" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Turn right side out</text>
<text x="32" y="282" font-size="20" fill="#6d635a" text-anchor="start">The ridges stay inside.</text>
</svg>
