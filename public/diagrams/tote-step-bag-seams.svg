<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 322" role="img">
<title>Three seams, top open</title>
<desc>Side, bottom, side. The top stays open.</desc>
<rect width="480" height="322" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="240" y="40" font-size="22" fill="#2f2a26" text-anchor="middle" font-weight="bold">Three seams</text>
<path d="M140 70 V250 H340 V70" fill="#f6efe6" stroke="#b0604a" stroke-width="6"/>
<text x="240" y="300" font-size="22" fill="#2f2a26" text-anchor="middle">leave the top open</text>
</svg>
