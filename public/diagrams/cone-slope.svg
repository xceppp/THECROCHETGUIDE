<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
<title>How the increase rate sets a cone's slope</title>
<desc>Three cones worked from the tip down. Adding about 1.5 stitches a round on average makes a slim cone. About 2 stitches a round makes a medium tree. About 3 a round makes a squat cone. Six a round lies flat. Below, a flat triangle in rows: decreasing both ends every row makes a wide, low triangle; decreasing both ends every other row makes a taller tree shape.</desc>
<rect width="640" height="420" fill="#fdfaf6"/>
<style>
  text { font-family: Georgia, "Times New Roman", serif; }
  .label { font-size: 20px; fill: #2f2a26; }
  .soft { font-size: 16px; fill: #6d635a; }
  .cone { fill: #f3e6d4; stroke: #6b4428; stroke-width: 2.5; }
  .tri { fill: #f6efe6; stroke: #7d8b72; stroke-width: 2.5; }
</style>
<rect x="16" y="16" width="608" height="388" rx="10" fill="#f6efe6" stroke="#e6ddd1"/>
<text class="label" x="32" y="46">Stitches added per round set the slope</text>
<polygon class="cone" points="100,70 70,220 130,220"/>
<polygon class="cone" points="260,70 210,220 310,220"/>
<polygon class="cone" points="440,120 360,220 520,220"/>
<line x1="540" y1="220" x2="610" y2="220" stroke="#6b4428" stroke-width="4"/>
<text class="soft" x="56" y="246">about 1.5</text>
<text class="soft" x="56" y="268">slim</text>
<text class="soft" x="220" y="246">about 2</text>
<text class="soft" x="220" y="268">the tree here</text>
<text class="soft" x="410" y="246">about 3</text>
<text class="soft" x="410" y="268">squat</text>
<text class="soft" x="548" y="246">6</text>
<text class="soft" x="548" y="268">flat</text>
<polygon class="tri" points="60,370 220,370 140,330"/>
<polygon class="tri" points="330,370 490,370 410,290"/>
<text class="soft" x="40" y="394">Decrease both ends every row: low</text>
<text class="soft" x="320" y="394">Every other row: a tree</text>
</svg>
