<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 244" role="img">
<title>Granny tote: straps and placement</title>
<desc>Straps are 5 stitches wide. On each panel of 34, skip 8, sew 5, skip 8, sew 5, skip 8. Sew through both edge rounds.</desc>
<rect width="480" height="244" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="16" y="40" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Granny tote: straps and placement</text>
<rect x="16" y="72" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="100" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Match the second strap by rows</text>
<text x="32" y="126" font-size="20" fill="#6d635a" text-anchor="start">Do not stretch it to the tape.</text>
<rect x="16" y="150" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="178" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">One inch of overlap inside</text>
<text x="32" y="204" font-size="20" fill="#6d635a" text-anchor="start">Catch the clusters under the edge.</text>
</svg>
