<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 244" role="img">
<title>Where the straps sit</title>
<desc>On each panel, skip, sew a strap, skip, sew a strap, skip.</desc>
<rect width="480" height="244" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="240" y="36" font-size="22" fill="#2f2a26" text-anchor="middle" font-weight="bold">Strap placement</text>
<rect x="80" y="80" width="320" height="100" fill="#f6efe6" stroke="#2f2a26" stroke-width="3"/>
<rect x="150" y="60" width="40" height="40" fill="#b0604a"/>
<rect x="290" y="60" width="40" height="40" fill="#b0604a"/>
<text x="240" y="220" font-size="22" fill="#2f2a26" text-anchor="middle">two straps, even gaps</text>
</svg>
