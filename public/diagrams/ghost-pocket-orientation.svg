<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 780" role="img">
<title>Ghost wallet: front on the lower back, face above the opening</title>
<desc>Place the front on the back's right side. The front covers rows 1 to 14. The face sits on the back above that opening. The front's top edge stays unworked.</desc>
<rect width="480" height="780" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#7d8b72" stroke-width="1.5"/></pattern>
</defs>

<text x="16" y="36" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Front covers the lower back</text>
<rect x="90" y="70" width="220" height="560" fill="#f4efe6" stroke="#2f2a26" stroke-width="3"/>
<polygon points="90,470 310,470 286,630 114,630" fill="#f4efe6" stroke="#2f2a26" stroke-width="3"/>
<text x="110" y="120" font-size="20" fill="#2f2a26" text-anchor="start" font-weight="bold">face on RS</text>
<circle cx="160" cy="160" r="10" fill="#2f2a26"/>
<circle cx="240" cy="160" r="10" fill="#2f2a26"/>
<text x="110" y="210" font-size="20" fill="#2f2a26" text-anchor="start">rows 15-22</text>
<rect x="110" y="280" width="180" height="280" fill="#fff" stroke="#b0604a" stroke-width="4"/>
<text x="130" y="320" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">front panel</text>
<text x="130" y="350" font-size="20" fill="#2f2a26" text-anchor="start">rows 1-14</text>
<line x1="110" y1="280" x2="290" y2="280" stroke="#b0604a" stroke-width="6"/>
<text x="320" y="286" font-size="22" fill="#b0604a" text-anchor="start" font-weight="bold">opening</text>
<text x="320" y="316" font-size="20" fill="#b0604a" text-anchor="start">unworked</text>
<text x="16" y="690" font-size="20" fill="#2f2a26" text-anchor="start">Wrong side of the front faces the back's right side.</text>
<text x="16" y="730" font-size="20" fill="#6d635a" text-anchor="start">Thick line: leave this edge unsewn.</text>

</svg>
