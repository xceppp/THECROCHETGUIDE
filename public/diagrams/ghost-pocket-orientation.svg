<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 860" role="img">
<title>Ghost wallet: front on the lower back, face above the opening</title>
<desc>The wide foundation hem is at the bottom. Rows 19 to 22 narrow at the top. Place the front on the lower back, covering rows 1 to 14. The face sits above that opening. Leave the front's row-14 edge unworked.</desc>
<rect width="480" height="860" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#7d8b72" stroke-width="1.5"/></pattern>
</defs>

<text x="16" y="34" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Front covers the lower back</text>
<text x="16" y="64" font-size="20" fill="#2f2a26" text-anchor="start" font-weight="bold">TOP: row 22</text>
<rect x="150" y="78" width="100" height="24" fill="#f4efe6" stroke="#2f2a26" stroke-width="3"/>
<rect x="130" y="102" width="140" height="24" fill="#f4efe6" stroke="#2f2a26" stroke-width="3"/>
<rect x="114" y="126" width="172" height="24" fill="#f4efe6" stroke="#2f2a26" stroke-width="3"/>
<rect x="100" y="150" width="200" height="24" fill="#f4efe6" stroke="#2f2a26" stroke-width="3"/>
<rect x="80" y="174" width="240" height="460" fill="#f4efe6" stroke="#2f2a26" stroke-width="3"/>
<circle cx="160" cy="230" r="10" fill="#2f2a26"/>
<circle cx="240" cy="230" r="10" fill="#2f2a26"/>
<text x="96" y="270" font-size="20" fill="#2f2a26" text-anchor="start" font-weight="bold">face, above the opening</text>
<rect x="100" y="316" width="200" height="318" fill="#fff" stroke="#2f2a26" stroke-width="3"/>
<line x1="100" y1="316" x2="300" y2="316" stroke="#b0604a" stroke-width="6"/>
<text x="320" y="308" font-size="20" fill="#b0604a" text-anchor="start" font-weight="bold">row 14</text>
<text x="320" y="336" font-size="20" fill="#b0604a" text-anchor="start">unworked</text>
<text x="112" y="400" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">front</text>
<text x="112" y="430" font-size="20" fill="#2f2a26" text-anchor="start">rows 1-14</text>
<text x="80" y="670" font-size="20" fill="#2f2a26" text-anchor="start" font-weight="bold">BOTTOM: foundation hem</text>
<text x="16" y="720" font-size="20" fill="#2f2a26" text-anchor="start">Wrong side of the front faces the back.</text>
<text x="16" y="760" font-size="20" fill="#2f2a26" text-anchor="start">The head narrows only at the top.</text>
<text x="16" y="810" font-size="20" fill="#6d635a" text-anchor="start">Thick line: leave this edge unsewn.</text>

</svg>
