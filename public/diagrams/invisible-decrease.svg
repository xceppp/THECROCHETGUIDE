<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 752" role="img">
<title>Invisible decrease for amigurumi</title>
<desc>Three steps. 1: insert the hook into the front loop only of the next stitch. 2: without pulling through, insert into the front loop of the stitch after it, so three loops are on the hook. 3: yarn over and pull through the two front loops, then yarn over and pull through the two loops on the hook. Two stitches become one.</desc>
<rect width="480" height="752" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<text x="20" y="44" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Invisible decrease for amigurumi</text><rect x="12" y="64" width="456" height="224.5" rx="10" fill="#f6efe6" stroke="#e6ddd1"/><circle cx="38" cy="90" r="15" fill="#b0604a"/><text x="38" y="97" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="62" y="97" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Front loop of the next stitch</text><path d="M100 144.5 h120 M240 144.5 h120" stroke="#6b4428" stroke-width="6" stroke-linecap="round"/><path d="M100 166.5 h120 M240 166.5 h120" stroke="#c9bfb3" stroke-width="6" stroke-linecap="round"/><path d="M130 188.5 L170 140.5" stroke="#b0604a" stroke-width="5" stroke-linecap="round"/><text x="100" y="210.5" font-size="20" fill="#6d635a">front loops dark, back loops pale</text><text x="36" y="244.5" font-size="20" fill="#2f2a26" text-anchor="start">Insert under the front loop only. Do</text>
<text x="36" y="269.5" font-size="20" fill="#2f2a26" text-anchor="start">not yarn over yet.</text><rect x="12" y="300.5" width="456" height="195" rx="10" fill="#f6efe6" stroke="#e6ddd1"/><circle cx="38" cy="326.5" r="15" fill="#b0604a"/><text x="38" y="333.5" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="62" y="333.5" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Front loop of the stitch after</text>
<text x="62" y="361" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">it</text><path d="M100 408.5 h120 M240 408.5 h120" stroke="#6b4428" stroke-width="6" stroke-linecap="round"/><path d="M130 438.5 L310 404.5" stroke="#b0604a" stroke-width="5" stroke-linecap="round"/><text x="36" y="476.5" font-size="20" fill="#2f2a26" text-anchor="start">Now three loops are on the hook.</text><rect x="12" y="507.5" width="456" height="224.5" rx="10" fill="#f6efe6" stroke="#e6ddd1"/><circle cx="38" cy="533.5" r="15" fill="#b0604a"/><text x="38" y="540.5" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">3</text><text x="62" y="540.5" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Close it</text><path d="M211 579L229 597M229 579L211 597" stroke="#7d8b72" stroke-width="3" stroke-linecap="round"/><text x="248" y="596" font-size="20" fill="#6d635a">2 sts → 1</text><text x="36" y="638" font-size="20" fill="#2f2a26" text-anchor="start">Yarn over, pull through the two front</text>
<text x="36" y="663" font-size="20" fill="#2f2a26" text-anchor="start">loops, yarn over, pull through both</text>
<text x="36" y="688" font-size="20" fill="#2f2a26" text-anchor="start">loops on the hook. Two stitches become</text>
<text x="36" y="713" font-size="20" fill="#2f2a26" text-anchor="start">one.</text>
</svg>
