<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 244" role="img">
<title>The point loses a stitch each end</title>
<desc>Each decrease row is shorter at both ends until one stitch remains.</desc>
<rect width="480" height="244" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="240" y="36" font-size="22" fill="#2f2a26" text-anchor="middle" font-weight="bold">The point</text>
<polygon points="80,70 400,70 240,200" fill="#f6efe6" stroke="#b0604a" stroke-width="4"/>
<text x="240" y="228" font-size="22" fill="#2f2a26" text-anchor="middle">shorter at both ends</text>
</svg>
