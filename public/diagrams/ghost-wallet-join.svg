<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 684" role="img">
<title>Ghost wallet: joining edging and scalloped hem</title>
<desc>Hem uses all 17 stitches: slip stitch in stitch 1, then the 4-stitch scallop four times. Each side is 23 sc. Top is 9. Do not close the front opening.</desc>
<rect width="480" height="684" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="16" y="36" font-size="22" fill="#2f2a26">Start in stitch 1 of the hem,</text>
<text x="16" y="68" font-size="22" fill="#2f2a26">through both layers.</text>
<text x="16" y="132" font-size="22" fill="#2f2a26">Hem: sl st in st 1, then (skip 1, 5</text>
<text x="16" y="164" font-size="22" fill="#2f2a26">hdc in the next, skip 1, sl st in</text>
<text x="16" y="196" font-size="22" fill="#2f2a26">the next) 4 times.</text>
<text x="16" y="260" font-size="22" fill="#2f2a26">1 + 4 times 4 = 17 hem stitches.</text>
<text x="16" y="324" font-size="22" fill="#2f2a26">Right side: 14 sc through both</text>
<text x="16" y="356" font-size="22" fill="#2f2a26">layers, 4 sc in the back only, 5 sc</text>
<text x="16" y="388" font-size="22" fill="#2f2a26">along the slope. (23)</text>
<text x="16" y="452" font-size="22" fill="#2f2a26">Top: 9 sc across the head.</text>
<text x="16" y="516" font-size="22" fill="#2f2a26">Left side: 5 + 4 + 14. (23)</text>
<text x="16" y="580" font-size="22" fill="#2f2a26">Slip stitch to the first slip</text>
<text x="16" y="612" font-size="22" fill="#2f2a26">stitch. Do not edge the front</text>
<text x="16" y="644" font-size="22" fill="#2f2a26">panel's top. That is the opening.</text>
</g>
</svg>
