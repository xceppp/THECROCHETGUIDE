<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 652" role="img">
<title>Witch hat wallet: one rectangle in three zones</title>
<desc>17 sc wide. Front rows 1-12, back 13-24, flap 25-33. Row 31 is the buttonhole. Row 33 decreases to 15.</desc>
<rect width="480" height="652" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="16" y="36" font-size="22" fill="#2f2a26">Chain 18. Row 1: sc in the 2nd chain</text>
<text x="16" y="68" font-size="22" fill="#2f2a26">and across. (17)</text>
<text x="16" y="132" font-size="22" fill="#2f2a26">Ch 1 does not count.</text>
<text x="16" y="196" font-size="22" fill="#2f2a26">Rows 1-12: front. It folds up. The</text>
<text x="16" y="228" font-size="22" fill="#2f2a26">chain edge is the rim.</text>
<text x="16" y="292" font-size="22" fill="#2f2a26">Rows 13-24: back, 12 rows, about 2.4</text>
<text x="16" y="324" font-size="22" fill="#2f2a26">in at the example gauge.</text>
<text x="16" y="388" font-size="22" fill="#2f2a26">Rows 25-33: flap, 9 rows.</text>
<text x="16" y="452" font-size="22" fill="#2f2a26">Row 31: sc 7, chain 3, skip 3, sc 7.</text>
<text x="16" y="516" font-size="22" fill="#2f2a26">Row 33: sc2tog, sc 13, sc2tog. (15)</text>
<text x="16" y="580" font-size="22" fill="#2f2a26">Fold at row 12 and at row 24. Leave</text>
<text x="16" y="612" font-size="22" fill="#2f2a26">the flap outside the side seams.</text>
</g>
</svg>
