<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 780" role="img">
<title>Witch-hat wallet: front, back, and flap</title>
<desc>One rectangle, 17 stitches wide. Rows 1 to 12 are the front, 13 to 24 the back, 25 to 33 the flap. Row 31 holds the buttonhole. The hat stays on the flap and clear of that hole.</desc>
<rect width="480" height="780" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#7d8b72" stroke-width="1.5"/></pattern>
</defs>

<text x="16" y="36" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">One rectangle, three zones</text>
<rect x="80" y="70" width="220" height="140" fill="#8d6bb5" stroke="#2f2a26" stroke-width="3"/>
<text x="96" y="140" font-size="22" fill="#fdfaf6" text-anchor="start" font-weight="bold">front 1-12</text>
<rect x="80" y="210" width="220" height="140" fill="#c4b6e0" stroke="#2f2a26" stroke-width="3"/>
<text x="96" y="280" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">back 13-24</text>
<rect x="80" y="350" width="220" height="160" fill="#6d4f96" stroke="#2f2a26" stroke-width="3"/>
<text x="96" y="400" font-size="22" fill="#fdfaf6" text-anchor="start" font-weight="bold">flap 25-33</text>
<rect x="150" y="450" width="80" height="22" fill="#fdfaf6" stroke="#b0604a" stroke-width="3"/>
<text x="320" y="150" font-size="20" fill="#2f2a26" text-anchor="start">fold after 12</text>
<text x="320" y="280" font-size="20" fill="#2f2a26" text-anchor="start">fold after 24</text>
<text x="320" y="468" font-size="20" fill="#2f2a26" text-anchor="start" font-weight="bold">row 31 hole</text>
<text x="16" y="560" font-size="20" fill="#2f2a26" text-anchor="start">Row 31: sc 7, ch 3, skip 3, sc 7.</text>
<text x="16" y="600" font-size="20" fill="#2f2a26" text-anchor="start">Row 32 puts 3 sc in the chain space.</text>
<text x="16" y="650" font-size="20" fill="#2f2a26" text-anchor="start" font-weight="bold">Pin the hat on the flap only.</text>
<text x="16" y="690" font-size="20" fill="#2f2a26" text-anchor="start" font-weight="bold">Do not cover row 31.</text>
<text x="16" y="750" font-size="20" fill="#6d635a" text-anchor="start">Legend: white slot = buttonhole.</text>

</svg>
