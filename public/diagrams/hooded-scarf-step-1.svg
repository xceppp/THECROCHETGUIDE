ize="20" fill="#2f2a26" text-anchor="middle">ch 26 (14 not drawn)</text><path d="M335.7142857142857 180 V130" stroke="#b0604a" stroke-width="3" marker-end="url(#ah)"/><text x="20" y="206" font-size="22" fill="#8f4a37" text-anchor="start">First hdc goes in the 3rd chain from</text>
