<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 466" role="img">
<title>Brim: chain 9, then 8 sc</title>
<desc>A foundation chain of 9. The chain nearest the hook is skipped and the first sc goes into the 2nd chain from the hook, so row 1 has 8 sc.</desc>
<rect width="480" height="466" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<circle cx="36" cy="36" r="20" fill="#b0604a"/><text x="36" y="44" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="66" y="44" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Brim: chain 9, then 8 sc</text><circle cx="26" cy="116" r="8" fill="#6b4428"/><text x="18" y="152" font-size="20" fill="#6d635a" text-anchor="start">slip knot</text><ellipse cx="60" cy="116" rx="18" ry="8" fill="none" stroke="#6b4428" stroke-width="4"/><ellipse cx="100" cy="116" rx="18" ry="8" fill="none" stroke="#6b4428" stroke-width="4"/><ellipse cx="140" cy="116" rx="18" ry="8" fill="none" stroke="#6b4428" stroke-width="4"/><ellipse cx="180" cy="116" rx="18" ry="8" fill="none" stroke="#6b4428" stroke-width="4"/><ellipse cx="220" cy="116" rx="18" ry="8" fill="none" stroke="#6b4428" stroke-width="4"/><ellipse cx="260" cy="116" rx="18" ry="8" fill="none" stroke="#6b4428" stroke-width="4"/><ellipse cx="300" cy="116" rx="18" ry="8" fill="none" stroke="#6b4428" stroke-width="4"/><ellipse cx="340" cy="116" rx="18" ry="8" fill="none" stroke="#b0604a" stroke-width="4"/><ellipse cx="380" cy="116" rx="18" ry="8" fill="none" stroke="#7d8b72" stroke-width="4" stroke-dasharray="5 3"/><path d="M412 116 H462 q10 0 10 -10" fill="none" stroke="#b0604a" stroke-width="5" stroke-linecap="round"/><text x="470" y="152" font-size="20" fill="#6d635a" text-anchor="end">hook</text><text x="240" y="92" font-size="20" fill="#2f2a26" text-anchor="middle">ch 9</text><path d="M340 180 V130" stroke="#b0604a" stroke-width="3" marker-end="url(#ah)"/><text x="20" y="206" font-size="22" fill="#8f4a37" text-anchor="start">First sc goes in the 2nd chain from</text>
<text x="20" y="233.5" font-size="22" fill="#8f4a37" text-anchor="start">the hook.</text><text x="20" y="267" font-size="20" fill="#7d8b72" text-anchor="start">The skipped chain next to the hook is the</text>
<text x="20" y="292" font-size="20" fill="#7d8b72" text-anchor="start">turning chain, not a stitch.</text><path d="M53.5 326L71.5 344M71.5 326L53.5 344" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M98.5 326L116.5 344M116.5 326L98.5 344" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M143.5 326L161.5 344M161.5 326L143.5 344" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M188.5 326L206.5 344M206.5 326L188.5 344" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M233.5 326L251.5 344M251.5 326L233.5 344" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M278.5 326L296.5 344M296.5 326L278.5 344" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M323.5 326L341.5 344M341.5 326L323.5 344" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M368.5 326L386.5 344M386.5 326L368.5 344" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M400 361 H50" stroke="#b0604a" stroke-width="3" marker-end="url(#ah)"/><text x="20" y="391" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Row 1: 8 sc. From row 2, back loop</text>
<text x="20" y="418.5" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">only.</text>
</svg>
