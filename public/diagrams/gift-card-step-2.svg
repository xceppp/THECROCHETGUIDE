<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 506" role="img">
<title>Fold 9 rows up, not in half</title>
<desc>Drawn to scale. A flat piece 16 sc, 4 in wide and 24 rows, 4.8 in tall, folded at the dashed line into a pocket. Right sides out. Seam both sides through both layers for the 9 front rows. Front: rows 1 to 9, 1.8 in. Back: rows 10 to 24, 3.0 in. A 2.125 in card shows about 0.33 in above the front.</desc>
<rect width="480" height="506" fill="#fdfaf6"/>
