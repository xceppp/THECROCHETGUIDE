<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 322" role="img">
<title>Ghost wallet: rows 2 to 18</title>
<desc>Each straight row is chain 1, turn, 17 single crochet. The chain 1 is not a stitch. Stop at row 18, still a rectangle.</desc>
<rect width="480" height="322" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="16" y="40" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Ghost wallet: rows 2 to 18</text>
<rect x="16" y="72" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="100" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Chain 1, then turn</text>
<text x="32" y="126" font-size="20" fill="#6d635a" text-anchor="start">The chain does not count.</text>
<rect x="16" y="150" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="178" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Single crochet in every stitch</text>
<text x="32" y="204" font-size="20" fill="#6d635a" text-anchor="start">Include the first and the last.</text>
<rect x="16" y="228" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="256" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Count 17, then start the next row</text>
<text x="32" y="282" font-size="20" fill="#6d635a" text-anchor="start">Stop when the side shows 18 ridges.</text>
</svg>
