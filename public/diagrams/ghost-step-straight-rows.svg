<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 322" role="img">
<title>Rows 2 to 18 stay a rectangle</title>
<desc>Seventeen stitches on every row through row 18.</desc>
<rect width="480" height="322" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="240" y="40" font-size="22" fill="#2f2a26" text-anchor="middle" font-weight="bold">Rows 2 to 18</text>
<rect x="90" y="64" width="300" height="210" fill="#f6efe6" stroke="#2f2a26" stroke-width="3"/>
<line x1="90" y1="92" x2="390" y2="92" stroke="#7d8b72" stroke-width="2"/><line x1="90" y1="118" x2="390" y2="118" stroke="#7d8b72" stroke-width="2"/><line x1="90" y1="144" x2="390" y2="144" stroke="#7d8b72" stroke-width="2"/><line x1="90" y1="170" x2="390" y2="170" stroke="#7d8b72" stroke-width="2"/><line x1="90" y1="196" x2="390" y2="196" stroke="#7d8b72" stroke-width="2"/><line x1="90" y1="222" x2="390" y2="222" stroke="#7d8b72" stroke-width="2"/><line x1="90" y1="248" x2="390" y2="248" stroke="#7d8b72" stroke-width="2"/>
<text x="240" y="300" font-size="22" fill="#2f2a26" text-anchor="middle">17 stitches, still a rectangle</text>
</svg>
