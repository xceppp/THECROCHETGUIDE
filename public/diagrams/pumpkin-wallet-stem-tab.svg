<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 844" role="img">
<title>Pumpkin wallet: stem, leaf tab, and snap</title>
<desc>Stem is 6 sc by 3 rows, rolled. Tab is 3 sc for 6 rows, then sc3tog. Sew the tab inside the back rim. Stem sits on the back rim.</desc>
<rect width="480" height="844" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="16" y="36" font-size="22" fill="#2f2a26">Stem: chain 7. Sc in the 2nd chain</text>
<text x="16" y="68" font-size="22" fill="#2f2a26">and across. (6)</text>
<text x="16" y="132" font-size="22" fill="#2f2a26">Rows 2-3: ch 1, turn, sc 6. Fasten</text>
<text x="16" y="164" font-size="22" fill="#2f2a26">off.</text>
<text x="16" y="228" font-size="22" fill="#2f2a26">Roll from a short end and sew the</text>
<text x="16" y="260" font-size="22" fill="#2f2a26">edge down.</text>
<text x="16" y="324" font-size="22" fill="#2f2a26">Tab: chain 4. Sc in the 2nd chain</text>
<text x="16" y="356" font-size="22" fill="#2f2a26">and across. (3)</text>
<text x="16" y="420" font-size="22" fill="#2f2a26">Rows 2-6: sc 3. Row 7: sc3tog. (1)</text>
<text x="16" y="452" font-size="22" fill="#2f2a26">Fasten off.</text>
<text x="16" y="516" font-size="22" fill="#2f2a26">Sew the tab's foundation edge inside</text>
<text x="16" y="548" font-size="22" fill="#2f2a26">the back rim, centered.</text>
<text x="16" y="612" font-size="22" fill="#2f2a26">The tab comes over both rims. Mark</text>
<text x="16" y="644" font-size="22" fill="#2f2a26">the snap on the front with the tab</text>
<text x="16" y="676" font-size="22" fill="#2f2a26">closed.</text>
<text x="16" y="740" font-size="22" fill="#2f2a26">Sew the stem on the back rim, over</text>
<text x="16" y="772" font-size="22" fill="#2f2a26">the tab's base, not on the front of</text>
<text x="16" y="804" font-size="22" fill="#2f2a26">the tab.</text>
</g>
</svg>
