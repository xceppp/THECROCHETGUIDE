<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 244" role="img">
<title>The leaf tab</title>
<desc>A short strip that narrows to a point.</desc>
<rect width="480" height="244" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="240" y="40" font-size="22" fill="#2f2a26" text-anchor="middle" font-weight="bold">Leaf tab</text>
<polygon points="190,70 290,70 270,150 240,190 210,150" fill="#7d8b72" stroke="#2f2a26" stroke-width="3"/>
<text x="240" y="224" font-size="22" fill="#2f2a26" text-anchor="middle">wide, then a point</text>
</svg>
