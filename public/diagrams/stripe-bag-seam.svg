<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
<title>Where the bag is seamed</title>
<desc>Two panels, right sides out. Sew the left side, the bottom, and the right side. Leave the top open. The back flap sticks up above the front and is not sewn down.</desc>
<rect width="640" height="420" fill="#fdfaf6"/>
<style>
  text { font-family: Georgia, "Times New Roman", serif; }
  .label { font-size: 22px; fill: #2f2a26; }
  .soft { font-size: 18px; fill: #6d635a; }
</style>
<rect x="16" y="16" width="608" height="388" rx="10" fill="#f6efe6" stroke="#e6ddd1"/>
<text class="label" x="32" y="50">Seam three sides. Leave the top open.</text>
<rect x="180" y="120" width="200" height="220" fill="#f4efe6" stroke="#c46a4a" stroke-width="8"/>
<rect x="180" y="80" width="200" height="50" fill="#f4efe6" stroke="#2f2a26" stroke-width="3" stroke-dasharray="6 4"/>
<text class="soft" x="280" y="110" text-anchor="middle">flap, not seamed</text>
<text class="soft" x="280" y="230" text-anchor="middle">front panel</text>
<text class="label" x="400" y="200">Sew left,</text>
<text class="label" x="400" y="228">bottom, and right.</text>
<text class="soft" x="32" y="370">Match the stripes before you sew. Do not close the opening.</text>
</svg>
