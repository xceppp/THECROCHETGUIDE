<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 470" role="img">
<title>Leave the lid free</title>
<desc>Side view showing lid clearance. The sleeve rim ends just below the lid seam, so the case lid is above the rim and still flips open. The flap folds over the top for carrying and folds back to open the lid. The case is removed to reach the charging port.</desc>
<rect width="480" height="470" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<circle cx="36" cy="36" r="20" fill="#b0604a"/><text x="36" y="44" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">5</text><text x="66" y="44" font-size="24" fill="#2f2a26" font-weight="bold">Leave the lid free</text><rect x="130" y="110" width="220" height="150" rx="18" fill="#241f1d"/><path d="M124 206 h232 v60 a18 18 0 0 1 -18 18 h-196 a18 18 0 0 1 -18 -18 Z" fill="#322d2a"/><line x1="130" y1="206" x2="350" y2="206" stroke="#fdfaf6" stroke-width="2"/><text x="360" y="212" font-size="20" fill="#6d635a">rim</text><path d="M130 110 q110 -60 220 0" fill="none" stroke="#9a9088" stroke-width="2" stroke-dasharray="5 5"/><text x="240" y="70" font-size="20" fill="#6d635a" text-anchor="middle">lid opens</text><line x1="240" y1="80" x2="240" y2="110" stroke="#9a9088" stroke-width="2" marker-start="url(#ah)"/><text x="20" y="320" font-size="20" fill="#6d635a">End the wall below the lid seam.</text><text x="20" y="346" font-size="20" fill="#6d635a">Flap folds over to carry, back to open.</text><text x="20" y="372" font-size="20" fill="#6d635a">Take the case out to charge.</text>
</svg>
