<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img">
<title>Make the pair mirror</title>
<desc>One wing is the flip of the other.</desc>
<rect width="480" height="300" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="240" y="36" font-size="22" fill="#2f2a26" text-anchor="middle" font-weight="bold">Make the pair mirror</text><polygon points="70,160 200,80 200,200" fill="#f6efe6" stroke="#2f2a26" stroke-width="3"/><polygon points="410,160 280,80 280,200" fill="#fdfaf6" stroke="#b0604a" stroke-width="3"/><text x="240" y="250" font-size="22" fill="#2f2a26" text-anchor="middle">one wing flipped</text>
</svg>
