<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 559" role="img">
<title>Joining two pieces with single crochet</title>
<desc>Two steps. 1: hold the pieces wrong sides together with the edges lined up stitch for stitch. 2: insert the hook through both layers at once, matching stitch to stitch, and work one sc in each pair; work 3 sc in a corner stitch to turn a corner flat.</desc>
<rect width="480" height="559" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<text x="20" y="44" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Joining two pieces with single</text>
<text x="20" y="74" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">crochet</text><rect x="12" y="92" width="456" height="231.5" rx="10" fill="#f6efe6" stroke="#e6ddd1"/><circle cx="38" cy="118" r="15" fill="#b0604a"/><text x="38" y="125" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="62" y="125" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Line up the edges</text><rect x="80" y="148.5" width="300" height="60" fill="#f6efe6" stroke="#6b4428" stroke-width="3"/><rect x="92" y="158.5" width="300" height="60" fill="none" stroke="#7d8b72" stroke-width="3" stroke-dasharray="6 4"/><text x="36" y="254.5" font-size="20" fill="#2f2a26" text-anchor="start">Wrong sides together. Match the</text>
<text x="36" y="279.5" font-size="20" fill="#2f2a26" text-anchor="start">stitches pair by pair, and count both</text>
<text x="36" y="304.5" font-size="20" fill="#2f2a26" text-anchor="start">edges first.</text><rect x="12" y="335.5" width="456" height="203.5" rx="10" fill="#f6efe6" stroke="#e6ddd1"/><circle cx="38" cy="361.5" r="15" fill="#b0604a"/><text x="38" y="368.5" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="62" y="368.5" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">One sc through both layers</text><path d="M80 426 H380" stroke="#6b4428" stroke-width="5"/><path d="M93 399L107 413M107 399L93 413" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M131 399L145 413M145 399L131 413" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M169 399L183 413M183 399L169 413" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M207 399L221 413M221 399L207 413" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M245 399L259 413M259 399L245 413" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M283 399L297 413M297 399L283 413" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M321 399L335 413M335 399L321 413" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M359 399L373 413M373 399L359 413" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><text x="36" y="470" font-size="20" fill="#2f2a26" text-anchor="start">Hook through both edge stitches at</text>
<text x="36" y="495" font-size="20" fill="#2f2a26" text-anchor="start">once, then sc. In a corner, 3 sc in the</text>
<text x="36" y="520" font-size="20" fill="#2f2a26" text-anchor="start">corner stitch keeps it flat.</text>
</svg>
