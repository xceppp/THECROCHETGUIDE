<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
<title>How to see the AirPods sleeve oval</title>
<desc>Three bases side by side. A gentle cup with round 2 groups of 6, 7, 6, and 7 is the worked example. A ruffled edge means increases left the ends. A twisted oval means the return side used the wrong chain loops.</desc>
<rect width="640" height="420" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="20" y="36" font-size="22" fill="#2f2a26" font-weight="bold">See the oval before the wall</text>
<rect x="16" y="52" width="196" height="300" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="114" y="82" font-size="18" fill="#2f2a26" text-anchor="middle" font-weight="bold">Gentle cup</text>
<ellipse cx="114" cy="168" rx="72" ry="46" fill="#fdfaf6" stroke="#2f2a26" stroke-width="3"/>
<text x="114" y="164" font-size="16" fill="#7d8b72" text-anchor="middle">6</text>
<text x="50" y="174" font-size="16" fill="#b0604a" text-anchor="middle">7</text>
<text x="178" y="174" font-size="16" fill="#b0604a" text-anchor="middle">7</text>
<text x="114" y="200" font-size="16" fill="#7d8b72" text-anchor="middle">6</text>
<text x="114" y="250" font-size="16" fill="#2f2a26" text-anchor="middle">One smooth dish.</text>
<text x="114" y="274" font-size="16" fill="#6d635a" text-anchor="middle">Ends 6 and 6.</text>
<text x="114" y="298" font-size="16" fill="#6d635a" text-anchor="middle">Sides 7 and 7.</text>
<text x="114" y="328" font-size="16" fill="#2f2a26" text-anchor="middle">Round 2 is 26.</text>
<rect x="222" y="52" width="196" height="300" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="320" y="82" font-size="18" fill="#2f2a26" text-anchor="middle" font-weight="bold">Ruffle</text>
<path d="M250 150 C270 120 290 190 310 150 C330 110 350 190 390 150 C390 210 250 230 250 150" fill="#fdfaf6" stroke="#b0604a" stroke-width="3"/>
<text x="320" y="270" font-size="16" fill="#2f2a26" text-anchor="middle">Waves on the sides.</text>
<text x="320" y="294" font-size="16" fill="#6d635a" text-anchor="middle">Increases left</text>
<text x="320" y="318" font-size="16" fill="#6d635a" text-anchor="middle">the two ends.</text>
<rect x="428" y="52" width="196" height="300" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="526" y="82" font-size="18" fill="#2f2a26" text-anchor="middle" font-weight="bold">Twist</text>
<ellipse cx="526" cy="168" rx="72" ry="46" fill="none" stroke="#2f2a26" stroke-width="3"/>
<path d="M470 140 C526 210 526 120 582 196" fill="none" stroke="#b0604a" stroke-width="3"/>
<text x="526" y="270" font-size="16" fill="#2f2a26" text-anchor="middle">The chain crosses.</text>
<text x="526" y="294" font-size="16" fill="#6d635a" text-anchor="middle">Return side used</text>
<text x="526" y="318" font-size="16" fill="#6d635a" text-anchor="middle">the wrong loops.</text>
<text x="20" y="388" font-size="16" fill="#6d635a">Worked example only: 6 + 7 + 6 + 7. A cup may stay. A ruffle or a twist comes out.</text>
</g>
</svg>
