<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 244" role="img">
<title>Ghost wallet: top of the head</title>
<desc>Nine single crochet across row 22. Do not reuse the corner stitch the slope already used.</desc>
<rect width="480" height="244" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="16" y="40" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Ghost wallet: top of the head</text>
<rect x="16" y="72" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="100" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Nine top stitches</text>
<text x="32" y="126" font-size="20" fill="#6d635a" text-anchor="start">The Vs of row 22, not the side.</text>
<rect x="16" y="150" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="178" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Count them before the turn</text>
<text x="32" y="204" font-size="20" fill="#6d635a" text-anchor="start">The side slope is a separate 5.</text>
</svg>
