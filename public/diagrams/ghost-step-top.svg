<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 244" role="img">
<title>Nine stitches across the top</title>
<desc>The narrow top is row 22. Do not reuse the corner stitch.</desc>
<rect width="480" height="244" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="240" y="40" font-size="22" fill="#2f2a26" text-anchor="middle" font-weight="bold">The narrow top</text>
<polygon points="150,180 330,180 300,80 180,80" fill="#f6efe6" stroke="#2f2a26" stroke-width="3"/>
<line x1="180" y1="80" x2="300" y2="80" stroke="#b0604a" stroke-width="6"/>
<text x="240" y="220" font-size="22" fill="#2f2a26" text-anchor="middle">9 stitches across</text>
</svg>
