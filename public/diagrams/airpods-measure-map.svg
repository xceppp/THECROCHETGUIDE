<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" role="img">
<title>Measure the case</title>
<desc>Front and side view of the AirPods Pro 2 charging case. Width 2.39 inches / 60.6 mm, height 1.78 inches / 45.2 mm, depth 0.85 inches / 21.7 mm. The lid seam runs across the upper third; the charging port is centered on the bottom.</desc>
<rect width="480" height="520" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<circle cx="36" cy="36" r="20" fill="#b0604a"/><text x="36" y="44" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="66" y="44" font-size="24" fill="#2f2a26" font-weight="bold">Measure the case</text><rect x="150" y="120" width="180" height="130" rx="20" fill="#322d2a"/><line x1="150" y1="154" x2="330" y2="154" stroke="#fdfaf6" stroke-width="3"/><circle cx="240" cy="240" r="7" fill="#d9731f"/><text x="240" y="106" font-size="20" fill="#6d635a" text-anchor="middle">Front</text><line x1="150" y1="276" x2="330" y2="276" stroke="#b0604a" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="240" y="300" font-size="20" fill="#2f2a26" text-anchor="middle" font-weight="bold">2.39 in / 60.6 mm</text><line x1="126" y1="120" x2="126" y2="250" stroke="#b0604a" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="116" y="185" font-size="20" fill="#2f2a26" text-anchor="middle" font-weight="bold" transform="rotate(-90 116 185)">1.78 in / 45.2 mm</text><rect x="370" y="120" width="46" height="130" rx="16" fill="#241f1d"/><text x="393" y="106" font-size="20" fill="#6d635a" text-anchor="middle">Side</text><line x1="370" y1="276" x2="416" y2="276" stroke="#b0604a" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="393" y="300" font-size="20" fill="#2f2a26" text-anchor="middle" font-weight="bold">0.85 in</text><text x="240" y="146" font-size="20" fill="#fdfaf6" text-anchor="middle">lid seam</text><text x="256" y="244" font-size="20" fill="#fdfaf6" text-anchor="start">port</text><text x="20" y="346" font-size="20" fill="#6d635a">Apple's own case size. The sleeve wraps</text><text x="20" y="372" font-size="20" fill="#6d635a">the footprint: width + depth, all sides.</text><text x="20" y="398" font-size="20" fill="#6d635a">Perimeter = 2 x (2.39 + 0.85) = 6.48 in.</text>
</svg>
