<rect class="bk" x="192" y="158" width="28" height="22"/>
<rect class="bk" x="108" y="136" width="28" height="22"/><rect class="bk" x="136" y="136" width="28" height="22"/><rect class="bk" x="164" y="136" width="28" height="22"/>
<rect class="bk" x="108" y="114" width="28" height="22"/><rect class="bk" x="136" y="114" width="28" height="22"/><rect class="bk" x="164" y="114" width="28" height="22"/>
<rect class="bk" x="136" y="92" width="28" height="22"/>
<rect class="bk" x="38" y="214" width="28" height="18"/><rect class="bk" x="66" y="214" width="28" height="18"/>
<rect class="bk" x="94" y="214" width="28" height="18"/><rect class="bk" x="122" y="214" width="28" height="18"/>
<rect class="bk" x="150" y="214" width="28" height="18"/><rect class="bk" x="178" y="214" width="28" height="18"/>
<rect class="bk" x="206" y="214" width="28" height="18"/><rect class="bk" x="234" y="214" width="28" height="18"/>
<text class="small" x="226" y="196">r1 orange (5)</text>
<text class="small" x="226" y="174">r2 (5)</text>
<text class="small" x="196" y="152">r3 (3)</text>
<text class="small" x="196" y="130">r4 (3)</text>
<text class="small" x="168" y="108">r5 (1)</text>
<text class="small" x="40" y="248">brim: ch 9, 8 sc</text>
<text class="soft" x="32" y="284">Cone: ch 6 in orange, sc in</text>
<text class="soft" x="32" y="304">2nd ch and across (5). Black</text>
<text class="soft" x="32" y="324">from the last yarn over. r3:</text>
<text class="soft" x="32" y="344">sc2tog, sc, sc2tog. r5: sc3tog.</text>
<text class="soft" x="32" y="372">About 1.25 in wide at the band,</text>
<text class="soft" x="32" y="392">1.2 in tall with the brim.</text>
<path d="M356 90 H611 V250 H596 V270 H371 V250 H356 Z" fill="url(#fl)" stroke="#4b3a5e" stroke-width="2"/>
<rect x="461" y="210" width="45" height="20" fill="#f6efe6"/>
<path d="M446 170 L483.5 92 L521 170 Z" fill="#2f2a26"/>
<rect x="446" y="170" width="75" height="20" fill="#d9731f"/>
<rect x="423.5" y="192" width="120" height="16" rx="4" fill="#2f2a26"/>
<text class="small" x="334" y="104">r25</text>
<text class="small" x="334" y="204">r30</text>
<text class="small" x="334" y="224">r31</text>
<text class="small" x="512" y="225" style="fill:#fdfaf6">buttonhole</text>
<text class="soft" x="344" y="306">Brim on row 30, centered on</text>
<text class="soft" x="344" y="326">st 9. Tip at row 25, the fold.</text>
<text class="soft" x="344" y="350">Sew all pieces on before the</text>
<text class="soft" x="344" y="370">side seams, through the flap</text>
<text class="soft" x="344" y="390">only. Keep clear of row 31.</text>
</svg>
