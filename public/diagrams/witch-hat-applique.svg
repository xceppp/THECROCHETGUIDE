<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 748" role="img">
<title>Witch hat wallet: miniature hat applique</title>
<desc>Cone: orange row of 5, then black 5, 3, 3, 1. Brim is 8 sc. Brim sits on row 30. Keep clear of the buttonhole on row 31.</desc>
<rect width="480" height="748" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="16" y="36" font-size="22" fill="#2f2a26">Cone: chain 6 in orange. Sc in the</text>
<text x="16" y="68" font-size="22" fill="#2f2a26">2nd chain and across. (5)</text>
<text x="16" y="132" font-size="22" fill="#2f2a26">Change to black on the last yarn</text>
<text x="16" y="164" font-size="22" fill="#2f2a26">over of row 1.</text>
<text x="16" y="228" font-size="22" fill="#2f2a26">Row 2: sc 5. Row 3: sc2tog, sc,</text>
<text x="16" y="260" font-size="22" fill="#2f2a26">sc2tog. (3)</text>
<text x="16" y="324" font-size="22" fill="#2f2a26">Row 4: sc 3. Row 5: sc3tog. (1)</text>
<text x="16" y="356" font-size="22" fill="#2f2a26">Fasten off.</text>
<text x="16" y="420" font-size="22" fill="#2f2a26">Brim: chain 9 in black, 8 sc. Fasten</text>
<text x="16" y="452" font-size="22" fill="#2f2a26">off.</text>
<text x="16" y="516" font-size="22" fill="#2f2a26">On the closed flap, center the brim</text>
<text x="16" y="548" font-size="22" fill="#2f2a26">on row 30 at stitch 9.</text>
<text x="16" y="612" font-size="22" fill="#2f2a26">The tip reaches row 25 at the fold.</text>
<text x="16" y="676" font-size="22" fill="#2f2a26">Sew through the flap only, before</text>
<text x="16" y="708" font-size="22" fill="#2f2a26">the side seams. Do not cover row 31.</text>
</g>
</svg>
