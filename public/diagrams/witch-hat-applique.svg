<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
<title>Witch hat wallet: miniature hat applique</title>
<desc>Left: the cone is 5 rows. Row 1 is 5 single crochet in orange, the hat band. Change to black on the last yarn over. Row 2 is 5, row 3 decreases at both ends to 3, row 4 is 3, row 5 is a three-together decrease to 1. The brim is a separate black strip of 8 single crochet. Right: placement on the flap. The cone's orange row sits on the brim, the brim lies on row 30 centered on stitch 9, and the tip reaches row 25 at the top fold. The buttonhole on row 31 sits just below the brim.</desc>
<rect width="640" height="420" fill="#fdfaf6"/>
<style>
  text { font-family: Georgia, "Times New Roman", serif; }
  .label { font-size: 20px; fill: #2f2a26; }
  .soft { font-size: 16px; fill: #6d635a; }
  .small { font-size: 13px; fill: #6d635a; }
  .panel { fill: #f6efe6; stroke: #e6ddd1; }
  .bk { fill: #2f2a26; stroke: #6d635a; stroke-width: 1; }
  .or { fill: #d9731f; stroke: #8f4a1a; stroke-width: 1; }
</style>
<defs>
  <pattern id="fl" x="356" y="90" width="15" height="20" patternUnits="userSpaceOnUse">
    <rect width="15" height="20" fill="#8a6aa8" stroke="#6e5289" stroke-width="1"/>
  </pattern>
</defs>
<rect class="panel" x="16" y="16" width="296" height="388" rx="10"/>
<rect class="panel" x="328" y="16" width="296" height="388" rx="10"/>
<text class="label" x="32" y="48">Cone and brim</text>
<text class="label" x="344" y="48">On the flap, closed</text>
<rect class="or" x="80" y="180" width="28" height="22"/><rect class="or" x="108" y="180" width="28" height="22"/>
<rect class="or" x="136" y="180" width="28" height="22"/><rect class="or" x="164" y="180" width="28" height="22"/>
<rect class="or" x="192" y="180" width="28" height="22"/>
