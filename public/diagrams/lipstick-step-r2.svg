<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img">
<title>Round 2: 12 stitches</title>
<desc>Two single crochet in every stitch.</desc>
<rect width="480" height="280" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="240" y="36" font-size="22" fill="#2f2a26" text-anchor="middle" font-weight="bold">Round 2: 12 stitches</text>
<circle cx="240" cy="145" r="70" fill="#f6efe6" stroke="#2f2a26" stroke-width="3"/>
<text x="240" y="150" font-size="22" fill="#2f2a26" text-anchor="middle">2 in each stitch</text>
<text x="240" y="250" font-size="22" fill="#2f2a26" text-anchor="middle">6 becomes 12</text>
</svg>
