"99.6" r="5" fill="#b0604a"/><circle cx="211.5" cy="89.8" r="5" fill="#b0604a"/><text x="240" y="219" font-size="26" fill="#2f2a26" text-anchor="middle" font-weight="bold">27</text><text x="20" y="374" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Round 5: (sc 7, 2 sc in next) 3</text>
<text x="20" y="401.5" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">times (27)</text><text x="20" y="439" font-size="20" fill="#6d635a" text-anchor="start">Terracotta dots: the 2 stitches made by</text>
<text x="20" y="464" font-size="20" fill="#6d635a" text-anchor="start">each increase.</text><text x="20" y="495" font-size="20" fill="#6d635a" text-anchor="start">Rounds 1 to 4 add 6 each. Round 5 adds 3,</text>
<text x="20" y="520" font-size="20" fill="#6d635a" text-anchor="start">for the 27 the case needs.</text>
</svg>
