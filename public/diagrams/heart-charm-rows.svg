<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
<title>Tiny heart charm: rows and lobes</title>
<desc>A heart worked from the point up. Rows 1 to 5 grow 1, 2, 4, 6, 8 stitches. Row 6 is 8 stitches even. Then the top splits: each lobe uses 4 of the 8 stitches, worked as 4 then 2. An optional single crochet edging smooths the outline, with 3 sc at the bottom point and a slip stitch in the dip between lobes. The hanging chain is sewn on the back between the lobes.</desc>
<rect width="640" height="420" fill="#fdfaf6"/>
<style>
  text { font-family: Georgia, "Times New Roman", serif; }
  .label { font-size: 20px; fill: #2f2a26; }
  .soft { font-size: 16px; fill: #6d635a; }
  .row { fill: #f3e6d4; stroke: #6b4428; stroke-width: 1.5; }
  .lobe { fill: #f6efe6; stroke: #b0604a; stroke-width: 2; }
  .edge { fill: none; stroke: #7d8b72; stroke-width: 2.5; stroke-dasharray: 6 4; }
</style>
<rect x="16" y="16" width="608" height="388" rx="10" fill="#f6efe6" stroke="#e6ddd1"/>
<text class="label" x="32" y="46">Grow from the point, then split</text>
<rect class="row" x="180" y="330" width="20" height="20"/>
<rect class="row" x="170" y="310" width="40" height="20"/>
<rect class="row" x="150" y="290" width="80" height="20"/>
<rect class="row" x="130" y="270" width="120" height="20"/>
<rect class="row" x="110" y="250" width="160" height="20"/>
<rect class="row" x="110" y="230" width="160" height="20"/>
<rect class="lobe" x="110" y="210" width="80" height="20"/>
<rect class="lobe" x="130" y="190" width="40" height="20"/>
<rect class="lobe" x="190" y="210" width="80" height="20"/>
<rect class="lobe" x="210" y="190" width="40" height="20"/>
<path class="edge" d="M190 364 L100 250 C90 200 120 176 150 180 C170 182 186 196 190 212 C194 196 210 182 230 180 C260 176 290 200 280 250 Z"/>
<text class="soft" x="320" y="350">Rows 1-5: 1, 2, 4, 6, 8</text>
<text class="soft" x="320" y="246">Row 6: 8 even</text>
<text class="soft" x="320" y="200">Each lobe: 4, then 2</text>
<text class="soft" x="320" y="120">Optional edging (dashed):</text>
<text class="soft" x="320" y="142">3 sc at the point,</text>
<text class="soft" x="320" y="164">sl st in the dip</text>
<text class="soft" x="32" y="390">Width is 8 stitches: about 2 in in worsted. Smaller yarn, smaller heart.</text>
</svg>
