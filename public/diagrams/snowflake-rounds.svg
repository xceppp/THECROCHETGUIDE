<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
<title>Snowflake in three rounds</title>
<desc>Round 1: 12 double crochet in a ring. Round 2: chain 5, skip 1, single crochet in the next, six times, making 6 loops. Every loop uses 2 of the 12 stitches. Round 3: in each loop, 3 single crochet, a chain-3 picot, 3 single crochet, making 6 points. A count that is a multiple of 6 gives six arms.</desc>
<rect width="640" height="420" fill="#fdfaf6"/>
<style>
  text { font-family: Georgia, "Times New Roman", serif; }
  .label { font-size: 20px; fill: #2f2a26; }
  .soft { font-size: 16px; fill: #6d635a; }
  .ring { fill: #f3e6d4; stroke: #6b4428; stroke-width: 2.5; }
  .loop { fill: none; stroke: #7d8b72; stroke-width: 3; }
  .pic { fill: none; stroke: #b0604a; stroke-width: 2.5; }
</style>
<rect x="16" y="16" width="608" height="388" rx="10" fill="#f6efe6" stroke="#e6ddd1"/>
<text class="label" x="32" y="46">Twelve, six, six</text>
<g transform="translate(200 220)">
<circle class="ring" r="40"/>
<circle r="14" fill="#f6efe6" stroke="#6b4428" stroke-width="2"/>
<g id="arm">
<path class="loop" d="M-12 -38 C-30 -110 30 -110 12 -38"/>
<circle class="pic" cx="0" cy="-104" r="8"/>
</g>
<use href="#arm" transform="rotate(60)"/>
<use href="#arm" transform="rotate(120)"/>
<use href="#arm" transform="rotate(180)"/>
<use href="#arm" transform="rotate(240)"/>
<use href="#arm" transform="rotate(300)"/>
</g>
<text class="soft" x="360" y="110">Round 1: 12 dc in a ring</text>
<text class="soft" x="360" y="132">(ch 3 counts as the first)</text>
<text class="soft" x="360" y="180">Round 2: (ch 5, skip 1,</text>
<text class="soft" x="360" y="202">sc in next) 6 times</text>
<text class="soft" x="360" y="224">12 / 2 = 6 loops</text>
<text class="soft" x="360" y="272">Round 3: in each loop</text>
<text class="soft" x="360" y="294">3 sc, picot, 3 sc</text>
<text class="soft" x="360" y="316">6 points</text>
<text class="soft" x="32" y="384">Five loops is a flower. Six reads as a snowflake.</text>
</svg>
