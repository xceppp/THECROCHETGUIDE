<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 711" role="img">
<title>Round 1: turning onto the chain's underside</title>
<desc>The slip-knot end of the chain of 17, with single crochet on top and underneath. Correct: the last single crochet on top and the first one underneath go into the same chain, the one next to the slip knot, giving 16 on each side and 32 in the round. Common mistake: the first underside stitch goes into the next chain instead, leaving 15 underneath and 31 in the round. Working the skipped chain next to the hook gives the opposite error, 33.</desc>
<rect width="480" height="711" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<text x="20" y="44" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Round 1: turning onto the</text>
<text x="20" y="74" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">chain's underside</text><rect x="12" y="94" width="456" height="278" rx="10" fill="#f1f3ed" stroke="#7d8b72" stroke-width="2"/><text x="32" y="126" font-size="20" font-weight="bold" fill="#7d8b72">CORRECT: 16 + 16 = 32</text><circle cx="134" cy="216" r="8" fill="#6b4428"/><text x="58" y="223" font-size="20" fill="#6d635a">knot</text><ellipse cx="170" cy="216" rx="17" ry="7" fill="none" stroke="#b0604a" stroke-width="4"/><path d="M161 171L179 189M179 171L161 189" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M161 243L179 261M179 243L161 261" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><ellipse cx="218" cy="216" rx="17" ry="7" fill="none" stroke="#6b4428" stroke-width="4"/><path d="M209 171L227 189M227 171L209 189" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M209 243L227 261M227 243L209 261" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><ellipse cx="266" cy="216" rx="17" ry="7" fill="none" stroke="#6b4428" stroke-width="4"/><path d="M257 171L275 189M275 171L257 189" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M257 243L275 261M275 243L257 261" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><ellipse cx="314" cy="216" rx="17" ry="7" fill="none" stroke="#6b4428" stroke-width="4"/><path d="M305 171L323 189M323 171L305 189" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M305 243L323 261M323 243L305 261" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><ellipse cx="362" cy="216" rx="17" ry="7" fill="none" stroke="#6b4428" stroke-width="4"/><path d="M353 171L371 189M371 171L353 189" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M353 243L371 261M371 243L353 261" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><ellipse cx="410" cy="216" rx="17" ry="7" fill="none" stroke="#6b4428" stroke-width="4"/><path d="M401 171L419 189M419 171L401 189" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M401 243L419 261M419 243L401 261" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><text x="448" y="222" font-size="20" fill="#6d635a">…</text><path d="M156 176 C110 186 110 246 156 256" fill="none" stroke="#b0604a" stroke-width="3" marker-end="url(#ah)"/><text x="40" y="150" font-size="20" fill="#6d635a">top: 16 sc</text><text x="40" y="292" font-size="20" fill="#6d635a">underside: 16 sc</text><text x="36" y="326" font-size="20" fill="#2f2a26" text-anchor="start">The chain next to the knot gets two sc,</text>
<text x="36" y="351" font-size="20" fill="#2f2a26" text-anchor="start">one on top and one underneath.</text><rect x="12" y="386" width="456" height="303" rx="10" fill="#f8ebe5" stroke="#b0604a" stroke-width="2"/><text x="32" y="418" font-size="20" font-weight="bold" fill="#b0604a">COMMON MISTAKE: 16 + 15 = 31</text><circle cx="134" cy="508" r="8" fill="#6b4428"/><text x="58" y="515" font-size="20" fill="#6d635a">knot</text><ellipse cx="170" cy="508" rx="17" ry="7" fill="none" stroke="#b0604a" stroke-width="4"/><path d="M161 463L179 481M179 463L161 481" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><circle cx="170" cy="544" r="9" fill="none" stroke="#b0604a" stroke-width="3" stroke-dasharray="4 3"/><ellipse cx="218" cy="508" rx="17" ry="7" fill="none" stroke="#6b4428" stroke-width="4"/><path d="M209 463L227 481M227 463L209 481" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M209 535L227 553M227 535L209 553" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><ellipse cx="266" cy="508" rx="17" ry="7" fill="none" stroke="#6b4428" stroke-width="4"/><path d="M257 463L275 481M275 463L257 481" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M257 535L275 553M275 535L257 553" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><ellipse cx="314" cy="508" rx="17" ry="7" fill="none" stroke="#6b4428" stroke-width="4"/><path d="M305 463L323 481M323 463L305 481" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M305 535L323 553M323 535L305 553" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><ellipse cx="362" cy="508" rx="17" ry="7" fill="none" stroke="#6b4428" stroke-width="4"/><path d="M353 463L371 481M371 463L353 481" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M353 535L371 553M371 535L353 553" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><ellipse cx="410" cy="508" rx="17" ry="7" fill="none" stroke="#6b4428" stroke-width="4"/><path d="M401 463L419 481M419 463L401 481" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M401 535L419 553M419 535L401 553" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><text x="448" y="514" font-size="20" fill="#6d635a">…</text><path d="M156 468 C110 478 110 538 204 548" fill="none" stroke="#b0604a" stroke-width="3" marker-end="url(#ah)"/><text x="40" y="442" font-size="20" fill="#6d635a">top: 16 sc</text><text x="40" y="584" font-size="20" fill="#6d635a">underside: 15 sc</text><text x="36" y="618" font-size="20" fill="#2f2a26" text-anchor="start">Skipping that chain after the turn</text>
<text x="36" y="643" font-size="20" fill="#2f2a26" text-anchor="start">loses a stitch. Working the chain next</text>
<text x="36" y="668" font-size="20" fill="#2f2a26" text-anchor="start">to the hook adds one, for 33.</text>
</svg>
