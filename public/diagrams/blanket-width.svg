<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
<title>Two gauges for a 30 inch blanket</title>
<desc>At 3 half double crochet per inch, 30 inches is 90 stitches and the chain is 92. At 3.5 per inch, 30 inches is 105 stitches and the chain is 107.</desc>
<rect width="640" height="420" fill="#fdfaf6"/>
<style>
  text { font-family: Georgia, "Times New Roman", serif; }
  .label { font-size: 22px; fill: #2f2a26; }
  .soft { font-size: 18px; fill: #6d635a; }
</style>
<rect x="16" y="16" width="608" height="388" rx="10" fill="#f6efe6" stroke="#e6ddd1"/>
<text class="label" x="32" y="52">30 inch width, two swatches</text>
<text class="soft" x="32" y="110">3 hdc per inch</text>
<text class="label" x="32" y="146">30 x 3 = 90 stitches. Chain 92.</text>
<text class="soft" x="32" y="200">3.5 hdc per inch (14 in 4 inches)</text>
<text class="label" x="32" y="236">14 / 4 = 3.5. Then 30 x 3.5 = 105.</text>
<text class="label" x="32" y="272">Chain 107.</text>
<text class="soft" x="32" y="330">Use the count from the washed swatch.</text>
<text class="soft" x="32" y="364">90 is only the first case. Rows use a</text>
<text class="soft" x="32" y="392">separate rows-per-inch measure.</text>
</svg>
