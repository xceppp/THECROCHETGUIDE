<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 639" role="img">
<title>Granny square round 1</title>
<desc>Granny square round 1. Four clusters of three double crochet worked into the ring, 12 double crochet in all, with a chain-2 corner between each pair. There are no side spaces yet.</desc>
<rect width="480" height="639" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<circle cx="36" cy="36" r="20" fill="#b0604a"/><text x="36" y="44" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="66" y="44" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Granny round 1: corners and</text>
<text x="66" y="74" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">sides</text><rect x="90" y="112" width="300" height="300" fill="#f6efe6" stroke="#c9bfb3" stroke-dasharray="5 4"/><g transform="rotate(0 240 112)"><path d="M231 122 V102 M227 102 h8" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M240 122 V102 M236 102 h8" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M249 122 V102 M245 102 h8" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/></g><g transform="rotate(90 390 262)"><path d="M381 272 V252 M377 252 h8" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M390 272 V252 M386 252 h8" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M399 272 V252 M395 252 h8" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/></g><g transform="rotate(180 240 412)"><path d="M231 422 V402 M227 402 h8" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M240 422 V402 M236 402 h8" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M249 422 V402 M245 402 h8" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/></g><g transform="rotate(270 90 262)"><path d="M81 272 V252 M77 252 h8" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M90 272 V252 M86 252 h8" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M99 272 V252 M95 252 h8" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/></g><circle cx="90" cy="112" r="10" fill="#fdfaf6" stroke="#b0604a" stroke-width="4"/><circle cx="390" cy="112" r="10" fill="#fdfaf6" stroke="#b0604a" stroke-width="4"/><circle cx="390" cy="412" r="10" fill="#fdfaf6" stroke="#b0604a" stroke-width="4"/><circle cx="90" cy="412" r="10" fill="#fdfaf6" stroke="#b0604a" stroke-width="4"/><text x="20" y="448" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Each side: 1 cluster of 3 dc. Round</text>
<text x="20" y="475.5" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">total: 12 dc.</text><text x="20" y="509" font-size="20" fill="#8f4a37" text-anchor="start">Terracotta rings: the 4 ch-2 corners, made</text>
<text x="20" y="534" font-size="20" fill="#8f4a37" text-anchor="start">between the clusters.</text><text x="20" y="565" font-size="20" fill="#7d8b72" text-anchor="start">Round 1 has no side spaces: one cluster</text>
<text x="20" y="590" font-size="20" fill="#7d8b72" text-anchor="start">per side, all worked into the ring.</text>
</svg>
