<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 684" role="img">
<title>Halloween card wallet: three zones</title>
<desc>One rectangle, 16 sc wide. Front rows 1-12, back 13-24, flap 25-31. Row 31 holds the loop.</desc>
<rect width="480" height="684" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="16" y="36" font-size="22" fill="#2f2a26">Chain 17. Row 1 is 16 sc. Ch 1 does</text>
<text x="16" y="68" font-size="22" fill="#2f2a26">not count.</text>
<text x="16" y="132" font-size="22" fill="#2f2a26">Rows 1-12: front. Fold these up.</text>
<text x="16" y="164" font-size="22" fill="#2f2a26">About 2.4 in at 5 rows per inch.</text>
<text x="16" y="228" font-size="22" fill="#2f2a26">Rows 13-24: back. The foundation</text>
<text x="16" y="260" font-size="22" fill="#2f2a26">edge meets row 24.</text>
<text x="16" y="324" font-size="22" fill="#2f2a26">Rows 25-31: flap. Leave it outside</text>
<text x="16" y="356" font-size="22" fill="#2f2a26">the side seams.</text>
<text x="16" y="420" font-size="22" fill="#2f2a26">Row 31: sc 6, chain 4, skip 4, sc 6.</text>
<text x="16" y="484" font-size="22" fill="#2f2a26">6 + 4 skipped + 6 = 16, so the loop</text>
<text x="16" y="516" font-size="22" fill="#2f2a26">stays centered.</text>
<text x="16" y="580" font-size="22" fill="#2f2a26">Test the button before you fasten</text>
<text x="16" y="612" font-size="22" fill="#2f2a26">off. Sew it through the front wall</text>
<text x="16" y="644" font-size="22" fill="#2f2a26">only.</text>
</g>
</svg>
