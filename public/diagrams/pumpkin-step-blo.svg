<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 322" role="img">
<title>Pumpkin wallet: back loop only</title>
<desc>After row 1, every row is worked under the back loop. The front loop stays on the surface and makes the rib.</desc>
<rect width="480" height="322" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="16" y="40" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Pumpkin wallet: back loop only</text>
<rect x="16" y="72" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="100" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">See the two strands of the V</text>
<text x="32" y="126" font-size="20" fill="#6d635a" text-anchor="start">The near strand is the front loop.</text>
<rect x="16" y="150" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="178" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Hook under the far strand only</text>
<text x="32" y="204" font-size="20" fill="#6d635a" text-anchor="start">That is the back loop.</text>
<rect x="16" y="228" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="256" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Count 20 every row</text>
<text x="32" y="282" font-size="20" fill="#6d635a" text-anchor="start">Stop at 4.25 inches on an even row.</text>
</svg>
