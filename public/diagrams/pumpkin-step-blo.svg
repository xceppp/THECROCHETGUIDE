<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 322" role="img">
<title>Back loop only makes the ribs</title>
<desc>After row 1, each row is worked in the back loop so the front loop shows as a rib.</desc>
<rect width="480" height="322" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="240" y="40" font-size="22" fill="#2f2a26" text-anchor="middle" font-weight="bold">Back loop only</text>
<rect x="150" y="70" width="180" height="200" fill="#f6efe6" stroke="#2f2a26" stroke-width="3"/>
<line x1="178" y1="70" x2="178" y2="270" stroke="#b0604a" stroke-width="4"/><line x1="210" y1="70" x2="210" y2="270" stroke="#b0604a" stroke-width="4"/><line x1="242" y1="70" x2="242" y2="270" stroke="#b0604a" stroke-width="4"/><line x1="274" y1="70" x2="274" y2="270" stroke="#b0604a" stroke-width="4"/><line x1="306" y1="70" x2="306" y2="270" stroke="#b0604a" stroke-width="4"/>
<text x="240" y="300" font-size="22" fill="#2f2a26" text-anchor="middle">ribs run with the rows</text>
</svg>
