<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 684" role="img">
<title>Five Halloween crochet wallets, five constructions</title>
<desc>Cat is a tube. Ghost is two panels. Pumpkin is sideways ribbing. Witch hat has a divider. Spiderweb has a pointed flap.</desc>
<rect width="480" height="684" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="16" y="36" font-size="22" fill="#2f2a26">Black cat: a tube from both sides of</text>
<text x="16" y="68" font-size="22" fill="#2f2a26">a chain. Snap. No side seams.</text>
<text x="16" y="132" font-size="22" fill="#2f2a26">Ghost: two shaped panels and one</text>
<text x="16" y="164" font-size="22" fill="#2f2a26">edging round. Snap. Scalloped hem.</text>
<text x="16" y="228" font-size="22" fill="#2f2a26">Pumpkin: sideways back-loop ribs,</text>
<text x="16" y="260" font-size="22" fill="#2f2a26">folded once. Leaf tab and snap.</text>
<text x="16" y="324" font-size="22" fill="#2f2a26">Witch hat: one rectangle in three</text>
<text x="16" y="356" font-size="22" fill="#2f2a26">zones, an inner divider, and a</text>
<text x="16" y="388" font-size="22" fill="#2f2a26">buttonhole.</text>
<text x="16" y="452" font-size="22" fill="#2f2a26">Spiderweb: one rectangle, a pointed</text>
<text x="16" y="484" font-size="22" fill="#2f2a26">flap, an embroidered web, and a</text>
<text x="16" y="516" font-size="22" fill="#2f2a26">loop.</text>
<text x="16" y="580" font-size="22" fill="#2f2a26">Each pattern is a separate page.</text>
<text x="16" y="612" font-size="22" fill="#2f2a26">Counts do not carry from one wallet</text>
<text x="16" y="644" font-size="22" fill="#2f2a26">to another.</text>
</g>
</svg>
