<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 679" role="img">
<title>Flat circle: stagger the increases</title>
<desc>Correct: the increase in each round is moved, for example by working half the plain stitches before the first increase on alternate rounds, so the edge stays round. Mistake: every increase lands directly above the last one, which builds six corners and the circle becomes a hexagon.</desc>
<rect width="480" height="679" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<text x="20" y="44" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Flat circle: stagger the</text>
<text x="20" y="74" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">increases</text><rect x="12" y="94" width="456" height="287" rx="10" fill="#f1f3ed" stroke="#7d8b72" stroke-width="2"/><text x="32" y="126" font-size="20" font-weight="bold" fill="#7d8b72">CORRECT: round</text><circle cx="240" cy="210" r="64" fill="#f6efe6" stroke="#6b4428" stroke-width="3"/><circle cx="240.0" cy="190.0" r="4.5" fill="#b0604a"/><circle cx="257.3" cy="200.0" r="4.5" fill="#b0604a"/><circle cx="257.3" cy="220.0" r="4.5" fill="#b0604a"/><circle cx="240.0" cy="230.0" r="4.5" fill="#b0604a"/><circle cx="222.7" cy="220.0" r="4.5" fill="#b0604a"/><circle cx="222.7" cy="200.0" r="4.5" fill="#b0604a"/><circle cx="260.0" cy="175.4" r="4.5" fill="#b0604a"/><circle cx="280.0" cy="210.0" r="4.5" fill="#b0604a"/><circle cx="260.0" cy="244.6" r="4.5" fill="#b0604a"/><circle cx="220.0" cy="244.6" r="4.5" fill="#b0604a"/><circle cx="200.0" cy="210.0" r="4.5" fill="#b0604a"/><circle cx="220.0" cy="175.4" r="4.5" fill="#b0604a"/><circle cx="240.0" cy="150.0" r="4.5" fill="#b0604a"/><circle cx="292.0" cy="180.0" r="4.5" fill="#b0604a"/><circle cx="292.0" cy="240.0" r="4.5" fill="#b0604a"/><circle cx="240.0" cy="270.0" r="4.5" fill="#b0604a"/><circle cx="188.0" cy="240.0" r="4.5" fill="#b0604a"/><circle cx="188.0" cy="180.0" r="4.5" fill="#b0604a"/><text x="36" y="310" font-size="20" fill="#2f2a26" text-anchor="start">Increases (dots) shift position every</text>
<text x="36" y="335" font-size="20" fill="#2f2a26" text-anchor="start">other round, so the edge stays a</text>
<text x="36" y="360" font-size="20" fill="#2f2a26" text-anchor="start">circle.</text><rect x="12" y="395" width="456" height="262" rx="10" fill="#f8ebe5" stroke="#b0604a" stroke-width="2"/><text x="32" y="427" font-size="20" font-weight="bold" fill="#b0604a">COMMON MISTAKE: hexagon</text><polygon points="240.0,441.0 300.6,476.0 300.6,546.0 240.0,581.0 179.4,546.0 179.4,476.0" fill="#f6efe6" stroke="#6b4428" stroke-width="3"/><circle cx="240.0" cy="491.0" r="4.5" fill="#b0604a"/><circle cx="257.3" cy="501.0" r="4.5" fill="#b0604a"/><circle cx="257.3" cy="521.0" r="4.5" fill="#b0604a"/><circle cx="240.0" cy="531.0" r="4.5" fill="#b0604a"/><circle cx="222.7" cy="521.0" r="4.5" fill="#b0604a"/><circle cx="222.7" cy="501.0" r="4.5" fill="#b0604a"/><circle cx="240.0" cy="471.0" r="4.5" fill="#b0604a"/><circle cx="274.6" cy="491.0" r="4.5" fill="#b0604a"/><circle cx="274.6" cy="531.0" r="4.5" fill="#b0604a"/><circle cx="240.0" cy="551.0" r="4.5" fill="#b0604a"/><circle cx="205.4" cy="531.0" r="4.5" fill="#b0604a"/><circle cx="205.4" cy="491.0" r="4.5" fill="#b0604a"/><circle cx="240.0" cy="451.0" r="4.5" fill="#b0604a"/><circle cx="292.0" cy="481.0" r="4.5" fill="#b0604a"/><circle cx="292.0" cy="541.0" r="4.5" fill="#b0604a"/><circle cx="240.0" cy="571.0" r="4.5" fill="#b0604a"/><circle cx="188.0" cy="541.0" r="4.5" fill="#b0604a"/><circle cx="188.0" cy="481.0" r="4.5" fill="#b0604a"/><text x="36" y="611" font-size="20" fill="#2f2a26" text-anchor="start">Increases stacked in the same six</text>
<text x="36" y="636" font-size="20" fill="#2f2a26" text-anchor="start">places push out six corners.</text>
</svg>
