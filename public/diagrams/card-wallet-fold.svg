<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 577" role="img">
<title>Measure flat, then fold 12 rows up</title>
<desc>Drawn to scale. A flat piece 16 sc, about 4 in wide and 31 rows, 6.2 in tall, folded at the dashed line into a pocket with the flap above. Whipstitch both sides from the fold to the opening. Stop there. Front: rows 1 to 12. Back: rows 13 to 24. Flap: rows 25 to 31, about 1.4 in. The width includes about 0.25 in for the seams.</desc>
<rect width="480" height="577" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<circle cx="36" cy="36" r="20" fill="#b0604a"/><text x="36" y="44" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">4</text><text x="66" y="44" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Measure flat, then fold 12</text>
<text x="66" y="74" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">rows up</text><rect x="100" y="108" width="130" height="201.5" fill="#f6efe6" stroke="#6b4428" stroke-width="3"/><line x1="90" y1="231.5" x2="240" y2="231.5" stroke="#b0604a" stroke-width="3" stroke-dasharray="9 6"/><text x="244" y="238.5" font-size="20" fill="#8f4a37">fold</text><line x1="100" y1="153.5" x2="230" y2="153.5" stroke="#7d8b72" stroke-width="2" stroke-dasharray="4 4"/><text x="244" y="160.5" font-size="20" fill="#7d8b72">flap</text><path d="M82 108 V309.5" stroke="#2f2a26" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/><rect x="320" y="186" width="130" height="123.50000000000001" fill="#efe2d4" stroke="#6b4428" stroke-width="2"/><rect x="320" y="231.5" width="130" height="78" fill="#f6efe6" stroke="#6b4428" stroke-width="3"/><path d="M320 186 h130 v45.5 q-65 14 -130 0 z" fill="#e9d6c3" stroke="#6b4428" stroke-width="2"/><line x1="313" y1="243.5" x2="327" y2="235.5" stroke="#b0604a" stroke-width="3"/><line x1="313" y1="264.1666666666667" x2="327" y2="256.1666666666667" stroke="#b0604a" stroke-width="3"/><line x1="313" y1="284.8333333333333" x2="327" y2="276.8333333333333" stroke="#b0604a" stroke-width="3"/><line x1="313" y1="305.5" x2="327" y2="297.5" stroke="#b0604a" stroke-width="3"/><line x1="443" y1="243.5" x2="457" y2="235.5" stroke="#b0604a" stroke-width="3"/><line x1="443" y1="264.1666666666667" x2="457" y2="256.1666666666667" stroke="#b0604a" stroke-width="3"/><line x1="443" y1="284.8333333333333" x2="457" y2="276.8333333333333" stroke="#b0604a" stroke-width="3"/><line x1="443" y1="305.5" x2="457" y2="297.5" stroke="#b0604a" stroke-width="3"/><path d="M254 238.75 H304" stroke="#b0604a" stroke-width="3" marker-end="url(#ah)"/><text x="385" y="335.5" font-size="20" fill="#8f4a37" text-anchor="middle">fold</text><text x="20" y="363.5" font-size="20" fill="#2f2a26">Flat: 16 sc, about 4 in wide, 31 rows, 6.2 in tall</text><text x="20" y="399.5" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Whipstitch both sides from the fold</text>
