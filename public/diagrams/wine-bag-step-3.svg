<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 541" role="img">
<title>The whole bag by stitch count</title>
<desc>The whole bag by stitch count, as bars sized by stitch count. Round 1: 6, Round 2: 12, Round 3: 18, Round 4: 24, Round 5: 30, Round 6: 36, Round 7: 40, Rounds 8 to 52: 40, Round 53: 20+20, Round 54: 40, Round 55: 40. R53 to R55 are the pattern's eyelet round (20 sc and 20 chain spaces), next round, and last round.</desc>
<rect width="480" height="541" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<circle cx="36" cy="36" r="20" fill="#b0604a"/><text x="36" y="44" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">3</text><text x="66" y="44" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">The whole bag by stitch</text>
<text x="66" y="74" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">count</text><rect x="277.5" y="99" width="45" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="119" font-size="20" fill="#6d635a">R1</text><text x="140" y="119" font-size="20" fill="#2f2a26" text-anchor="end">6</text><rect x="255" y="129" width="90" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="149" font-size="20" fill="#6d635a">R2</text><text x="140" y="149" font-size="20" fill="#2f2a26" text-anchor="end">12</text><rect x="232.5" y="159" width="135" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="179" font-size="20" fill="#6d635a">R3</text><text x="140" y="179" font-size="20" fill="#2f2a26" text-anchor="end">18</text><rect x="210" y="189" width="180" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="209" font-size="20" fill="#6d635a">R4</text><text x="140" y="209" font-size="20" fill="#2f2a26" text-anchor="end">24</text><rect x="187.5" y="219" width="225" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="239" font-size="20" fill="#6d635a">R5</text><text x="140" y="239" font-size="20" fill="#2f2a26" text-anchor="end">30</text><rect x="165" y="249" width="270" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="269" font-size="20" fill="#6d635a">R6</text><text x="140" y="269" font-size="20" fill="#2f2a26" text-anchor="end">36</text><rect x="150" y="279" width="300" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="299" font-size="20" fill="#6d635a">R7</text><text x="140" y="299" font-size="20" fill="#2f2a26" text-anchor="end">40</text><rect x="150" y="309" width="300" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="329" font-size="20" fill="#6d635a">R8–52</text><text x="140" y="329" font-size="20" fill="#2f2a26" text-anchor="end">40</text><rect x="150" y="339" width="300" height="24" rx="4" fill="#b0604a" stroke="#8f4a37"/><text x="20" y="359" font-size="20" fill="#6d635a">R53</text><text x="140" y="359" font-size="20" fill="#2f2a26" text-anchor="end">20+20</text><rect x="150" y="369" width="300" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="389" font-size="20" fill="#6d635a">R54</text><text x="140" y="389" font-size="20" fill="#2f2a26" text-anchor="end">40</text><rect x="150" y="399" width="300" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="419" font-size="20" fill="#6d635a">R55</text><text x="140" y="419" font-size="20" fill="#2f2a26" text-anchor="end">40</text><text x="20" y="450" font-size="20" fill="#6d635a" text-anchor="start">R53 to R55 are the pattern's eyelet round</text>
<text x="20" y="475" font-size="20" fill="#6d635a" text-anchor="start">(20 sc and 20 chain spaces), next round,</text>
<text x="20" y="500" font-size="20" fill="#6d635a" text-anchor="start">and last round.</text>
</svg>
