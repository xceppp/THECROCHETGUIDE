<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 421" role="img">
<title>Flap: 6 rows over 9 stitches</title>
<desc>A flap of 6 rows worked over 9 of the 27 stitches on the last round, with a chain loop on the top row. Rows 1 to 5: 9 sc, ch 1 and turn. Row 6: sc 3, ch 4, skip 3, sc 3. The other 18 stitches stay open.</desc>
