<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
<title>How to see lid clearance on the AirPods sleeve</title>
<desc>Two side views. On the left the sleeve rim stops below the lid seam so the lid can open. On the right the rim covers the seam. Wall rounds stay at 26 single crochet with no increases.</desc>
<rect width="640" height="420" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="20" y="36" font-size="22" fill="#2f2a26" font-weight="bold">See the rim against the lid seam</text>
<rect x="16" y="56" width="296" height="300" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="164" y="86" font-size="18" fill="#2f2a26" text-anchor="middle" font-weight="bold">Clear</text>
<rect x="70" y="110" width="160" height="180" rx="12" fill="#fdfaf6" stroke="#2f2a26" stroke-width="3"/>
<line x1="70" y1="168" x2="230" y2="168" stroke="#b0604a" stroke-width="3"/>
<text x="240" y="172" font-size="16" fill="#b0604a">seam</text>
<line x1="78" y1="196" x2="222" y2="196" stroke="#7d8b72" stroke-width="4"/>
<text x="164" y="230" font-size="16" fill="#7d8b72" text-anchor="middle">rim below seam</text>
<text x="164" y="320" font-size="16" fill="#2f2a26" text-anchor="middle">Lid sits above the fabric.</text>
<rect x="328" y="56" width="296" height="300" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="476" y="86" font-size="18" fill="#2f2a26" text-anchor="middle" font-weight="bold">Covered</text>
<rect x="382" y="110" width="160" height="180" rx="12" fill="#fdfaf6" stroke="#2f2a26" stroke-width="3"/>
<line x1="382" y1="200" x2="542" y2="200" stroke="#b0604a" stroke-width="3"/>
<text x="476" y="188" font-size="16" fill="#b0604a" text-anchor="middle">seam under rim</text>
<rect x="390" y="110" width="144" height="100" fill="#7d8b72" opacity="0.35"/>
<text x="476" y="250" font-size="16" fill="#2f2a26" text-anchor="middle">Fabric hides the seam.</text>
<text x="476" y="320" font-size="16" fill="#2f2a26" text-anchor="middle">Lid cannot swing.</text>
<text x="20" y="388" font-size="16" fill="#6d635a">Even rounds stay 26 single crochet. Stop when your own seam clears, not at a fixed round.</text>
</g>
</svg>
