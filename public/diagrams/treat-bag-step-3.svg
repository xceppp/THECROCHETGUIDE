<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 608" role="img">
<title>The bag by stitch count</title>
<desc>The bag by stitch count, as bars sized by stitch count. Round 1: 6, Round 2: 12, Round 3: 18, Round 4: 24, Round 5: 30, Round 6: 36, Round 7: 42, Round 8: 48, Rounds 9 to 12: 48, Round 13: 54, Rounds 14 to 21: 54, Round 22: 48, Rounds 23 to 28: 48, Round 29: 24+24, Rounds 30 to 31: 48. Round 29 is the eyelet round: 24 sc and 24 chain spaces.</desc>
<rect width="480" height="608" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
