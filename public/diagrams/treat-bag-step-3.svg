666669" y="281" width="266.66666666666663" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="301" font-size="20" fill="#6d635a">R8</text><text x="140" y="301" font-size="20" fill="#2f2a26" text-anchor="end">48</text><rect x="166.66666666666669" y="311" width="266.66666666666663" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="331" font-size="20" fill="#6d635a">R9–12</text><text x="140" y="331" font-size="20" fill="#2f2a26" text-anchor="end">48</text><rect x="150" y="341" width="300" height="24" rx="4" fill="#b0604a" stroke="#8f4a37"/><text x="20" y="361" font-size="20" fill="#6d635a">R13</text><text x="140" y="361" font-size="20" fill="#2f2a26" text-anchor="end">54</text><rect x="150" y="371" width="300" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="391" font-size="20" fill="#6d635a">R14–21</text><text x="140" y="391" font-size="20" fill="#2f2a26" text-anchor="end">54</text><rect x="166.66666666666669" y="401" width="266.66666666666663" height="24" rx="4" fill="#b0604a" stroke="#8f4a37"/><text x="20" y="421" font-size="20" fill="#6d635a">R22</text><text x="140" y="421" font-size="20" fill="#2f2a26" text-anchor="end">48</text><rect x="166.66666666666669" y="431" width="266.66666666666663" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="451" font-size="20" fill="#6d635a">R23–28</text><text x="140" y="451" font-size="20" fill="#2f2a26" text-anchor="end">48</text><rect x="166.66666666666669" y="461" width="266.66666666666663" height="24" rx="4" fill="#b0604a" stroke="#8f4a37"/><text x="20" y="481" font-size="20" fill="#6d635a">R29</text><text x="140" y="481" font-size="20" fill="#2f2a26" text-anchor="end">24+24</text><rect x="166.66666666666669" y="491" width="266.66666666666663" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="511" font-size="20" fill="#6d635a">R30–31</text><text x="140" y="511" font-size="20" fill="#2f2a26" text-anchor="end">48</text><text x="20" y="542"