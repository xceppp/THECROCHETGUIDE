<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
<title>Spiderweb spoke and ring order</title>
<desc>Five spokes run from the point at row 34 to row 27 at stitches 2, 5, 8, 11, and 14. Rings sit at row 33, row 31, and row 29. The spider is sewn on the fourth spoke between the rings at rows 29 and 31.</desc>
<rect width="640" height="420" fill="#fdfaf6"/>
<style>
  text { font-family: Georgia, "Times New Roman", serif; }
  .label { font-size: 22px; fill: #2f2a26; }
  .soft { font-size: 18px; fill: #6d635a; }
  .spoke { fill: none; stroke: #2f2a26; stroke-width: 3; }
  .ring { fill: none; stroke: #b0604a; stroke-width: 3; }
</style>
<rect x="16" y="16" width="608" height="388" rx="10" fill="#f6efe6" stroke="#e6ddd1"/>
<text class="label" x="32" y="48">Spokes first, inner ring next</text>
<polygon points="250,300 150,120 350,120" fill="#fdfaf6" stroke="#2f2a26" stroke-width="3"/>
<line class="spoke" x1="250" y1="300" x2="170" y2="120"/>
<line class="spoke" x1="250" y1="300" x2="210" y2="120"/>
<line class="spoke" x1="250" y1="300" x2="250" y2="120"/>
<line class="spoke" x1="250" y1="300" x2="290" y2="120"/>
<line class="spoke" x1="250" y1="300" x2="330" y2="120"/>
<path class="ring" d="M190 250 Q250 270 310 250"/>
<path class="ring" d="M180 190 Q250 215 320 190"/>
<path class="ring" d="M168 145 Q250 168 332 145"/>
<circle cx="300" cy="168" r="8" fill="#7d8b72"/>
<text class="soft" x="380" y="130">Row 27 pins</text>
<text class="soft" x="380" y="158">Stitches 2, 5, 8, 11, 14</text>
<text class="soft" x="380" y="210">Inner ring, row 33</text>
<text class="soft" x="380" y="242">Middle ring, row 31</text>
<text class="soft" x="380" y="274">Outer ring, row 29</text>
<text class="soft" x="380" y="330">Spider on spoke 4</text>
<text class="soft" x="380" y="362">Between rows 29 and 31</text>
</svg>
