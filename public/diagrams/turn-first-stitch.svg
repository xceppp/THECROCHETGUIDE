<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 551" role="img">
<title>After ch 1 and turn: where the first sc goes</title>
<desc>Two rows of single crochet. Correct: the turning ch 1 sits beside the edge and the first sc of the new row goes into the first stitch, the last one made on the row below, so the count stays the same. Mistake: the first sc goes into the ch 1, outside the edge, which adds a stitch and makes the edge flare.</desc>
<rect width="480" height="551" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<text x="20" y="44" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">After ch 1 and turn: where the</text>
<text x="20" y="74" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">first sc goes</text><rect x="12" y="94" width="456" height="198" rx="10" fill="#f1f3ed" stroke="#7d8b72" stroke-width="2"/><text x="32" y="126" font-size="20" font-weight="bold" fill="#7d8b72">CORRECT: count stays 8</text><path d="M83 193L97 207M97 193L83 207" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M123 193L137 207M137 193L123 207" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M163 193L177 207M177 193L163 207" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M203 193L217 207M217 193L203 207" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M243 193L257 207M257 193L243 207" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M283 193L297 207M297 193L283 207" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M323 193L337 207M337 193L323 207" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M363 193L377 207M377 193L363 207" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M83 157L97 171M97 157L83 171" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M123 157L137 171M137 157L123 171" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M163 157L177 171M177 157L163 171" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M203 157L217 171M217 157L203 171" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M243 157L257 171M257 157L243 171" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M283 157L297 171M297 157L283 171" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M323 157L337 171M337 157L323 171" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M363 157L377 171M377 157L363 171" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><ellipse cx="60" cy="144" rx="11" ry="7" fill="none" stroke="#7d8b72" stroke-width="3"/><path d="M90 136 q0 -20 0 0" stroke="#b0604a"/><path d="M90 130 V150" stroke="#b0604a" stroke-width="3" marker-end="url(#ah)"/><text x="36" y="246" font-size="20" fill="#2f2a26" text-anchor="start">Ch 1 does not count. The first sc goes</text>
<text x="36" y="271" font-size="20" fill="#2f2a26" text-anchor="start">into the very first stitch at the edge.</text><rect x="12" y="306" width="456" height="223" rx="10" fill="#f8ebe5" stroke="#b0604a" stroke-width="2"/><text x="32" y="338" font-size="20" font-weight="bold" fill="#b0604a">COMMON MISTAKE: count grows to 9</text><path d="M83 405L97 419M97 405L83 419" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M123 405L137 419M137 405L123 419" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M163 405L177 419M177 405L163 419" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M203 405L217 419M217 405L203 419" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M243 405L257 419M257 405L243 419" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M283 405L297 419M297 405L283 419" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M323 405L337 419M337 405L323 419" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M363 405L377 419M377 405L363 419" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M43 369L57 383M57 369L43 383" stroke="#b0604a" stroke-width="3" stroke-linecap="round"/><path d="M83 369L97 383M97 369L83 383" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M123 369L137 383M137 369L123 383" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M163 369L177 383M177 369L163 383" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M203 369L217 383M217 369L203 383" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M243 369L257 383M257 369L243 383" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M283 369L297 383M297 369L283 383" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M323 369L337 383M337 369L323 383" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M363 369L377 383M377 369L363 383" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M50 342 V362" stroke="#b0604a" stroke-width="3" marker-end="url(#ah)"/><text x="36" y="458" font-size="20" fill="#2f2a26" text-anchor="start">An sc worked into the ch 1 sits past</text>
<text x="36" y="483" font-size="20" fill="#2f2a26" text-anchor="start">the edge. Each one adds a stitch and</text>
<text x="36" y="508" font-size="20" fill="#2f2a26" text-anchor="start">the edge leans out.</text>
</svg>
