<text x="20" y="503" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">total: 48 dc.</text><text x="20" y="536.5" font-size="20" fill="#8f4a37" text-anchor="start">Terracotta rings: the 4 corners, (3 dc, ch</text>
