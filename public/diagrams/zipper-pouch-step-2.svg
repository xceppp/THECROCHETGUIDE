<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 453" role="img">
<title>The pouch by stitch count</title>
<desc>The pouch by stitch count, as bars sized by stitch count. Round 1: 6, Round 2: 12, Round 3: 18, Round 4: 24, Round 5: 30, Round 6: 36, Round 7: 42, Round 8: 48, Rounds 9 to 23: 48. The zipper is sewn behind the top of round 23. Flattened, 48 stitches make a 6 in opening.</desc>
<rect width="480" height="453" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<circle cx="36" cy="36" r="20" fill="#b0604a"/><text x="36" y="44" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="66" y="44" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">The pouch by stitch count</text><rect x="281.25" y="71" width="37.5" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="91" font-size="20" fill="#6d635a">R1</text><text x="140" y="91" font-size="20" fill="#2f2a26" text-anchor="end">6</text><rect x="262.5" y="101" width="75" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="121" font-size="20" fill="#6d635a">R2</text><text x="140" y="121" font-size="20" fill="#2f2a26" text-anchor="end">12</text><rect x="243.75" y="131" width="112.5" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="151" font-size="20" fill="#6d635a">R3</text><text x="140" y="151" font-size="20" fill="#2f2a26" text-anchor="end">18</text><rect x="225" y="161" width="150" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="181" font-size="20" fill="#6d635a">R4</text><text x="140" y="181" font-size="20" fill="#2f2a26" text-anchor="end">24</text><rect x="206.25" y="191" width="187.5" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="211" font-size="20" fill="#6d635a">R5</text><text x="140" y="211" font-size="20" fill="#2f2a26" text-anchor="end">30</text><rect x="187.5" y="221" width="225" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="241" font-size="20" fill="#6d635a">R6</text><text x="140" y="241" font-size="20" fill="#2f2a26" text-anchor="end">36</text><rect x="168.75" y="251" width="262.5" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="271" font-size="20" fill="#6d635a">R7</text><text x="140" y="271" font-size="20" fill="#2f2a26" text-anchor="end">42</text><rect x="150" y="281" width="300" height="24" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><text x="20" y="301" font-size="20" fill="#6d635a">R8</text><text x="140" y="301" font-size="20" fill="#2f2a26" text-anchor="end">48</text><rect x="150" y="311" width="300" height="24" rx="4" fill="#b0604a" stroke="#8f4a37"/><text x="20" y="331" font-size="20" fill="#6d635a">R9–23</text><text x="140" y="331" font-size="20" fill="#2f2a26" text-anchor="end">48</text><text x="20" y="362" font-size="20" fill="#6d635a" text-anchor="start">The zipper is sewn behind the top of round</text>
<text x="20" y="387" font-size="20" fill="#6d635a" text-anchor="start">23. Flattened, 48 stitches make a 6 in</text>
<text x="20" y="412" font-size="20" fill="#6d635a" text-anchor="start">opening.</text>
</svg>
