<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 470" role="img">
<title>Walls: even rounds of 26</title>
<desc>Side view of the sleeve. The 26-stitch oval base sits flat; once the increases stop, rounds 3 to 8 work even in 26 stitches and the fabric turns up into a straight wall. No stitches are added or removed in the wall.</desc>
<rect width="480" height="470" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<circle cx="36" cy="36" r="20" fill="#b0604a"/><text x="36" y="44" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">3</text><text x="66" y="44" font-size="24" fill="#2f2a26" font-weight="bold">Walls: even rounds of 26</text><ellipse cx="240" cy="300" rx="120" ry="22" fill="none" stroke="#b0604a" stroke-width="2"/><path d="M120 300 L120 150 " stroke="#322d2a" stroke-width="3" fill="none"/><path d="M360 300 L360 150" stroke="#322d2a" stroke-width="3" fill="none"/><ellipse cx="240" cy="150" rx="120" ry="22" fill="none" stroke="#322d2a" stroke-width="3"/><rect x="120" y="150" width="240" height="150" fill="#322d2a" fill-opacity="0.08"/><ellipse cx="240" cy="174" rx="120" ry="20" fill="none" stroke="#c9bfb3" stroke-width="1.5"/><ellipse cx="240" cy="198" rx="120" ry="20" fill="none" stroke="#c9bfb3" stroke-width="1.5"/><ellipse cx="240" cy="222" rx="120" ry="20" fill="none" stroke="#c9bfb3" stroke-width="1.5"/><ellipse cx="240" cy="246" rx="120" ry="20" fill="none" stroke="#c9bfb3" stroke-width="1.5"/><ellipse cx="240" cy="270" rx="120" ry="20" fill="none" stroke="#c9bfb3" stroke-width="1.5"/><text x="370" y="158" font-size="20" fill="#6d635a">rim</text><text x="370" y="300" font-size="20" fill="#6d635a">base</text><text x="20" y="356" font-size="20" fill="#6d635a">Rnds 3-8: 26 sc each round, no increases.</text><text x="20" y="382" font-size="20" fill="#6d635a">No increases, so the tube stands up.</text><text x="20" y="408" font-size="20" fill="#6d635a">Stop at the lid seam.</text>
</svg>
