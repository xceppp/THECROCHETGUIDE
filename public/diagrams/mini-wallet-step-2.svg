 190M428 174L412 190" stroke="#2f2a26" stroke-width="3" stroke-linecap="round"/><path d="M412 122L428 138M428 122L412 138" stroke="#8f4a37" stroke-width="3" stroke-linecap="round"/><path d="M160 130 q80 -54 160 0" fill="none" stroke="#6b4428" stroke-width="4"/><text x="240" y="80" font-size="20" fill="#2f2a26" text-anchor="middle">ch 5</text><text x="20" y="228" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">6 sc and a ch-5 loop.</text><text x="20" y="265.5" font-size="20" fill="#7d8b72" text-anchor="start">Green circles: the 4 skipped stitches. The</text>
<text x="20" y="290.5" font-size="20" fill="#7d8b72" text-anchor="start">row uses 10 stitches and makes 6 sc plus</text>
<text x="20" y="315.5" font-size="20" fill="#7d8b72" text-anchor="start">the loop.</text><text x="20" y="346.5" font-size="20" fill="#6d635a" text-anchor="start">Row 33 has 10 stitches: 3 + 4 skipped + 3.</text>
<text x="20" y="371.5" font-size="20" fill="#6d635a" text-anchor="start">If the loop misses your button, redo this</text>
<text x="20" y="396.5" font-size="20" fill="#6d635a" text-anchor="start">row with ch 6 or ch 7 over the same 4</text>
<text x="20" y="421.5" font-size="20" fill="#6d635a" text-anchor="start">stitches.</text>
