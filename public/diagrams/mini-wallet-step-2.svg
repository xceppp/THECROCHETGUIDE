<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 465" role="img">
<title>Row 34: the button loop</title>
<desc>Buttonhole row over 10 stitches: sc 3, ch 5 over 4 skipped stitches, sc 3. 6 sc and a ch-5 loop. Row 33 has 10 stitches: 3 + 4 skipped + 3. If the loop misses your button, redo this row with ch 6 or ch 7 over the same 4 stitches.</desc>
<rect width="480" height="465" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
