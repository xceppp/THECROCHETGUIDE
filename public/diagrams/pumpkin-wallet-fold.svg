<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 684" role="img">
<title>Pumpkin wallet: rims, fold, side seams, and card fit</title>
<desc>Rim each long edge with 22 sc. Fold between stitches 10 and 11, right side out. Seam each short edge 10 to 10.</desc>
<rect width="480" height="684" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="16" y="36" font-size="22" fill="#2f2a26">1. On each row-end edge, work 22 sc,</text>
<text x="16" y="68" font-size="22" fill="#2f2a26">one in each row end.</text>
<text x="16" y="132" font-size="22" fill="#2f2a26">2. Embroider the face on the front</text>
<text x="16" y="164" font-size="22" fill="#2f2a26">half.</text>
<text x="16" y="228" font-size="22" fill="#2f2a26">3. Fold between stitches 10 and 11,</text>
<text x="16" y="260" font-size="22" fill="#2f2a26">right side out.</text>
<text x="16" y="324" font-size="22" fill="#2f2a26">4. Seam the foundation edge to</text>
<text x="16" y="356" font-size="22" fill="#2f2a26">itself, 10 stitches to 10. Repeat on</text>
<text x="16" y="388" font-size="22" fill="#2f2a26">the last row.</text>
<text x="16" y="452" font-size="22" fill="#2f2a26">The top stays open.</text>
<text x="16" y="516" font-size="22" fill="#2f2a26">Outside about 4.25 by 2.5 in. Inside</text>
<text x="16" y="548" font-size="22" fill="#2f2a26">on paper about 3.9 by 2.4 in.</text>
<text x="16" y="612" font-size="22" fill="#2f2a26">Put a card in before you finish the</text>
<text x="16" y="644" font-size="22" fill="#2f2a26">seams. Sizes are from gauge.</text>
</g>
</svg>
