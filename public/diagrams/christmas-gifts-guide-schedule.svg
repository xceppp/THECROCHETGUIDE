<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
<title>Schedule Christmas crochet gifts by the calendar</title>
<desc>One evening covers a flat pocket, a mug cozy, a snowflake that still needs a day to dry, a scrunchie, a flower, a leaf, or coasters. A weekend covers a beanie, ear warmer, gloves, a measured sleeve, or a bottle bag. October is the start for a gnome, a tree, a scarf, a hood, a blanket, or slippers.</desc>
<rect width="640" height="420" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="20" y="32" font-size="20" fill="#2f2a26" font-weight="bold">Pick the window, then the tutorial</text>
<rect x="16" y="48" width="196" height="320" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="28" y="76" font-size="18" fill="#b0604a" font-weight="bold">One evening</text>
<text x="28" y="108" font-size="16" fill="#2f2a26">Gift card pocket</text>
<text x="28" y="132" font-size="16" fill="#2f2a26">Mug cozy</text>
<text x="28" y="156" font-size="16" fill="#2f2a26">Snowflake, plus dry time</text>
<text x="28" y="180" font-size="16" fill="#2f2a26">Scrunchie or flower</text>
<text x="28" y="204" font-size="16" fill="#2f2a26">Leaf or coasters</text>
<text x="28" y="240" font-size="16" fill="#6d635a">Stiffener needs a day.</text>
<text x="28" y="264" font-size="16" fill="#6d635a">Sewing ends the pocket.</text>
<rect x="222" y="48" width="196" height="320" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="234" y="76" font-size="18" fill="#b0604a" font-weight="bold">A weekend</text>
<text x="234" y="108" font-size="16" fill="#2f2a26">Chunky beanie</text>
<text x="234" y="132" font-size="16" fill="#2f2a26">Ear warmer</text>
<text x="234" y="156" font-size="16" fill="#2f2a26">Fingerless gloves</text>
<text x="234" y="180" font-size="16" fill="#2f2a26">Book or reader sleeve</text>
<text x="234" y="204" font-size="16" fill="#2f2a26">Wine bottle bag</text>
<text x="234" y="240" font-size="16" fill="#6d635a">Measure before round 1.</text>
<text x="234" y="264" font-size="16" fill="#6d635a">Bulky yarn moves faster.</text>
<rect x="428" y="48" width="196" height="320" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="440" y="76" font-size="18" fill="#b0604a" font-weight="bold">From October</text>
<text x="440" y="108" font-size="16" fill="#2f2a26">Gnome</text>
<text x="440" y="132" font-size="16" fill="#2f2a26">Christmas tree</text>
<text x="440" y="156" font-size="16" fill="#2f2a26">Scarf or hood</text>
<text x="440" y="180" font-size="16" fill="#2f2a26">Baby blanket</text>
<text x="440" y="204" font-size="16" fill="#2f2a26">Slippers</text>
<text x="440" y="240" font-size="16" fill="#6d635a">Wash the blanket swatch.</text>
<text x="440" y="264" font-size="16" fill="#6d635a">Do not add a Santa too.</text>
<text x="20" y="396" font-size="16" fill="#6d635a">Time ten rows in your yarn, then add ends, sewing, and any drying.</text>
</g>
</svg>
