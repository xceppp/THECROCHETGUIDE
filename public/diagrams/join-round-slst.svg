<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 584" role="img">
<title>Joined rounds: keep the seam straight</title>
<desc>Rounds shown unrolled as strips, with the join of each round marked. Correct: slip stitch into the top of the first sc, ch 1, and work the first sc of the next round into that same stitch; the joins stack in a straight line. Mistake: the first sc goes into the next stitch instead, so every join moves one stitch sideways and the seam slants.</desc>
<rect width="480" height="584" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker></defs>
<text x="20" y="44" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Joined rounds: keep the seam</text>
<text x="20" y="74" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">straight</text><rect x="12" y="94" width="456" height="227" rx="10" fill="#f1f3ed" stroke="#7d8b72" stroke-width="2"/><text x="32" y="126" font-size="20" font-weight="bold" fill="#7d8b72">CORRECT: joins stack</text><rect x="40" y="197" width="400" height="18" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><circle cx="170" cy="206" r="6" fill="#b0604a"/><rect x="40" y="175" width="400" height="18" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><circle cx="170" cy="184" r="6" fill="#b0604a"/><rect x="40" y="153" width="400" height="18" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><circle cx="170" cy="162" r="6" fill="#b0604a"/><rect x="40" y="131" width="400" height="18" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><circle cx="170" cy="140" r="6" fill="#b0604a"/><text x="36" y="250" font-size="20" fill="#2f2a26" text-anchor="start">Sl st to the first sc, ch 1, then the</text>
<text x="36" y="275" font-size="20" fill="#2f2a26" text-anchor="start">first sc of the next round goes in the</text>
<text x="36" y="300" font-size="20" fill="#2f2a26" text-anchor="start">same stitch as the join.</text><rect x="12" y="335" width="456" height="227" rx="10" fill="#f8ebe5" stroke="#b0604a" stroke-width="2"/><text x="32" y="367" font-size="20" font-weight="bold" fill="#b0604a">COMMON MISTAKE: joins walk sideways</text><rect x="40" y="438" width="400" height="18" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><circle cx="170" cy="447" r="6" fill="#b0604a"/><rect x="40" y="416" width="400" height="18" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><circle cx="204" cy="425" r="6" fill="#b0604a"/><rect x="40" y="394" width="400" height="18" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><circle cx="238" cy="403" r="6" fill="#b0604a"/><rect x="40" y="372" width="400" height="18" rx="4" fill="#f6efe6" stroke="#c9bfb3"/><circle cx="272" cy="381" r="6" fill="#b0604a"/><text x="36" y="491" font-size="20" fill="#2f2a26" text-anchor="start">Starting in the next stitch skips one.</text>
<text x="36" y="516" font-size="20" fill="#2f2a26" text-anchor="start">The seam slants and the round comes up</text>
<text x="36" y="541" font-size="20" fill="#2f2a26" text-anchor="start">one short.</text>
</svg>
