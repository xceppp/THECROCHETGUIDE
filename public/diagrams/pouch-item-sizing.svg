<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
<title>Sizing a drawstring pouch from what goes in it</title>
<desc>Left: the folded pouch, 28 stitches wide and 25 rows tall per side, with a drawstring line near the top. Items inside: the widest is 5.75 inches, the thickest is 0.75 inch, and the tallest is 3.5 inches. Width is 5.75 plus 0.75 for thickness plus 0.5 ease, 7 inches or 28 stitches. Height is 3.5 plus 1.5 inches for the gather, 5 inches, so the rectangle is 50 rows before folding.</desc>
<rect width="640" height="420" fill="#fdfaf6"/>
<style>
  text { font-family: Georgia, "Times New Roman", serif; }
  .label { font-size: 20px; fill: #2f2a26; }
  .soft { font-size: 16px; fill: #6d635a; }
  .fab { fill: #f3e6d4; stroke: #6b4428; stroke-width: 4; }
  .item { fill: #ffffff; stroke: #2f2a26; stroke-width: 2; }
  .cord { fill: none; stroke: #b0604a; stroke-width: 3; stroke-dasharray: 6 4; }
  .arrow { fill: none; stroke: #7d8b72; stroke-width: 3; }
</style>
<rect x="16" y="16" width="608" height="388" rx="10" fill="#f6efe6" stroke="#e6ddd1"/>
<text class="label" x="32" y="46">The pouch is sized from its contents</text>
<rect class="fab" x="60" y="90" width="240" height="200"/>
<line class="cord" x1="60" y1="110" x2="300" y2="110"/>
<rect class="item" x="80" y="170" width="190" height="110" rx="6"/>
<rect class="item" x="100" y="200" width="60" height="70" rx="30"/>
<text class="soft" x="170" y="232">items</text>
<path class="arrow" d="M312 170 V282 M306 176 L312 170 L318 176 M306 276 L312 282 L318 276"/>
<text class="soft" x="322" y="232">tallest 3.5 in</text>
<path class="arrow" d="M312 92 V166 M306 98 L312 92 L318 98 M306 160 L312 166 L318 160"/>
<text class="soft" x="322" y="134">gather 1.5 in</text>
<text class="soft" x="64" y="314">28 sc wide, 25 rows per side</text>
<text class="soft" x="32" y="350">Width: 5.75 widest + 0.75 thickest + 0.5 ease = 7.0 in = 28 sc</text>
<text class="soft" x="32" y="376">Height: 3.5 + 1.5 = 5.0 in per side, x 2 sides = 50 rows</text>
</svg>
