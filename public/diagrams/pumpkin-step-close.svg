<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 322" role="img">
<title>Tab, snap, then stem</title>
<desc>The stem stands on the back rim after the tab is sewn inside.</desc>
<rect width="480" height="322" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="240" y="40" font-size="22" fill="#2f2a26" text-anchor="middle" font-weight="bold">Close the back</text>
<rect x="140" y="110" width="200" height="150" rx="16" fill="#f6efe6" stroke="#2f2a26" stroke-width="3"/>
<rect x="210" y="70" width="60" height="50" rx="8" fill="#7d8b72" stroke="#2f2a26" stroke-width="3"/>
<circle cx="240" cy="180" r="10" fill="#b0604a"/>
<text x="240" y="300" font-size="22" fill="#2f2a26" text-anchor="middle">stem on the back rim</text>
</svg>
