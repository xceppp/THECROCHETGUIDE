<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 322" role="img">
<title>Pumpkin wallet: tab, snap, stem</title>
<desc>Sew the tab inside the back rim, mark the snap with a card inside, then stand the stem on the tab's base.</desc>
<rect width="480" height="322" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<text x="16" y="40" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Pumpkin wallet: tab, snap, stem</text>
<rect x="16" y="72" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="100" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Tab base on the middle 3 rim stitches</text>
<text x="32" y="126" font-size="20" fill="#6d635a" text-anchor="start">Inside the back rim.</text>
<rect x="16" y="150" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="178" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Mark the snap with a card in</text>
<text x="32" y="204" font-size="20" fill="#6d635a" text-anchor="start">Ball under the tab, socket on the front.</text>
<rect x="16" y="228" width="448" height="66" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="256" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Stem stands on the base</text>
<text x="32" y="282" font-size="20" fill="#6d635a" text-anchor="start">The tab still folds by itself.</text>
</svg>
