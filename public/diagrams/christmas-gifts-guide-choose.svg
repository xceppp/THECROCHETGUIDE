<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img">
<title>Choose a Christmas crochet gift you can finish</title>
<desc>If you can measure an owned object, choose a beanie, gloves, a device sleeve, a bottle bag, or slippers. If you cannot measure, choose a scrunchie, an ornament, a gift card holder, or an ear warmer. Read the linked tutorial before buying yarn.</desc>
<rect width="640" height="420" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="20" y="36" font-size="22" fill="#2f2a26" font-weight="bold">Choose by what you can know</text>
<rect x="16" y="56" width="296" height="300" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="32" y="88" font-size="18" fill="#7d8b72" font-weight="bold">You can measure</text>
<text x="32" y="124" font-size="16" fill="#2f2a26">Beanie from a hat they wear</text>
<text x="32" y="150" font-size="16" fill="#2f2a26">Gloves from a glove they own</text>
<text x="32" y="176" font-size="16" fill="#2f2a26">Sleeve from the real device</text>
<text x="32" y="202" font-size="16" fill="#2f2a26">Bottle bag from that bottle</text>
<text x="32" y="228" font-size="16" fill="#2f2a26">Mug cozy from that mug</text>
<text x="32" y="270" font-size="16" fill="#6d635a">Open the tutorial and copy</text>
<text x="32" y="294" font-size="16" fill="#6d635a">its measurement list, not a</text>
<text x="32" y="318" font-size="16" fill="#6d635a">size from a different brand.</text>
<rect x="328" y="56" width="296" height="300" rx="8" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="344" y="88" font-size="18" fill="#b0604a" font-weight="bold">You cannot measure</text>
<text x="344" y="124" font-size="16" fill="#2f2a26">Scrunchie from an elastic</text>
<text x="344" y="150" font-size="16" fill="#2f2a26">Snowflake or the flat star</text>
<text x="344" y="176" font-size="16" fill="#2f2a26">Gift card holder</text>
<text x="344" y="202" font-size="16" fill="#2f2a26">Ear warmer, which stretches</text>
<text x="344" y="228" font-size="16" fill="#2f2a26">Flower sewn to a plain gift</text>
<text x="344" y="270" font-size="16" fill="#6d635a">Skip slippers. The instep</text>
<text x="344" y="294" font-size="16" fill="#6d635a">only the foot can give.</text>
<text x="344" y="318" font-size="16" fill="#6d635a">Skip a guessed phone size.</text>
<text x="20" y="388" font-size="16" fill="#6d635a">This page selects a tutorial. The stitch pattern stays on the linked page.</text>
</g>
</svg>
