<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1320" role="img">
<title>Witch-hat wallet: stitch 12 is at the top opening</title>
<desc>Front, divider, and back meet at the bottom fold. Count side stitches upward. Positions 1 to 11 pass through all three layers. Position 12 is at the top, above the shorter divider, and passes through front and back only. Both pocket openings and the flap stay free. The hat stays above the buttonhole.</desc>
<rect width="480" height="1320" fill="#fdfaf6"/>
<style>text{font-family:Georgia,"Times New Roman",serif}</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0604a"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#7d8b72" stroke-width="1.5"/></pattern>
</defs>

<text x="16" y="34" font-size="24" fill="#2f2a26" text-anchor="start" font-weight="bold">Count the side seam upward</text>
<text x="16" y="68" font-size="20" fill="#2f2a26" text-anchor="start" font-weight="bold">TOP: pocket opening</text>
<rect x="36" y="90" width="80" height="250" fill="#c4b6e0" stroke="#2f2a26" stroke-width="3"/>
<rect x="140" y="150" width="80" height="190" fill="url(#hatch)" stroke="#2f2a26" stroke-width="3"/>
<rect x="244" y="90" width="80" height="250" fill="#8d6bb5" stroke="#2f2a26" stroke-width="3"/>
<text x="48" y="220" font-size="20" fill="#2f2a26" text-anchor="start" font-weight="bold">back</text>
<text x="148" y="250" font-size="20" fill="#2f2a26" text-anchor="start" font-weight="bold">divider</text>
<text x="256" y="220" font-size="20" fill="#fdfaf6" text-anchor="start" font-weight="bold">front</text>
<line x1="150" y1="150" x2="230" y2="150" stroke="#b0604a" stroke-width="4"/>
<text x="336" y="130" font-size="22" fill="#b0604a" text-anchor="start" font-weight="bold">12</text>
<text x="336" y="158" font-size="20" fill="#b0604a" text-anchor="start">front +</text>
<text x="336" y="184" font-size="20" fill="#b0604a" text-anchor="start">back only</text>
<line x1="36" y1="340" x2="324" y2="340" stroke="#b0604a" stroke-width="5"/>
<text x="16" y="376" font-size="20" fill="#2f2a26" text-anchor="start" font-weight="bold">BOTTOM: fold</text>
<text x="16" y="408" font-size="20" fill="#2f2a26" text-anchor="start">Divider chains sewn along this fold.</text>
<rect x="12" y="440" width="456" height="460" rx="10" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="28" y="472" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">1 at the fold, 12 at the top</text>
<line x1="48" y1="510" x2="130" y2="510" stroke="#b0604a" stroke-width="4"/>
<text x="146" y="518" font-size="22" fill="#b0604a" text-anchor="start" font-weight="bold">12 front + back</text>
<line x1="48" y1="560" x2="180" y2="560" stroke="#2f2a26" stroke-width="3"/><text x="196" y="568" font-size="20" fill="#2f2a26" text-anchor="start" font-weight="bold">11</text><line x1="48" y1="584" x2="180" y2="584" stroke="#2f2a26" stroke-width="3"/><text x="196" y="592" font-size="20" fill="#2f2a26" text-anchor="start" font-weight="bold">10</text><line x1="48" y1="608" x2="180" y2="608" stroke="#2f2a26" stroke-width="3"/><text x="196" y="616" font-size="20" fill="#2f2a26" text-anchor="start" font-weight="bold">9</text><line x1="48" y1="632" x2="180" y2="632" stroke="#2f2a26" stroke-width="3"/><text x="196" y="640" font-size="20" fill="#2f2a26" text-anchor="start" font-weight="bold">8</text><line x1="48" y1="656" x2="180" y2="656" stroke="#2f2a26" stroke-width="3"/><text x="196" y="664" font-size="20" fill="#2f2a26" text-anchor="start" font-weight="bold">7</text><line x1="48" y1="680" x2="180" y2="680" stroke="#2f2a26" stroke-width="3"/><text x="196" y="688" font-size="20" fill="#2f2a26" text-anchor="start" font-weight="bold">6</text><line x1="48" y1="704" x2="180" y2="704" stroke="#2f2a26" stroke-width="3"/><text x="196" y="712" font-size="20" fill="#2f2a26" text-anchor="start" font-weight="bold">5</text><line x1="48" y1="728" x2="180" y2="728" stroke="#2f2a26" stroke-width="3"/><text x="196" y="736" font-size="20" fill="#2f2a26" text-anchor="start" font-weight="bold">4</text><line x1="48" y1="752" x2="180" y2="752" stroke="#2f2a26" stroke-width="3"/><text x="196" y="760" font-size="20" fill="#2f2a26" text-anchor="start" font-weight="bold">3</text><line x1="48" y1="776" x2="180" y2="776" stroke="#2f2a26" stroke-width="3"/><text x="196" y="784" font-size="20" fill="#2f2a26" text-anchor="start" font-weight="bold">2</text><line x1="48" y1="800" x2="180" y2="800" stroke="#2f2a26" stroke-width="3"/><text x="196" y="808" font-size="20" fill="#2f2a26" text-anchor="start" font-weight="bold">1</text>
<text x="28" y="860" font-size="20" fill="#2f2a26" text-anchor="start">1-11: front, divider, and back</text>
<text x="28" y="888" font-size="20" fill="#2f2a26" text-anchor="start">BOTTOM of this list is the fold.</text>
<rect x="12" y="920" width="456" height="340" rx="10" fill="#f6efe6" stroke="#e6ddd1"/>
<text x="28" y="952" font-size="22" fill="#2f2a26" text-anchor="start" font-weight="bold">Leave these free</text>
<rect x="40" y="980" width="200" height="36" fill="none" stroke="#b0604a" stroke-width="4"/>
<text x="250" y="1006" font-size="20" fill="#2f2a26" text-anchor="start">front opening</text>
<rect x="40" y="1030" width="170" height="32" fill="none" stroke="#7d8b72" stroke-width="4"/>
<text x="220" y="1054" font-size="20" fill="#2f2a26" text-anchor="start">divider opening</text>
<text x="40" y="1110" font-size="20" fill="#2f2a26" text-anchor="start" font-weight="bold">flap stays outside the seams</text>
<polygon points="80,1140 200,1140 176,1220 104,1220" fill="#2f2a26"/>
<rect x="124" y="1210" width="32" height="14" fill="#b0604a"/>
<text x="220" y="1180" font-size="20" fill="#2f2a26" text-anchor="start">hat above</text>
<text x="220" y="1208" font-size="20" fill="#2f2a26" text-anchor="start">the buttonhole</text>
<text x="16" y="1288" font-size="20" fill="#6d635a" text-anchor="start">Legend: hatch = divider. 12 is the top stitch.</text>

</svg>
