<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 716" role="img">
<title>Witch hat wallet: divider and three-layer side seams</title>
<desc>Divider is 17 stitches by 11 rows. Sew its whole bottom edge into the fold. Each side seam is 11 three-layer stitches and 1 two-layer stitch.</desc>
<rect width="480" height="716" fill="#fdfaf6"/>
<g font-family="Georgia, Times New Roman, serif">
<text x="16" y="36" font-size="22" fill="#2f2a26">The divider is 17 sc wide and 11</text>
<text x="16" y="68" font-size="22" fill="#2f2a26">rows tall, one row shorter than the</text>
<text x="16" y="100" font-size="22" fill="#2f2a26">front.</text>
<text x="16" y="164" font-size="22" fill="#2f2a26">Whipstitch all 17 foundation chains</text>
<text x="16" y="196" font-size="22" fill="#2f2a26">to the inside of the bottom fold.</text>
<text x="16" y="260" font-size="22" fill="#2f2a26">The seam must be continuous or a</text>
<text x="16" y="292" font-size="22" fill="#2f2a26">card can pass under the divider.</text>
<text x="16" y="356" font-size="22" fill="#2f2a26">Each side: 11 sc through front,</text>
<text x="16" y="388" font-size="22" fill="#2f2a26">divider, and back.</text>
<text x="16" y="452" font-size="22" fill="#2f2a26">The 12th sc catches front and back</text>
<text x="16" y="484" font-size="22" fill="#2f2a26">only.</text>
<text x="16" y="548" font-size="22" fill="#2f2a26">Repeat on the other side. The flap</text>
<text x="16" y="580" font-size="22" fill="#2f2a26">stays outside both seams.</text>
<text x="16" y="644" font-size="22" fill="#2f2a26">Test one card in each pocket before</text>
<text x="16" y="676" font-size="22" fill="#2f2a26">you weave the ends.</text>
</g>
</svg>
